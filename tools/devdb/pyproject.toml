[project]
name = "kompas-devdb"
version = "0.1.0"
description = "Local PostgreSQL for development and tests without Docker (pip-installed binaries via pgserver)"
requires-python = ">=3.12,<3.13"  # pgserver has no CPython 3.13 wheels yet; the app itself runs on 3.13
dependencies = ["pgserver>=0.1.4"]

[project.scripts]
kompas-devdb = "devdb:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["devdb.py"]
