# Клинический компас — run from the bundle (images loaded with `docker load`, nothing is built).
# Same services as the repository's compose.yaml, minus the build step. Start with ./start.sh.
name: kompas

x-backend: &backend
  image: ${KOMPAS_IMAGE:-kompas-backend:bundle}
  pull_policy: never
  restart: unless-stopped
  environment: &backend-env
    KOMPAS_DATABASE_URL: postgresql+asyncpg://kompas:${POSTGRES_PASSWORD:?set in .env}@db:5432/kompas
    KOMPAS_JWT_SECRET: ${KOMPAS_JWT_SECRET:?set in .env (32+ characters)}
    KOMPAS_INVITE_SECRET: ${KOMPAS_INVITE_SECRET:?set in .env (32+ characters)}
    KOMPAS_OHLP_CSV: /data/ohlp_fields.csv
    KOMPAS_DEMO_MODE: ${KOMPAS_DEMO_MODE:-true}    # «Попробовать как пациент / как врач» buttons on the login page
  volumes:
    - ${KOMPAS_OHLP_HOST_PATH:-./data/ohlp_fields_v4.csv}:/data/ohlp_fields.csv:ro

services:
  db:
    image: postgres:16-alpine
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_USER: kompas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: kompas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kompas -d kompas"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    restart: "no"
    entrypoint: ["alembic", "upgrade", "head"]
    command: []
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    ports:
      - "${KOMPAS_WEB_BIND:-127.0.0.1}:${KOMPAS_WEB_PORT:-8080}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      # keywords = no model needed; llm = Qwen3-4B + opus-mt-ru-en from ./hf/hub (~16 GB RAM)
      KOMPAS_TEXT_MODEL: ${KOMPAS_TEXT_MODEL:-keywords}
      HF_HUB_CACHE: /hf/hub
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${KOMPAS_OHLP_HOST_PATH:-./data/ohlp_fields_v4.csv}:/data/ohlp_fields.csv:ro
      - ${HF_CACHE_HOST_PATH:-./hf/hub}:/hf/hub:ro
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
