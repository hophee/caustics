[project]
name = "kompas"
version = "0.1.0"
description = "Клинический компас — clinical decision support backend (team «Каустики»)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "torch>=2.8",
    "transformers>=5.0",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "sacremoses>=0.2.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
kompas = "kompas.cli:main"

# PyTorch from the CPU-only index (the text model runs on CPU; no CUDA wheels).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kompas"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text is intentional

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Body", "fastapi.Header", "fastapi.Depends"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
