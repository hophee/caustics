# Complaints catalogue for the patient diary. Source: prototype revision 6 (team).
# Codes are stable ids used by diary entries and triage rules; never rename a code.
categories:
  - code: affective
    name: "Аффективные и эмоциональные жалобы (расстройства настроения)"
    complaints:
      - code: low_mood
        name: "Сниженное и угнетённое настроение"
        description: "Устойчивые переживания печали, подавленности, грусти, тоски, отчаяния, безнадёжности и душевной боли."
      - code: anhedonia
        name: "Ангедония и эмоциональное притупление"
        description: "Утрата интересов и способности получать удовольствие от привычной деятельности/хобби, чувственный «паралич» (неспособность испытывать радость, любовь или горе)."
      - code: fatigue
        name: "Упадок сил и астения"
        description: "Повышенная утомляемость, снижение физической энергии и активности даже при незначительных усилиях."
      - code: euphoria
        name: "Эйфория и гипоманиакальные проявления"
        description: "Необоснованно приподнятое, экспансивное настроение, повышенная энергичность, ускорение мыслей («скачка идей»), повышенная разговорчивость («речевой напор»)."
      - code: lability
        name: "Эмоциональная лабильность"
        description: "Резкие перепады настроения, вспыльчивость, плаксивость, раздражительность и дисфория."
  - code: anxiety
    name: "Тревожные, фобические и пароксизмальные жалобы"
    complaints:
      - code: generalized_anxiety
        name: "Генерализованная и первичная тревога"
        description: "Постоянное чувство внутреннего напряжения, «нервозности», беспокойства по разным повседневным поводам (тревожные руминации — озабоченность работой, финансами, здоровьем близких) и ожидание надвигающейся беды."
      - code: panic_attacks
        name: "Панические приступы"
        description: "Внезапно возникающие дискретные эпизоды интенсивного страха, ужаса или выраженного дискомфорта, нарастающие до максимума за несколько минут."
      - code: specific_fears
        name: "Изолированные и ситуационные страхи"
        description: "Страх смерти (танатофобия), страх сойти с ума или потерять контроль над собой, страх инфаркта/инсульта, а также страхи специфических объектов (животных, уколов, высоты)."
      - code: phobias
        name: "Пространственные и социальные фобии"
        description: "Страх перед открытыми пространствами, толпой, поездками в общественном транспорте (агорафобия), страх выходить из дома в одиночку, скованность и застенчивость в общении с людьми."
      - code: derealization
        name: "Явления расстройства восприятия себя и среды"
        description: "Ощущение нереальности окружающего мира (дереализация) или отчуждения собственного «Я» (деперсонализация)."
  - code: obsessive
    name: "Обсессивно-компульсивные жалобы (навязчивости)"
    complaints:
      - code: obsessions
        name: "Навязчивые мысли (обсессии)"
        description: "Непроизвольное появление и назойливое присутствие стереотипных мыслей, сомнений, воспоминаний или опасных представлений (страх загрязнения, богохульные мысли, контрастные опасения причинить вред)."
      - code: compulsions
        name: "Навязчивые действия и ритуалы (компульсии)"
        description: "Мучительная потребность многократно перепроверять свои действия (закрыты ли двери, выключен ли газ) или повторять стереотипные ритуалы (мытьё рук, пересчёт предметов, расстановка вещей в «правильном» порядке)."
      - code: incompleteness
        name: "Чувство «незавершённости»"
        description: "Выраженный дискомфорт, если действия или предметы вокруг расположены «неправильно»."
  - code: trauma
    name: "Травматические и стресс-ассоциированные жалобы (ПТСР)"
    complaints:
      - code: intrusions
        name: "Повторное проживание травмы (интрузии)"
        description: "Наплывы навязчивых тяжёлых воспоминаний о психотравме, яркие флешбэки («оживление» событий в настоящем времени) и повторные ночные кошмары."
      - code: avoidance
        name: "Стремление к избеганию"
        description: "Активное физическое и психическое избегание мыслей, разговоров, людей, мест и ситуаций, напоминающих о травме."
      - code: hyperarousal
        name: "Гиперактивация и гипервигилитет"
        description: "Постоянное ощущение угрозы, повышенная настороженность, усиленная реакция испуга на резкие раздражители."
      - code: amnesia
        name: "Психогенная амнезия"
        description: "Невозможность вспомнить важные детали пережитого травматического события."
  - code: somatic
    name: "Соматовегетативные и физикальные жалобы"
    complaints:
      - code: cardiovascular
        name: "Сердечно-сосудистые"
        description: "Тахикардия, сильное или учащённое сердцебиение, боли и дискомфорт в грудной клетке, перепады артериального давления."
      - code: respiratory
        name: "Респираторные"
        description: "Затруднённое дыхание, чувство нехватки воздуха, приступы удушья, ощущение «кома в горле»."
      - code: gastrointestinal
        name: "Желудочно-кишечные"
        description: "Тошнота, жжение в желудке, боль и дискомфорт в животе, метеоризм, диарея, снижение или резкое усиление аппетита (переедание)."
      - code: musculoskeletal
        name: "Мышечно-неврологические"
        description: "Мышечное напряжение и боли (в шее, спине, конечностях), подёргивания в мышцах, тремор/дрожь, головные боли напряжения, головокружение, слабость в ногах, ощущение покалывания и онемения (парестезии)."
      - code: autonomic
        name: "Вегетативные"
        description: "Повышенное потоотделение, сухость во рту, приливы жара или озноба, бледность или гиперемия кожных покровов."
      - code: sleep
        name: "Нарушения сна"
        description: "Трудности засыпания, прерывистый сон, ранние утренние пробуждения, отсутствие чувства отдыха после сна, кошмарные сновидения."
      - code: sexual
        name: "Сексуальные расстройства"
        description: "Снижение или полная потеря сексуального влечения (либидо), импотенция."
  - code: cognitive
    name: "Когнитивные и идеаторные жалобы"
    complaints:
      - code: attention
        name: "Нарушения внимания и мышления"
        description: "Трудности при необходимости сконцентрироваться, сниженная способность к длительному сосредоточению, ощущение «пустоты в голове»."
      - code: memory
        name: "Проблемы с памятью"
        description: "Трудности запоминания и воспроизведения новой информации, потеря мысли."
      - code: self_esteem
        name: "Нарушения самооценки"
        description: "Снижение уверенности в себе, ощущение собственной никчёмности, малоценности и несостоятельности."
      - code: guilt_hopelessness
        name: "Идеи вины и безнадёжности"
        description: "Беспричинные самоупрёки, неадекватное чувство вины, мрачное пессимистическое видение будущего."
      - code: suicidal_thoughts
        name: "Суицидальные мысли"
        critical: true
        description: "Повторяющиеся мысли о смерти, мысли покончить с собой или намерения причинить себе вред."
  - code: psychotic
    name: "Продуктивные и психотические жалобы (при психозах и шизофрении)"
    complaints:
      - code: hallucinations
        name: "Обманы восприятия"
        description: "Слуховые и вербальные галлюцинации («голоса», комментирующие или обвиняющие пациента), псевдогаллюцинации."
      - code: delusions
        name: "Бредовые идеи"
        description: "Мысли о том, что другие наблюдают за пациентом, говорят о нём, хотят причинить вред (бред преследования), бред отношения, бред виновности или бред воздействия (ощущение, что кто-то управляет мыслями)."
      - code: preoccupation
        name: "Загруженность внутренними переживаниями"
        description: "Поглощённость внутренними фантазиями и отгороженность от реальности."
  - code: behavioral
    name: "Поведенческие и социальные жалобы"
    complaints:
      - code: social_withdrawal
        name: "Социальное самоустранение"
        description: "Утрата социальных связей, уход от общения с родственниками и друзьями, социальная изоляция."
      - code: aggression
        name: "Импульсивность и агрессивность"
        description: "Вспышки гнева, крики, импульсы швырять вещи или ломать предметы."
      - code: avoidant_behavior
        name: "Ограничительное (избегающее) поведение"
        description: "Отказ от посещения определённых мест, транспорта или видов деятельности из-за страха."
      - code: reduced_function
        name: "Снижение продуктивности"
        description: "Невозможность продолжать трудовую или бытовую деятельность без посторонней помощи."
