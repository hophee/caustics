# CES — КР F43.1, приложение Г6. Категория 0 (вне классификации): по КР — пациент, 7 вопросов.
# Шкала ответа — от 0 до 3 или от 0 до 4 (у пунктов 3 и 4 пятой градации нет).
# Интерпретация КР («примечания к компьютерной версии») — в процентах от максимума (26);
# 0% ключом не охвачен — отнесён к «низкому уровню».
code: CES
version: 1
name: CES · шкала оценки интенсивности боевого опыта (Т. Кин)
measures: combat_exposure
direction: higher_is_worse
diagnoses:
- F43.1
filled_by: patient
source: КР F43.1, приложение Г6, стр. PDF 178–180
items:
- id: 1
  text: Сколько раз вы ходили в военный дозор, принимали участие в десантной операции или выполняли другое задание в условиях
    повышенной опасности?
  options:
  - value: 0
    label: Ни разу
  - value: 1
    label: 1–2 раза
  - value: 2
    label: 3–12 раз
  - value: 3
    label: 13–50 раз
  - value: 4
    label: Более чем 50 раз
- id: 2
  text: Сколько месяцев вы находились в зоне обстрела со стороны противника?
  options:
  - value: 0
    label: Ни разу
  - value: 1
    label: Менее 1 месяца
  - value: 2
    label: 1–3 месяца
  - value: 3
    label: 4–6 месяцев
  - value: 4
    label: Более, чем 6 месяцев
- id: 3
  text: Как часто вы находились в окружении врага?
  options:
  - value: 0
    label: Ни разу
  - value: 1
    label: 1–2 раза
  - value: 2
    label: 3–12 раз
  - value: 3
    label: Более 12 раз
- id: 4
  text: Сколько человек в вашем подразделении было убито, ранено или пропало без вести во время военных действий?
  options:
  - value: 0
    label: Ни одного
  - value: 1
    label: Между 1–25%
  - value: 2
    label: Между 26–50%
  - value: 3
    label: Более, чем 50%
- id: 5
  text: Сколько раз вы участвовали в обстреле противника?
  options:
  - value: 0
    label: Ни разу
  - value: 1
    label: 1–2 раза
  - value: 2
    label: 3–12 раз
  - value: 3
    label: 13–50 раз
  - value: 4
    label: Более чем 50 раз
- id: 6
  text: Сколько раз вы наблюдали, как кто-то был убит или ранен в ходе боевых действий?
  options:
  - value: 0
    label: Ни разу
  - value: 1
    label: 1–2 раза
  - value: 2
    label: 3–12 раз
  - value: 3
    label: 13–50 раз
  - value: 4
    label: Более чем 50 раз
- id: 7
  text: Сколько раз вы подвергались опасности быть убитым или раненым (пулями, снарядами, холодным оружием), попадали в засаду,
    в другие очень опасные ситуации?
  options:
  - value: 0
    label: Ни разу
  - value: 1
    label: 1–2 раза
  - value: 2
    label: 3–12 раз
  - value: 3
    label: 13–50 раз
  - value: 4
    label: Более чем 50 раз
scoring:
  method: sum
  bands_basis: percent_of_max
  bands:
  - lower: 0
    upper: 20
    code: low
    level: 0
    label: Низкий уровень
  - lower: 21
    upper: 40
    code: below_avg
    level: 1
    label: Пониженный уровень
  - lower: 41
    upper: 60
    code: moderate
    level: 2
    label: Умеренный уровень
  - lower: 61
    upper: 80
    code: elevated
    level: 3
    label: Повышенный уровень
  - lower: 81
    upper: 100
    code: high
    level: 4
    label: Высокий уровень
  round: 0
notes:
- 'CES: категория определяется по проценту от максимума, округлённому до целого; исходная сумма сохраняется.'
