# PHQ, панический модуль — КР F41.0, приложение Г3. Шкала самоотчёта.
# Это не PHQ-9: PHQ-9 в КР отсутствует (см. phq9.yaml, «вне КР»).
# Пункты 1b–1d задаются при ответе «Да» на 1a; пункт 2 — о последнем приступе.
code: PHQ-PD
version: 1
name: "PHQ, панический модуль · скрининговый опросник для выявления панических атак"
measures: panic_screening
direction: higher_is_worse
diagnoses: [F41.0]
filled_by: patient_clinician
source: "КР F41.0, приложение Г3, стр. PDF 90–91"

answer_sets:
  yes_no:
    - {value: 0, label: "Нет"}
    - {value: 1, label: "Да"}

items:
  - id: "1a"
    text: "испытывали ли вы приступы (атаки) внезапной тревоги, страха или ужаса в течение последних 4 месяцев? (при ответе «Да» продолжайте отвечать на вопросы)"
    answers: yes_no
  - {id: "1b", text: "были ли у вас подобные приступы когда-нибудь прежде?", answers: yes_no}
  - {id: "1c", text: "возникают ли некоторые из этих приступов неожиданно, вне связи с определенной ситуацией, где бы вы ощущали беспокойство или дискомфорт?", answers: yes_no}
  - {id: "1d", text: "есть ли у вас боязнь приступа или его последствий?", answers: yes_no}
  - {id: "2a", text: "поверхностное, учащенное дыхание", answers: yes_no}
  - {id: "2b", text: "сердцебиение, пульсацию, перебои в работе сердца или ощущение его остановки", answers: yes_no}
  - {id: "2c", text: "боль или дискомфорт в левой половине грудной клетки", answers: yes_no}
  - {id: "2d", text: "потливость", answers: yes_no}
  - {id: "2e", text: "ощущение нехватки воздуха, одышку", answers: yes_no}
  - {id: "2f", text: "волны жара или холода", answers: yes_no}
  - {id: "2g", text: "тошнота, дискомфорт в желудке, понос или позывы к нему", answers: yes_no}
  - {id: "2h", text: "головокружение, неустойчивость, туман в голове или предобморочное состояние", answers: yes_no}
  - {id: "2i", text: "ощущения покалывания или онемения в теле или конечностях", answers: yes_no}
  - {id: "2j", text: "дрожание в теле, конечностях, подергивания или стягивание тела (конечностей)", answers: yes_no}
  - {id: "2k", text: "страх смерти или необратимых последствий приступа?", answers: yes_no}

scoring:
  method: rule
  cases:
    - match: all
      conditions:
        - {items: ["1a", "1b", "1c", "1d"], min_value: 1, count_min: 4}
        - {items: ["2a", "2b", "2c", "2d", "2e", "2f", "2g", "2h", "2i", "2j", "2k"], min_value: 1, count_min: 4}
      band: {code: positive, level: 2, label: "Можно предполагать паническое расстройство (скрининг; нужна клиническая диагностика)"}
  default: {code: negative, level: 0, label: "Критерии скрининга не выполнены"}
