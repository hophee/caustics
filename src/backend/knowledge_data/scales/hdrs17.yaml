# HDRS-17 (HAM-D) — КР F32–F33, приложение Г1. Clinician rating during the visit.
# Текст пунктов — редакция КР F32–F33. В КР F31 (прил. Г3) другая редакция формулировок,
# ключ тот же; в F31 у пункта 8 градации напечатаны 1–5, у 13 и 17 нет градации 0.
# Ключ КР: «19–22 тяжёлое, более 23 крайне тяжёлое» — балл 23 не охвачен.
# Provisional: 23 is assigned to «крайне тяжёлое» (needs clinical confirmation, see decisions.md).
code: HDRS-17
version: 1
name: "HDRS-17 · шкала Гамильтона для оценки депрессии"
measures: depression
direction: higher_is_worse
diagnoses: [F31, F32, F33]
filled_by: clinician
source: "КР F32–F33, приложение Г1, стр. PDF 108–112; также КР F31, приложение Г3"

items:
  - id: 1
    text: "СНИЖЕННОЕ НАСТРОЕНИЕ (переживания подавленности или печали, безнадежности, беспомощности, собственной малоценности)"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Сообщает о своих переживаниях только при расспросе"}
      - {value: 2, label: "Сообщает свои переживания спонтанно вербальным образом"}
      - {value: 3, label: "Выражает свои переживания невербальным образом, т.е. мимикой, позой или жестами, голосом и готовностью к плачу"}
      - {value: 4, label: "Пациент как в спонтанных высказываниях, так и невербальным образом выражает только эти чувства"}
  - id: 2
    text: "ЧУВСТВО ВИНЫ"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Высказывает самоупреки или идеи самоуничижения; считает, что подвел других"}
      - {value: 2, label: "Идеи собственной виновности или мучительные размышления о прошлых ошибках или грехах"}
      - {value: 3, label: "Настоящее заболевание расценивается как наказание; бредовые идеи виновности."}
      - {value: 4, label: "Вербальные галлюцинации обвиняющего и осуждающего содержания и/или угрожающие зрительные галлюцинации"}
  - id: 3
    text: "СУИЦИДАЛЬНЫЕ НАМЕРЕНИЯ"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Ощущение малоценности жизни; говорит, что жить не стоит"}
      - {value: 2, label: "Желание смерти или какие-либо мысли о возможности собственной смерти"}
      - {value: 3, label: "Суицидальные высказывания или жесты"}
      - {value: 4, label: "Попытки самоубийства (любая серьезная попытка оценивается как «4»)."}
  - id: 4
    text: "БЕССОННИЦА: РАННЯЯ (ТРУДНОСТИ ПРИ ЗАСЫПАНИИ)"
    options:
      - {value: 0, label: "Отсутствие затруднений при засыпании"}
      - {value: 1, label: "Жалобы на эпизодические затруднения при засыпании (напр., дольше чем 1/2 часа)"}
      - {value: 2, label: "Жалобы на невозможность заснуть каждую ночь"}
  - id: 5
    text: "БЕССОННИЦА: СЕРЕДИНА НОЧИ"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Жалобы на беспокойный сон в течение всей ночи"}
      - {value: 2, label: "Пробуждения в течение ночи - любой подъем с постели оценивается как «2» (исключая физиологические потребности)"}
  - id: 6
    text: "БЕССОННИЦА ПОЗДНЯЯ: РАННИЕ УТРЕННИЕ ЧАСЫ"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Просыпается в ранние утренние часы, но снова засыпает"}
      - {value: 2, label: "При пробуждении заснуть повторно не удается"}
  - id: 7
    text: "РАБОТОСПОСОБНОСТЬ И АКТИВНОСТЬ"
    options:
      - {value: 0, label: "Никаких затруднений не испытывает"}
      - {value: 1, label: "Мысли и ощущение несостоятельности, чувство усталости и слабости, связанное с деятельностью: работой или хобби"}
      - {value: 2, label: "Утрата интереса к деятельности: работе или хобби, выраженная непосредственно в жалобах или косвенно по степени проявляемого им безразличия к окружающему, нерешительности (чувство потребности в дополнительном усилии приступить к работе или проявить активность)"}
      - {value: 3, label: "Уменьшение реального времени проявления активности или снижение продуктивности. В условиях стационара оценка “3” выставляется, если активность пациента проявляется в течение не менее трех часов в день (работа в отделении или хобби), кроме обычных действий по обслуживанию самого себя"}
      - {value: 4, label: "Отказ от работы вследствие настоящего заболевания; в стационаре оценка “4” выставляется, если пациент вообще не проявляет активности или не справляется даже с рутинной бытовой деятельностью без посторонней помощи"}
  - id: 8
    text: "ЗАТОРМОЖЕННОСТЬ (замедленность мышления и речи, нарушение способности концентрировать внимание, снижение моторной активности)"
    options:
      - {value: 0, label: "Нормальная речь и мышление"}
      - {value: 1, label: "Легкая заторможенность в беседе"}
      - {value: 2, label: "Заметная заторможенность в беседе"}
      - {value: 3, label: "Беседа с больным затруднена"}
      - {value: 4, label: "Полный ступор"}
  - id: 9
    text: "ВОЗБУЖДЕНИЕ (во время беседы)"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Суетливость"}
      - {value: 2, label: "Беспокойные движения руками, теребление волос и т.д."}
      - {value: 3, label: "Подвижность, неусидчивость"}
      - {value: 4, label: "Заламывание рук, кусание ногтей, выдергивание волос, покусывание губ"}
  - id: 10
    text: "ПСИХИЧЕСКАЯ ТРЕВОГА"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Субъективное напряжение и раздражительность"}
      - {value: 2, label: "Беспокойство по незначительным поводам"}
      - {value: 3, label: "Тревога, отражающаяся в выражении лица и речи"}
      - {value: 4, label: "Спонтанно излагает свои тревожные опасения"}
  - id: 11
    text: "СОМАТИЧЕСКАЯ ТРЕВОГА (физиологические проявления тревоги:"
    hint: "• гастроинтестинальные - сухость во рту, метеоризм, диспепсия, диарея, спазмы, отрыжка; • сердечно-сосудистые - сердцебиение, головные боли; • дыхательные - гипервентиляция, одышка; • учащенное мочеиспускание; • повышенное потоотделение (отмечайте согласно частоте и тяжести симптомов)"
    options:
      - {value: 0, label: "Отсутствие"}
      - {value: 1, label: "Легкая"}
      - {value: 2, label: "Умеренная"}
      - {value: 3, label: "Тяжелая"}
      - {value: 4, label: "Крайне тяжелая (вплоть до функциональной недостаточности)"}
  - id: 12
    text: "СОМАТИЧЕСКИЕ СИМПТОМЫ, ЖЕЛУДОЧНО-КИШЕЧНЫЕ"
    options:
      - {value: 0, label: "нет"}
      - {value: 1, label: "потеря аппетита, но ест без помощи персонала, ощущение тяжести в желудке"}
      - {value: 2, label: "трудно есть без помощи персонала, просит слабительное или другое лекарство для ЖКТ"}
  - id: 13
    text: "ОБЩИЕ СОМАТИЧЕСКИЕ СИМПТОМЫ"
    options:
      - {value: 0, label: "нет"}
      - {value: 1, label: "тяжесть в конечностях, спине или голове. Боли в пояснице, головные и мышечные боли. Утрата энергии и истощение"}
      - {value: 2, label: "любые, ясно выраженные симптомы учитываются как 2"}
  - id: 14
    text: "ПОЛОВЫЕ СИМПТОМЫ (такие, как например утрата либидо, менструальные проблемы)"
    options:
      - {value: 0, label: "отсутствуют"}
      - {value: 1, label: "средне"}
      - {value: 2, label: "сильно"}
  - id: 15
    text: "ИПОХОНДРИЯ"
    options:
      - {value: 0, label: "отсутствует"}
      - {value: 1, label: "иногда появляются мысли о здоровье"}
      - {value: 2, label: "поглощен мыслями о здоровье"}
      - {value: 3, label: "частые жалобы, просьбы о помощи и т.п."}
      - {value: 4, label: "ипохондрический бред"}
  - id: 16
    text: "ПОТЕРЯ ВЕСА"
    options:
      - {value: 0, label: "не потерял в весе или вес потерян по ДРУГОЙ причине, не связанной с настоящим заболеванием"}
      - {value: 1, label: "подозревается потеря в весе по причине теперешнего заболевания"}
      - {value: 2, label: "пациент уверенно подтверждает потерю веса из-за депрессии"}
  - id: 17
    text: "КРИТИКА"
    options:
      - {value: 0, label: "подтверждает подавленность и заболевание ИЛИ в данное время не в депрессии"}
      - {value: 1, label: "подтверждает заболевание, но причиной тому ставит плохую пищу, переутомление, вирус, нужду в отдыхе и т.п."}
      - {value: 2, label: "вообще отвергает, что болен"}

scoring:
  method: sum
  bands:
    - {lower: 0,  upper: 7,  code: norm,     level: 0, label: "Норма"}
    - {lower: 8,  upper: 13, code: mild,     level: 1, label: "Лёгкое депрессивное расстройство"}
    - {lower: 14, upper: 18, code: moderate, level: 2, label: "Депрессивное расстройство средней степени тяжести"}
    - {lower: 19, upper: 22, code: severe,   level: 3, label: "Депрессивное расстройство тяжёлой степени"}
    - {lower: 23, upper: 52, code: extreme,  level: 4, label: "Депрессивное расстройство крайне тяжёлой степени", provisional: true}

critical:
  - {item: 3, min_value: 2, proposal: true,
     note: "Суицидальные намерения ≥ 2: нужна оценка суицидального риска (предложение команды)"}
