# CAPS — КР F43.1, приложение Г2. Специалист, клиническое интервью; 17 симптомов (B, C, D),
# у каждого — частота (F) и интенсивность (I) по 0–4. Пороговых значений в КР нет: приведены
# средние значения по группам (Тарабрина, 2001). В PDF эта таблица — картинка без текстового
# слоя; значения перенесены из JSON и по тексту PDF не сверялись.
code: CAPS
version: 1
name: CAPS · шкала для клинической диагностики ПТСР
measures: ptsd_severity
direction: higher_is_worse
diagnoses:
- F43.1
filled_by: clinician
source: КР F43.1, приложение Г2, стр. PDF 140–161
items:
- id: 1f
  text: Повторяющиеся навязчивые воспоминания о событии, вызывающие дистресс — частота
  hint: Случалось ли так, что вы непроизвольно, без всякого повода, вспоминали об этих событиях? Было ли это только во сне?
    (Исключить, если воспоминания появлялись только во сне.) Как часто это происходило в течение последнего месяца?
  symptom: 1
  options:
  - value: 0
    label: никогда
  - value: 1
    label: один или два раза
  - value: 2
    label: один или два раза в неделю
  - value: 3
    label: несколько раз в неделю
  - value: 4
    label: ежедневно или почти каждый день
- id: 1i
  text: Повторяющиеся навязчивые воспоминания о событии, вызывающие дистресс — интенсивность
  hint: Если из этих случаев взять самый тяжелый, насколько сильны были переживания, вызванные этими воспоминаниями? Были
    ли вы вынуждены прерывать дела, которыми в этот момент занимались? В состоянии ли вы, если постараетесь, преодолеть эти
    воспоминания, избавиться от них?
  symptom: 1
  options:
  - value: 0
    label: отсутствие дистресса
  - value: 1
    label: 'низкая интенсивность симптома: минимальный дистресс'
  - value: 2
    label: 'умеренная интенсивность: дистресс отчетливо присутствует'
  - value: 3
    label: 'высокая интенсивность: существенный дистресс, явные срывы в деятельности и трудности в преодолении возникших воспоминаний
      о событии'
  - value: 4
    label: 'очень высокая интенсивность: тяжелый, непереносимый дистресс, неспособность продолжать деятельность и невозможность
      избавиться от воспоминаний о событии'
- id: 2f
  text: Интенсивные, тяжелые переживания при обстоятельствах, символизирующих или напоминающих различные аспекты травматического
    события, включая годовщины травмы — частота
  hint: 'Были ли у вас случаи, когда вы видели что-то, напомнившее об этих событиях, и вам становилось тяжело и грустно, вы
    расстраивались? (Например: определенный тип мужчин – для жертв изнасилования, цепочка деревьев или лесистая местность
    – для ветеранов войны.) Как часто это с вами случалось в течение последнего месяца?'
  symptom: 2
  options:
  - value: 0
    label: Никогда
  - value: 1
    label: один или два раза
  - value: 2
    label: один или два раза в неделю
  - value: 3
    label: несколько раз в неделю
  - value: 4
    label: ежедневно или почти каждый день
- id: 2i
  text: Интенсивные, тяжелые переживания при обстоятельствах, символизирующих или напоминающих различные аспекты травматического
    события, включая годовщины травмы — интенсивность
  hint: Если из этих случаев взять самый тяжелый, насколько вы были взволнованы и расстроены, насколько сильны были переживания?
  symptom: 2
  options:
  - value: 0
    label: нисколько
  - value: 1
    label: 'слабая интенсивность симптома: минимальный дистресс'
  - value: 2
    label: 'умеренная интенсивности: дистресс отчетливо присутствует, но еще контролируется'
  - value: 3
    label: 'высокая интенсивность: значительный дистресс'
  - value: 4
    label: 'очень высокая интенсивность: непереносимый дистресс'
- id: 3f
  text: Ощущение, как будто травматическое событие происходило снова, или соответствующие внезапные действия, включая ощущение
    оживших переживаний, иллюзии, галлюцинации, диссоциативные эпизоды (флэшбэк-эффекты), даже те, которые появляются в просоночном
    состоянии — частота
  hint: Приходилось ли вам когда-нибудь внезапно совершать какое-либо действие или чувствовать себя так, как будто бы то событие(я)
    происходит снова? Как часто это с вами случалось в течение последнего месяца?
  symptom: 3
  options:
  - value: 0
    label: никогда
  - value: 1
    label: один или два раза
  - value: 2
    label: один или два раза в неделю
  - value: 3
    label: несколько раз в неделю
  - value: 4
    label: ежедневно или почти каждый день
- id: 3i
  text: Ощущение, как будто травматическое событие происходило снова, или соответствующие внезапные действия, включая ощущение
    оживших переживаний, иллюзии, галлюцинации, диссоциативные эпизоды (флэшбэк-эффекты), даже те, которые появляются в просоночном
    состоянии — интенсивность
  hint: Если из этих случаев взять самый тяжелый, насколько реальным было это ощущение? Насколько сильно вам казалось, что
    то событие(я) происходило снова? Как долго это продолжалось? Что вы делали при этом?
  symptom: 3
  options:
  - value: 0
    label: никогда такого не было
  - value: 1
    label: 'слабая интенсивность симптома: ощущение чуть большей реалистичности происходящего, чем при простом размышлении
      о нем'
  - value: 2
    label: 'умеренная интенсивность: ощущения определенные, но передающие диссоциативное качество, однако при этом сохраняется
      тесная связь с окружающим, ощущения похожи на грезы наяву'
  - value: 3
    label: 'высокая интенсивность: в сильной степени диссоциативные ощущения – пациент рассказывает об образах, звуках, запахах,
      но все еще сохраняется некоторая связь с окружающим миром'
  - value: 4
    label: 'очень высокая интенсивность: ощущения полностью диссоциативны – флэшбэк-эффект, полное отсутствие связи с окружающей
      реальностью, возможна амнезия данного эпизода – «затмение», провал в памяти'
- id: 4f
  text: Повторяющиеся сны о событии, вызывающие тяжелые переживания (дистресс) — частота
  hint: Были ли у вас когда-нибудь неприятные сны о том событии? Как часто это с вами случалось в течение последнего месяца?
  symptom: 4
  options:
  - value: 0
    label: никогда
  - value: 1
    label: один или два раза
  - value: 2
    label: один или два раза в неделю
  - value: 3
    label: несколько раз в неделю
  - value: 4
    label: ежедневно или почти каждый день
- id: 4i
  text: Повторяющиеся сны о событии, вызывающие тяжелые переживания (дистресс) — интенсивность
  hint: 'Если из этих случаев взять самый худший, как сильны были те неприятные, тяжелые переживания и чувство дискомфорта,
    которые вызывали у вас эти сны? Вы просыпались от этих снов? (Если да, спросите: «Что вы чувствовали или делали, когда
    просыпались? Через сколько времени вы обычно засыпали?» Выслушайте рассказ и отметьте симптомы паники, громкие крики,
    положения тела.)'
  symptom: 4
  options:
  - value: 0
    label: отсутствовали
  - value: 1
    label: 'слабо выраженная интенсивность симптома: минимальный дистресс не вызывал пробуждении'
  - value: 2
    label: 'умеренная интенсивность: просыпается, испытывая дистресс, но легко засыпает снова'
  - value: 3
    label: 'высокая интенсивность: очень тяжелый дистресс, затруднено повторное засыпание'
  - value: 4
    label: 'очень высокая интенсивность: непреодолимый дистресс, невозможность заснуть снова'
- id: 5f
  text: Усилия, направленные на то, чтобы избежать мыслей или чувств, ассоциирующихся с травмой — частота
  hint: Пытались ли вы отгонять мысли о событии(ях)? Прилагали ли вы усилия, чтобы избежать ощущений, связанных с событием(ями)
    (например, чувств гнева, печали, вины)? Как часто это с вами случалось в течение последнего месяца?
  symptom: 5
  options:
  - value: 0
    label: никогда
  - value: 1
    label: один или два раза
  - value: 2
    label: один или два раза в неделю
  - value: 3
    label: несколько раз в неделю
  - value: 4
    label: ежедневно или почти каждый день
- id: 5i
  text: Усилия, направленные на то, чтобы избежать мыслей или чувств, ассоциирующихся с травмой — интенсивность
  hint: Как велики были усилия, которые вы прилагали, чтобы не думать о том событии(ях), чтобы не испытывать чувств, имеющих
    к нему (ним) отношение? (Дайте оценку всех попыток сознательного избегания, включая отвлечение, подавление и снижение
    возбужденности при помощи алкоголя или наркотиков.)
  symptom: 5
  options:
  - value: 0
    label: никакого усилия
  - value: 1
    label: 'слабая интенсивность симптома: минимальное усилие'
  - value: 2
    label: 'умеренная интенсивность: некоторое усилие, избегание определенно есть'
  - value: 3
    label: 'высокая интенсивность: значительное усилие, избегание безусловно есть'
  - value: 4
    label: 'очень высокая интенсивность: отчетливо выраженные попытки избегания'
- id: 6f
  text: Усилия, направленные на то, чтобы избегать действий или ситуаций, которые вызывают воспоминания о травме — частота
  hint: Пытались ли вы когда-либо избегать каких-либо действий или ситуаций, которые напоминали бы вам о событии(ях)?
  symptom: 6
  options:
  - value: 0
    label: никогда
  - value: 1
    label: один или два раза
  - value: 2
    label: один или два раза в неделю
  - value: 3
    label: несколько раз в неделю
  - value: 4
    label: ежедневно или почти каждый день
- id: 6i
  text: Усилия, направленные на то, чтобы избегать действий или ситуаций, которые вызывают воспоминания о травме — интенсивность
  hint: 'Интенсивность:'
  symptom: 6
  options:
  - value: 0
    label: никакого усилия
  - value: 1
    label: 'слабая интенсивность симптома: минимальное усилие'
  - value: 2
    label: 'умеренная интенсивность: некоторое усилие, избегание определенно есть'
  - value: 3
    label: 'высокая интенсивность: значительное усилие, избегание безусловно есть'
  - value: 4
    label: 'очень высокая интенсивность: отчетливо выраженные попытки избегания'
- id: 7f
  text: Неспособность вспомнить важные аспекты травмы (психогенная амнезия) — частота
  hint: Случалось ли так, что вы не могли вспомнить важные обстоятельства происшедшего с вами события(ий) (например, имена,
    лица, последовательность событий)? Многое ли из того, что имело отношение к происшедшему, вам было трудно вспомнить в
    прошедшем месяце?
  symptom: 7
  options:
  - value: 0
    label: ничего, ясная память о событии в целом
  - value: 1
    label: некоторые обстоятельства события(ий) было невозможно вспомнить (менее чем 10%)
  - value: 2
    label: ряд обстоятельств события(й) было невозможно вспомнить (20–30%)
  - value: 3
    label: большую часть обстоятельств события(й) было невозможно вспомнить (50–60%)
  - value: 4
    label: почти совсем невозможно было вспомнить событие^) (более чем 80%)
- id: 7i
  text: Неспособность вспомнить важные аспекты травмы (психогенная амнезия) — интенсивность
  hint: Как велики были усилия, которые вам понадобилось приложить, чтобы вспомнить о важных обстоятельствах того, что произошло
    с вами?
  symptom: 7
  options:
  - value: 0
    label: какие-либо затруднения при воспоминании о событиях отсутствовали
  - value: 1
    label: 'слабая интенсивность симптома: незначительные затруднения при воспроизведении обстоятельств события'
  - value: 2
    label: 'умеренная интенсивность: определенные затруднения, однако при сосредоточении сохраняется способность к воспроизведению
      события в памяти'
  - value: 3
    label: 'высокая интенсивность: несомненные затруднения при воспроизведении обстоятельств события'
  - value: 4
    label: 'очень высокая интенсивность: полная неспособность вспомнить о событии(ях)'
- id: 8f
  text: Заметная утрата интереса к любимым занятиям — частота
  hint: Чувствуете ли вы, что потеряли интерес к занятиям, которые были для вас важными или приятными, – например, спорт,
    увлечения, общение? Если сравнить с тем, что было до происшедшего, сколько видов занятий перестали вас интересовать за
    прошедший месяц?
  symptom: 8
  options:
  - value: 0
    label: потери интереса вообще не было
  - value: 1
    label: потеря интереса к отдельным занятиям (менее чем 10%)
  - value: 2
    label: потеря интереса к нескольким занятиям (20–30%)
  - value: 3
    label: потеря интереса к большому числу занятий (50–60%)
  - value: 4
    label: потеря интереса почти ко всему (более чем 80%)
- id: 8i
  text: Заметная утрата интереса к любимым занятиям — интенсивность
  hint: В самом худшем случае насколько глубока или сильна была утрата интереса к этим занятиям?
  symptom: 8
  options:
  - value: 0
    label: вообще не было потери интереса
  - value: 1
    label: 'слабая интенсивность симптома: только незначительная потеря интереса, не исключающая получения удовольствия в
      процессе занятий, если они все-таки начались'
  - value: 2
    label: 'умеренная интенсивность: безусловная потеря интереса, но все-таки сохраняется некоторое чувство удовольствия от
      занятия(й)'
  - value: 3
    label: 'высокая интенсивность: очень значительная потеря интереса к занятиям'
  - value: 4
    label: 'очень высокая интенсивность: полная потеря интереса, не вовлекается ни в какую деятельность'
- id: 9f
  text: Чувство отстраненности или отчужденности от окружающих — частота
  hint: Не было ли у вас чувства отдаленности или потери связи с окружающими? Отличалось ли это состояние от того, что вы
    чувствовали перед тем, как произошло это событие(я)? Как часто вы чувствовали себя так в течение последнего месяца?
  symptom: 9
  options:
  - value: 0
    label: такого вообще не было
  - value: 1
    label: редко (менее 10% времени)
  - value: 2
    label: иногда (20-30%)
  - value: 3
    label: часто (50-60%)
  - value: 4
    label: почти всегда или постоянно (более чем 80%)
- id: 9i
  text: Чувство отстраненности или отчужденности от окружающих — интенсивность
  hint: В самом худшем случае насколько сильно было ваше чувство отстраненности или отсутствия связи с окружающими? Кто все-таки
    оставался вам близок?
  symptom: 9
  options:
  - value: 0
    label: отсутствуют подобные чувства
  - value: 1
    label: 'слабая интенсивность симптома: эпизодически чувствует себя «идущим,не в ногу» с окружающими'
  - value: 2
    label: 'умеренная интенсивность: определенное наличие чувства отдаленности, но сохраняются какие-то межличностные связи
      и чувство принадлежности к окружающему миру'
  - value: 3
    label: 'высокая интенсивность: значительное чувство отстраненности или отчужденности от большинства людей, сохраняется
      способность взаимодействия только с одним человеком'
  - value: 4
    label: 'очень высокая интенсивность: чувствует себя полностью оторванным от других людей, близкие отношения не поддерживает
      ни с кем'
- id: 10f
  text: Сниженный уровень аффекта, например, неспособность испытывать чувство любви — частота
  hint: Были ли у вас такие периоды, когда вы были «бесчувственны» (вам было трудно испытывать такие чувства, как любовь или
    счастье)? Отличалось ли это состояние от того, как вы себя чувствовали перед тем, как произошло это событие(я)? Как часто
    вы чувствовали себя так в течение последнего месяца?
  symptom: 10
  options:
  - value: 0
    label: такого вообще не было
  - value: 1
    label: редко (менее 10% времени)
  - value: 2
    label: иногда (20-30%)
  - value: 3
    label: часто (50-60%)
  - value: 4
    label: почти всегда или постоянно (более чем 80%)
- id: 10i
  text: Сниженный уровень аффекта, например, неспособность испытывать чувство любви — интенсивность
  hint: В самом худшем случае насколько сильным у вас было ощущение «бесчувственности»? (В оценку этого пункта включите наблюдения
    за уровнем аффективности во время интервью.)
  symptom: 10
  options:
  - value: 0
    label: ощущения бесчувственности нет
  - value: 1
    label: 'слабая интенсивность симптома: такое ощущение имеется, но незначительное'
  - value: 2
    label: 'умеренная интенсивность: явное ощущение бесчувственности, но способность испытывать эмоции все-таки сохранена'
  - value: 3
    label: 'высокая интенсивность: значительное ощущение бесчувственности по отношению по крайней мере к двум основным эмоциям
      – любви и счастья'
  - value: 4
    label: 'очень высокая интенсивность: ощущает полное отсутствие эмоций'
- id: 11f
  text: Ощущение отсутствия перспектив на будущее, например, не ожидает продвижения по службе, женитьбы, рождения детей, долгой
    жизни — частота
  hint: Было ли когда-нибудь, что вы чувствовали отсутствие необходимости строить планы на будущее, что почему-либо у вас
    «нет завтрашнего дня»? (Если да, уточните наличие реального риска, например, опасных для жизни медицинских диагнозов).
    Отличалось ли это состояние от того, как вы себя чувствовали перед тем, как произошло это событие(я)? Как часто вы чувствовали
    себя так в течение последнего месяца?
  symptom: 11
  options:
  - value: 0
    label: такого вообще не было
  - value: 1
    label: редко (менее 10% времени)
  - value: 2
    label: иногда (20-30%)
  - value: 3
    label: часто (50-60%)
  - value: 4
    label: почти всегда или постоянно (более чем 80%)
- id: 11i
  text: Ощущение отсутствия перспектив на будущее, например, не ожидает продвижения по службе, женитьбы, рождения детей, долгой
    жизни — интенсивность
  hint: В самом худшем случае насколько сильным было чувство, что у вас не будет будущего? Как вы думаете; как долго вы будете
    жить? Какие основания у вас предполагать, что вы умрете преждевременно?
  symptom: 11
  options:
  - value: 0
    label: ощущения сокращенного будущего нет
  - value: 1
    label: 'слабая интенсивность симптома: незначительные ощущения по поводу сокращенности жизненной перспективы'
  - value: 2
    label: 'умеренная интенсивность симптома: определенно присутствует ощущение сокращенной жизненной перспективы'
  - value: 3
    label: 'высокая интенсивность симптома: значительно выражены ощущения сокращенной жизненной перспективы, могут иметь место
      определенные предчувствия о продолжительности жизни'
  - value: 4
    label: 'очень высокая интенсивность симптома: всепоглощающее чувство сокращенной жизненной перспективы, под-ная убежденность
      в преждевременной смерти'
- id: 12f
  text: Трудности с засыпанием или с сохранением нормального сна — частота
  hint: Были ли у вас какие-либо проблемы с засыпанием или с тем, чтобы спать нормально? Отличается ли это от того, как вы
    спали перед событием(ями)? Как часто у вас были трудности со сном в прошлом месяце?
  symptom: 12
  options:
  - value: 0
    label: никогда
  - value: 1
    label: один или два раза
  - value: 2
    label: один или два раза в неделю
  - value: 3
    label: несколько раз в неделю
  - value: 4
    label: каждую ночь (или почти каждую)
- id: 12i
  text: Трудности с засыпанием или с сохранением нормального сна — интенсивность
  hint: Трудности с засыпанием? Да / Нет
  symptom: 12
  options:
  - value: 0
    label: нет проблем со сном
  - value: 1
    label: 'слабая интенсивность симптома: несколько затруднено засыпание, некоторые трудности с сохранением сна (потеря сна
      до 30 минут)'
  - value: 2
    label: 'умеренная интенсивность: определенное нарушение сна – ясно выраженная увеличенная продолжительность периода засыпания
