  - value: 3
    label: 'высокая интенсивность: значительное ухудшение функции, даже при особых усилиях'
  - value: 4
    label: 'очень высокая интенсивность: полная неспособность к сосредоточению и концентрации внимания'
- id: 15f
  text: Повышенная настороженность (бдительность) — частота
  hint: Приходилось ли вам быть как-то особенно настороженным или бдительным даже тогда, когда для этого не было очевидной
