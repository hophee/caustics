    подобные чувства или вели себя подобным образом в прошлом месяце?
  symptom: 13
  options:
  - value: 0
    label: никогда
  - value: 1
    label: один или два раза
  - value: 2
    label: один или два раза в неделю
  - value: 3
    label: несколько раз в неделю
  - value: 4
    label: ежедневно или почти каждый день
- id: 13i
  text: Раздражительность или приступы гнева — интенсивность
  hint: Насколько сильный гнев вы испытывали и каким образом вы его выражали?
  symptom: 13
  options:
  - value: 0
    label: не было ни раздражительности, ни гнева
  - value: 1
    label: 'слабая интенсивность симптома: минимальная раздражительность, в гневе – повышение голоса'
  - value: 2
    label: 'умеренная интенсивность: явное наличие раздражительности, в гневе с легкостью начинает спорить, но быстро «остывает»'
  - value: 3
    label: 'высокая интенсивность: значительная раздражительность, в гневе – речевая или поведенческая агрессивность'
  - value: 4
    label: 'очень высокая интенсивность: непреодолимый гнев, сопровождаемый эпизодами физического насилия'
- id: 14f
  text: Трудности с концентрацией внимания — частота
  hint: Не казалось ли вам трудным сосредоточиться на каком-то занятии или на чем-то, что окружало вас? Изменилась ли ваша
    способность к сосредоточению с тех пор, как случилось это событие(я)? Как часто у вас наблюдались затруднения с сосредоточением
