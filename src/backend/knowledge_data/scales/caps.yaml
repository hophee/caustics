- id: 17f
  text: Физиологическая реактивность при воздействии обстоятельств, напоминающих или символизирующих различные аспекты травматического
    события — частота
  hint: Приходилось ли вам отмечать у себя наличие определенных физиологических реакций, когда вы сталкивались с ситуациями,
