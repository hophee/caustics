# TOP-8 (Treatment Outcome PTSD Scale) — КР F43.1, приложение Г11.
# Категория 0 (вне классификации): по КР заполняет специалист-интервьюер — filled_by: clinician.
# Сумма баллов; оценивается изменение суммы в динамике, порогов в КР нет.
code: TOP-8
version: 1
name: "TOP-8 · опросник для оценки терапевтической динамики ПТСР"
measures: ptsd_treatment_outcome
direction: higher_is_worse
diagnoses: [F43.1]
filled_by: clinician
source: "КР F43.1, приложение Г11, стр. PDF 198–200"

items:
  - id: 1
    text: "Были ли у вас болезненные образы, мысли или воспоминания о травме, от которых вы не могли избавиться, даже если хотели? Возникали ли они периодически?"
    options:
      - {value: 0, label: "никогда"}
      - {value: 1, label: "в легкой степени: редкие и небеспокоящие"}
      - {value: 2, label: "в средней степени: по крайней мере один раз в неделю и/или вызывающие небольшой дистресс"}
      - {value: 3, label: "в тяжелой степени: по крайней мере 4 раза в неделю или вызывающие средний дистресс"}
      - {value: 4, label: "в очень тяжелой степени: ежедневно, или вызывают дистресс до такой степени, что пациент не может работать или социально функционировать."}
  - id: 2
    text: "Вызывает ли воздействие события, которое напоминает вам о травме или является похожим на нее, какие-либо физические проявления (например, потливость, дрожь, сердцебиение, тошнота, учащенное дыхание, ощущение озноба и т. д.)?"
    options:
      - {value: 0, label: "никогда"}
      - {value: 1, label: "немного: редкие или сомнительные"}
      - {value: 2, label: "отчасти: вызывающие небольшой дистресс"}
      - {value: 3, label: "значительно: вызывающие выраженный дистресс"}
      - {value: 4, label: "заметно: вызывающие выраженный дистресс или необходимость поиска помощи врачей в связи с физическими проявлениями (например, боль в груди настолько выраженная, что он/она был убежден в наличии у себя сердечного приступа)."}
  - id: 3
    text: "Избегаете ли вы упорно места, людей или случаи, которые напоминают вам о событии, например, фильмы, телепередачи, шумные места, встречи ветеранов или похороны?"
    options:
      - {value: 0, label: "нет избегания"}
      - {value: 1, label: "в легкой степени: сомнительной значимости (неудобно, но не избегает)"}
      - {value: 2, label: "в умеренной степени: определенно избегает ситуаций"}
      - {value: 3, label: "в тяжелой степени: очень неудобно, и избегание затрагивает жизнь в некоторой степени"}
      - {value: 4, label: "очень тяжелой степени: прикованный к дому, не может выходить в магазины и рестораны."}
  - id: 4
    text: "Испытываете ли вы меньше интереса (удовольствия) к вещам, которые ранее вас радовали?"
    options:
      - {value: 0, label: "интерес не потерян"}
      - {value: 1, label: "один или два действия вызывают меньше удовольствие"}
      - {value: 2, label: "несколько действий вызывают меньше удовольствие"}
      - {value: 3, label: "большинство действий вызывают меньше удовольствие"}
      - {value: 4, label: "практически все действия вызывают меньше удовольствие."}
  - id: 5
    text: "Контактируете ли Вы с людьми меньше чем обычно? Чувствуете ли Вы себя отчужденным от других людей?"
    options:
      - {value: 0, label: "нет проблем"}
      - {value: 1, label: "в легкой степени: чувствует себя отдаленным или отчужденным, но все же имеет нормальную степень контакта с другими людьми"}
      - {value: 2, label: "в умеренной степени: иногда избегает контакта, в котором он или она, как правило, участвовал ранее"}
      - {value: 3, label: "в тяжелой степени: безусловно и обычно избегает людей, с которыми он или она ранее контактировал"}
      - {value: 4, label: "в очень тяжелой степени: абсолютно отказывается или активно избегает всех социальных контактов с момента травмы."}
  - id: 6
    text: "Есть ли у вас теплые чувства или чувствуете ли вы себя ближе к другим? Чувствуете ли вы оцепенение?"
    options:
      - {value: 0, label: "нет проблем"}
      - {value: 1, label: "в легкой степени: сомнительной значимости"}
      - {value: 2, label: "в умеренной степени: некоторые трудности с выражением чувств"}
      - {value: 3, label: "в тяжелой степени: определенные проблемы с выражением чувств"}
      - {value: 4, label: "в очень тяжелой степени: не имеет чувств, чувствует оцепенение большую часть времени."}
  - id: 7
    text: "Вы насторожены? Вы легко отвлекаетесь? Чувствуете ли вы, что находитесь на грани?"
    options:
      - {value: 0, label: "нет проблем"}
      - {value: 1, label: "в легкой степени: периодически/не мешает"}
      - {value: 2, label: "в умеренной степени: вызывает дискомфорт, чувствует на грани или бдительным в некоторых ситуациях"}
      - {value: 3, label: "в тяжелой степени: вызывает дискомфорт, чувствует на грани или бдительным в большинство ситуациях"}
      - {value: 4, label: "в очень тяжелой степени: вызывает выраженный дискомфорт, и меняет жизнь (постоянно насторожен, должен соблюдать дистанцию, социально обесценен в связи с чувством на грани)."}
  - id: 8
    text: "Вас легко напугать? У вас есть тенденция к внезапному вздрагиванию? Возникает ли это после неожиданного шума, или если вы слышите или видите что-то, что напоминает вам о травме?"
    options:
      - {value: 0, label: "нет проблем"}
      - {value: 1, label: "в легкой степени: периодически / не мешает"}
      - {value: 2, label: "в умеренной степени: определенно вызывает дискомфорт или чрезмерный испуг по крайней мере раз в две недели"}
      - {value: 3, label: "в тяжелой степени: происходит чаще одного раза в неделю"}
      - {value: 4, label: "в очень тяжелой степени: настолько плохо, что пациент не может функционировать на работе или в социуме."}

scoring:
  method: sum
  bands: []
