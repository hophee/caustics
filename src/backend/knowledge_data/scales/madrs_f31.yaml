# MADRS — редакция КР F31, приложение Г4: другие формулировки градаций и другой ключ.
# Заполняется экспертом-психиатром, прошедшим тренинг; состояние за последние 7 дней.
# Градации 1, 3, 5 — промежуточные.
code: MADRS-F31
version: 1
name: "MADRS (редакция КР F31) · шкала Монтгомери–Асберг для оценки тяжести депрессивной симптоматики"
measures: depression
direction: higher_is_worse
diagnoses: [F31]
filled_by: clinician
source: "КР F31, приложение Г4, стр. PDF 153–159"

items:
  - id: 1
    text: "ОБЪЕКТИВНЫЕ ПРИЗНАКИ ПОНИЖЕННОГО НАСТРОЕНИЯ"
    hint: "Проявления угнетенности, уныния, отчаяния (более выраженные, чем при обычном преходящем «плохом настроении»), проявляющиеся в речи, мимике и позе. Оцениваются в соответствии с глубиной и стойкостью снижения настроения."
    options:
      - {value: 0, label: "Отсутствие"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Выглядит подавленным, но легко оживляется в зависимости от обстоятельств"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Выглядит печальным и несчастным большую часть времени"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Постоянно выглядит угнетенным. Крайняя безнадежность"}
  - id: 2
    text: "Субъективные признаки подавленности"
    hint: "Сообщение пациента о депрессивном настроении, независимо от того, насколько оно проявляется внешними признаками. Включает упадок духа, угнетенность или чувство беспомощности и безнадежности. Оценивается в соответствии с интенсивностью, продолжительностью или степенью того, насколько, по описанию пациента, сниженное настроение связано с внешними событиями."
    options:
      - {value: 0, label: "Эпизодическая подавленность, связанная с внешними обстоятельствами"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Печальное или подаленное настроение, легко поддающееся улучшению в зависимоти от внешних обстоятельств"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Глубокое чувство угнетенности или уныния; настроение еще подвержено влиянию внешних обстоятельств"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Постоянное и неизменное чувство подавленности, отчаяния и угнетенности"}
  - id: 3
    text: "ВНУТРЕННЯЯ НАПРЯЖЕННОСТЬ"
    hint: "Чувство болезненного дискомфорта, смятения, раздражения, психического напряжения, доходящего до паники, сильного страха или душевной боли."
    options:
      - {value: 0, label: "Спокоен. Периодически возникает мимолетное чувство внутренней напряженности"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Эпизодически испытывает раздражение и ощущение болезненного дискомфорта"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Стойкое чувство внутренней напряженности или эпизодическая паника, которая требует усилий для ее преодоления"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Неослабевающий страх или душевная боль. Непреодолимая паника"}
  - id: 4
    text: "НАРУШЕНИЯ СНА"
    hint: "Уменьшение продолжительности или глубины сна в сравнении с привычными для пациента характеристиками сна."
    options:
      - {value: 0, label: "Сон не нарушен"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Незначительное затруднение засыпания или несколько укороченный, поверхностный или прерывистый сон"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Сон укорочен не менее, чем на 2 часа"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Продолжительность сна менее 2-3 часов"}
  - id: 5
    text: "СНИЖЕНИЕ АППЕТИТА"
    hint: "Чувство утраты аппетита. Оценивается в соответствии со степенью утраты желания поесть или усилий заставить себя принять пищу."
    options:
      - {value: 0, label: "Нормальный или повышеный аппетит"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Несколько сниженный аппетит"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Отсутствие аппетита. Пища не имеет вкуса"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Необходимо принуждение для приема пищи"}
  - id: 6
    text: "НАРУШЕНИЯ КОНЦЕНТРАЦИИ ВНИМАНИЯ"
    hint: "Трудности собраться с мыслями вплоть до утраты способности сконцентрироваться. Оценивается в соответствии с интенсивностью, частотой и степенью утраты способности сконцентрировать внимание."
    options:
      - {value: 0, label: "Нет нарушений концентрации"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Эпизодически трудно собраться с мыслями"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Затруднения концентрации и длительного сосредоточения со снижением способности читать или вести беседу"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Без значительных усилий не способен читать или вести беседу"}
  - id: 7
    text: "АПАТИЯ"
    hint: "Затруднения или замедленное включение в выполнение повседневной деятельности."
    options:
      - {value: 0, label: "Отсутствие затруднения начать какую-либо деятельность; Отсутствие замедленности"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Затруднения начать любую деятельность"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Затруднения начать простую повседневную деятельность, ее выполнение дается с усилием"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Полная апатия; неспособность выполнить что-либо без посторонней помощи"}
  - id: 8
    text: "УТРАТА СПОСОБНОСТИ ЧУВСТВОВАТЬ"
    hint: "Субъективное ощущение снижения интереса к окружающему или деятельности, обычно доставляющим удовольствие. Снижение способности адекватно эмоционально реагировать на внешние события или людей."
    options:
      - {value: 0, label: "Нормальный интерес к окружающему или другим людям"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Снижение способности получать удовольствие от увлекавших ранее занятий"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Утрата интереса к окружающему; утрата чувстств к друзьям и знакомым"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Ощущение эмоционального паралича, утраты способности испытывать гнев, печаль или удовольствие, полная или даже болезненная утрата чувств к близким и друзьям"}
  - id: 9
    text: "ПЕССИМИСТИЧЕСКИЕ МЫСЛИ"
    hint: "Идеи собственной вины, малоценности, самоуничижения, греховности или раскаяния."
    options:
      - {value: 0, label: "Отсутствие пессимимстических мыслей"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Эпизодические мысли о собственной неспособности добиваться успеха, самоупреки и самоуничижение"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Постоянное самообвинение или конкретные, но еще сохраняющие рациональность, идеи вины или греха. Нарастающая пессимистическая оценка будущего"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Бредовые идеи полного краха, раскаяния или неискупаемого греха; абсурдное и непоколебимое самообвинение"}
  - id: 10
    text: "СУИЦИДАЛЬНЫЕ МЫСЛИ"
    hint: "Чувство, что жить больше не стоит, что естественная смерть – желаемый исход; мысли и приготовления к самоубийству. Суицидальные попытки сами по себе не должны изменять оценку."
    options:
      - {value: 0, label: "Доволен жизнью или принимает ее такой, какая она есть"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Усталость от жизни. Лишь мимолетные суицидальные мысли"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Возможно лучше было бы умереть; суицидальные мысли становятся привычными, а самоубийство рассматривается как возможный способ решения проблем при отсутствии конкретных суицидальных планов или намерений"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Конкретное планирование самоубийства при первой возможности; активные приготовления к самоубийству"}

scoring:
  method: sum
  bands:
    - {lower: 0,  upper: 15, code: none,     level: 0, label: "Отсутствие депрессивного эпизода"}
    - {lower: 16, upper: 25, code: minor,    level: 1, label: "Малый депрессивный эпизод"}
    - {lower: 26, upper: 30, code: moderate, level: 2, label: "Умеренный депрессивный эпизод"}
    - {lower: 31, upper: 60, code: major,    level: 3, label: "Большой депрессивный эпизод"}

critical:
  - {item: 10, min_value: 4, proposal: true,
     note: "Суицидальные мысли ≥ 4: нужна оценка суицидального риска (предложение, в КР не задано)"}
