# MADRS — КР F32–F33, приложение Г2. Clinician interview, состояние за 7 дней.
# Описания даны у градаций 0, 2, 4, 6; 1, 3, 5 — промежуточные (по инструкции КР).
# В КР F31 (прил. Г4) другая редакция и другой ключ — см. madrs_f31.yaml.
code: MADRS
version: 1
name: "MADRS · шкала Монтгомери–Асберг для оценки депрессии"
measures: depression
direction: higher_is_worse
diagnoses: [F32, F33]
filled_by: clinician
source: "КР F32–F33, приложение Г2, стр. PDF 113–116"

items:
  - id: 1
    text: "ОБЪЕКТИВНЫЕ ПРИЗНАКИ ПОНИЖЕННОГО НАСТРОЕНИЯ Проявления угнетенности, уныния, отчаяния (более выраженные, чем при обычном преходящем «плохом настроении»), проявляющиеся в речи, мимике и позе. Оцениваются в соответствии с глубиной и стойкостью снижения настроения."
    options:
      - {value: 0, label: "Подавленность отсутствует"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Выглядит подавленным, но легко оживляется"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Выглядит печальным и несчастным большую часть времени"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Постоянно выглядит угнетенным. Чрезвычайно подавлен."}
  - id: 2
    text: "СУБЪЕКТИВНЫЕ ПРИЗНАКИ ПОДАВЛЕННОСТИ Сообщение пациента о депрессивном настроении, независимо от того, насколько оно проявляется внешними признаками. Включает упадок духа, угнетенность или чувство беспомощности и безнадежности. Оценивается в соответствии с интенсивностью, продолжительностью или степенью того, насколько, по описанию пациента, сниженное настроение связано с внешними событиями."
    options:
      - {value: 0, label: "Эпизодическая подавленность, связанная с обстоятельствами"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Печален или подавлен, но легко отвлекается"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Глубокое чувство угнетенности или уныния; настроение еще подвержено влиянию внешних обстоятельств"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Постоянное и неизменное чувство подавленности, отчаяния и угнетенности"}
  - id: 3
    text: "ВНУТРЕННЕЕ НАПРЯЖЕНИЕ Чувство болезненного дискомфорта, смятения, раздражения, психического напряжения, доходящего до паники, сильного страха или душевной боли."
    options:
      - {value: 0, label: "Спокоен. Лишь мимолетное внутреннее напряжение"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Эпизодически испытывает раздражение и ощущение болезненного дискомфорта"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Стойкое чувство внутренней напряженности или эпизодическая паника, которая требует усилий для ее преодоления"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Неослабевающий страх или душевная боль. Непреодолимая паника"}
  - id: 4
    text: "НАРУШЕНИЯ СНА Уменьшение продолжительности или глубины сна в сравнении с привычными для пациента характеристиками сна."
    options:
      - {value: 0, label: "Сон не нарушен"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Незначительное затруднение засыпания или несколько укороченный, поверхностный или прерывистый сон"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Сон укорочен не менее, чем на 2 часа"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Продолжительность сна менее 2-3 часов"}
  - id: 5
    text: "СНИЖЕНИЕ АППЕТИТА Чувство утраты аппетита. Оценивается в соответствии со степенью утраты желания поесть или усилий заставить себя принять пищу."
    options:
      - {value: 0, label: "Нормальный или повышенный аппетит"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Несколько сниженный аппетит"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Отсутствие аппетита. Пища не имеет вкуса"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Необходимо принуждение для приема пищи"}
  - id: 6
    text: "НАРУШЕНИЯ КОНЦЕНТРАЦИИ ВНИМАНИЯ Трудности собраться с мыслями вплоть до утраты способности сконцентрироваться. Оценивается в соответствии с интенсивностью, частотой и степенью утраты способности сконцентрировать внимание."
    options:
      - {value: 0, label: "Нет трудностей концентрации"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Эпизодически трудно собраться с мыслями"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Затруднения концентрации и длительного сосредоточения со снижением способности читать или вести беседу"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Утрата способности читать или вести беседу без значительных усилий"}
  - id: 7
    text: "УСТАЛОСТЬ Затруднения начать какую-либо деятельность или замедленность начала и выполнения повседневной деятельности"
    options:
      - {value: 0, label: "Трудности в начале деятельности сомнительны, отсутствие замедленности"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Затруднение начать активную деятельность"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Трудности начать рутинные действия, сопряженные с затратой сил"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Сильная вялость, неспособность делать хоть что-нибудь без помощи"}
  - id: 8
    text: "НЕСПОСОБНОСТЬ ИСПЫТЫВАТЬ ЧУВСТВА Субъективное ощущение снижения интереса к окружающему или деятельности, обычно доставляющим удовольствие. Снижение способности адекватно эмоционально реагировать на внешние события или людей"
    options:
      - {value: 0, label: "Нормальный интерес к окружающему и людям"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Снижение способности получать удовольствие от обычных интересов"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Утрата интереса к окружающему, утрата чувств к друзьям и близким"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Явления эмоционального паралича, неспособность испытывать гнев, горе или удовольствие, мучительное отсутствие чувств к родственникам и друзьям"}
  - id: 9
    text: "ПЕССИМИСТИЧЕСКИЕ МЫСЛИ Идеи собственной вины, малоценности, самоуничижения, греховности или раскаяния."
    options:
      - {value: 0, label: "Отсутствие пессимистических мыслей"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Эпизодические мысли о собственной неспособности добиваться успеха, самоупреки и самоуничижение"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Постоянное самообвинение или конкретные, но еще сохраняющие рациональность, идеи вины или греха. Нарастающая пессимистическая оценка будущего"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Бредовые идеи полного краха, раскаяния или неискупаемого греха; абсурдное и непоколебимое самообвинение."}
  - id: 10
    text: "СУИЦИДАЛЬНЫЕ МЫСЛИ Чувство, что жить больше не стоит, что естественная смерть – желаемый исход; мысли и приготовления к самоубийству. Суицидальные попытки сами по себе не должны изменять оценку."
    hint: "Сумма баллов:"
    options:
      - {value: 0, label: "Доволен жизнью или принимает ее такой, какая она есть"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "Усталость от жизни. Лишь мимолетные суицидальные мысли"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "Возможно лучше было бы умереть; суицидальные мысли становятся привычными, а самоубийство рассматривается как возможный способ решения проблем при отсутствии конкретных суицидальных планов или намерений"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "Конкретное планирование самоубийства при первой возможности; активные приготовления к самоубийству"}

scoring:
  method: sum
  bands:
    - {lower: 0,  upper: 6,  code: norm,     level: 0, label: "Норма"}
    - {lower: 7,  upper: 19, code: mild,     level: 1, label: "Лёгкое депрессивное расстройство"}
    - {lower: 20, upper: 34, code: moderate, level: 2, label: "Депрессивное расстройство средней степени тяжести"}
    - {lower: 35, upper: 60, code: severe,   level: 3, label: "Депрессивное расстройство тяжёлой степени"}

critical:
  - {item: 10, min_value: 4, proposal: true,
     note: "Суицидальные мысли ≥ 4: нужна оценка суицидального риска (предложение, в КР не задано)"}
