# SIFS — КР F60–F61, приложение Г1. Самоотчёт, 24 утверждения, 0–4.
# Обратные пункты (R) пересчитываются как 4 − ответ. Общий балл = сумма средних по 4 подшкалам;
# коэффициент тяжести = общий балл / 4. Значения ниже 1,30 ключом КР не описаны.
# В PDF у пунктов 6 и 24 шкала ответов не напечатана; пункт 1 продублирован перед пунктом 22.
code: SIFS
version: 1
name: SIFS · шкала личностного и межличностного функционирования
measures: personality_functioning
direction: higher_is_worse
diagnoses:
- F60
- F61
filled_by: patient
source: КР F60–F61, приложение Г1, стр. PDF 50–52
answer_sets:
  describes:
  - value: 0
    label: Утверждение совсем не описывает меня
  - value: 1
    label: Утверждение едва описывает меня
  - value: 2
    label: Утверждение умеренно описывает меня
  - value: 3
    label: Утверждение во многом описывает меня
  - value: 4
    label: Утверждение полностью описывает меня
items:
- id: 1
  text: Я способен выносить большинство своих эмоций и хорошо управлять ими.
  answers: describes
- id: 2
  text: На моей самооценке сильно сказываются мои неудачи или разочарования
  answers: describes
- id: 3
  text: Я чувствую глубокую пустоту внутри себя
  answers: describes
- id: 4
  text: Я склонен путать свои эмоции с эмоциями других людей
  answers: describes
- id: 5
  text: Я запутался в том, кто я есть на самом деле
  answers: describes
- id: 6
  text: Я узнаю себя в том, как меня описывают другие
  answers: describes
- id: 7
  text: Мне часто кажется, что моя жизнь не имеет смысла
  answers: describes
- id: 8
  text: Я ставлю перед собой разумные цели и предпринимаю реальные меры для их достижения
  answers: describes
- id: 9
  text: Иногда я не понимаю, почему я вел себя определенным образом или почему принял некоторые решения
  answers: describes
- id: 10
  text: В своих действиях и решениях я руководствуюсь своими неотложными потребностями, невзирая на все остальное
  answers: describes
- id: 11
  text: Я часто меняю свои планы и жизненные цели
  answers: describes
- id: 12
  text: Мои действия и мои решения соответствуют моим ценностям и убеждениям
  answers: describes
- id: 13
  text: Люди часто негативно реагируют на мои слова или мои действия, и я не до конца понимаю, почему
  answers: describes
- id: 14
  text: Люди критикуют меня за то, что я нечуток к другим.
  answers: describes
- id: 15
  text: Я часто нахожусь в замешательстве, почему люди ведут себя по отношению ко мне определенным образом
  answers: describes
- id: 16
  text: Меня мало интересуют чувства или проблемы других людей
  answers: describes
- id: 17
  text: Во время беседы мне любопытно и интересно узнать точку зрения других людей
  answers: describes
- id: 18
  text: Когда кто-то думает не так, как я, или возражает мне, я склонен реагировать негативно или гневно, даже если этот человек
    вел себя уважительно
  answers: describes
- id: 19
  text: У меня много межличностных отношений, которые приносят удовлетворение мне и другому человеку
  answers: describes
- id: 20
  text: Как правило, мои дружеские или любовные отношения длятся не очень долго
  answers: describes
- id: 21
  text: Если я нахожусь в отношениях с другими людьми, то это в первую очередь потому, что я хочу, чтобы они удовлетворяли
    некоторые из моих потребностей
  answers: describes
- id: 22
  text: На самом деле я не испытываю желания или интереса, чтобы поддерживать взаимоотношения с другими людьми
  answers: describes
- id: 23
  text: Я не доверяю другим и предпочитаю держаться с ними на некотором расстоянии, чтобы избежать от них вреда
  answers: describes
- id: 24
  text: В моей жизни есть много людей, с которыми я близок и поддерживаю отношения, основанные на уважении, привязанности
    и взаимной поддержки
  answers: describes
scoring:
  method: subscales
  subscales:
  - code: self_awareness
    name: Самосознание
    items:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    reverse:
    - 1
    - 6
    aggregate: mean
    reverse_base: 4
  - code: self_direction
    name: Самонаправленность
    items:
    - 8
    - 9
    - 10
    - 11
    - 12
    reverse:
    - 8
    - 12
    aggregate: mean
    reverse_base: 4
  - code: empathy
    name: Эмпатия
    items:
    - 13
    - 14
    - 15
    - 16
    - 17
    - 18
    reverse:
    - 17
    aggregate: mean
    reverse_base: 4
  - code: intimacy
    name: Потребность в доверительных отношениях
    items:
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    reverse:
    - 19
    - 24
    aggregate: mean
    reverse_base: 4
  indices:
  - code: total
    name: Общий балл
    aggregate: sum_subscores
    subscales: &id001
    - self_awareness
    - self_direction
    - empathy
    - intimacy
  - code: severity
    name: Коэффициент тяжести
    aggregate: mean_subscores
    subscales: *id001
  bands_on: severity
  bands:
  - lower: 0.0
    upper: 1.29
    code: below
    level: 0
    label: Ниже порога ключа КР (1,30)
  - lower: 1.3
    upper: 1.89
    code: mild
    level: 1
    label: Лёгкое расстройство личности
  - lower: 1.9
    upper: 2.49
    code: moderate
    level: 2
    label: Умеренное расстройство личности
  - lower: 2.5
    upper: 4.0
    code: severe
    level: 3
    label: Тяжёлое расстройство личности
    provisional: true
  round: 2
notes:
- 'SIFS: для сопоставления с ключом коэффициент округляется до сотых. Граница 2,50 отнесена к тяжёлой степени предварительно:
  в тексте КР указано «более 2,5».'
