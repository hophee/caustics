# BHS — КР F43.1, приложение Г10. Пациент; мироощущение за последнюю неделю.
# Баллы «Верно/Неверно» по ключу КР различаются по пунктам (заданы в options).
# По КР методика — косвенный индикатор суицидального риска.
code: BHS
version: 1
name: "BHS · шкала безнадёжности Бека"
measures: hopelessness
direction: higher_is_worse
diagnoses: [F43.1]
filled_by: patient
source: "КР F43.1, приложение Г10, стр. PDF 195–197"

items:
  - id: 1
    text: "Я смотрю в будущее с надеждой и энтузиазмом."
    options:
      - {value: 0, label: "ВЕРНО"}
      - {value: 1, label: "НЕВЕРНО"}
  - id: 2
    text: "С тем же успехом я мог бы сдаться, потому что я не смогу сделать свою жизнь лучше."
    options:
      - {value: 1, label: "ВЕРНО"}
      - {value: 0, label: "НЕВЕРНО"}
  - id: 3
    text: "Когда дела идут плохо, мне помогает мысль, что так не может продолжаться вечно."
    options:
      - {value: 0, label: "ВЕРНО"}
      - {value: 1, label: "НЕВЕРНО"}
  - id: 4
    text: "Я не могу представить, какой будет моя жизнь через 10 лет."
    options:
      - {value: 1, label: "ВЕРНО"}
      - {value: 0, label: "НЕВЕРНО"}
  - id: 5
    text: "Мне хватает времени, чтобы успевать делать то, что я хочу."
    options:
      - {value: 0, label: "ВЕРНО"}
      - {value: 1, label: "НЕВЕРНО"}
  - id: 6
    text: "В будущем я рассчитываю добиться успеха в том, что больше всего для меня важно."
    options:
      - {value: 0, label: "ВЕРНО"}
      - {value: 1, label: "НЕВЕРНО"}
  - id: 7
    text: "Мое будущее кажется мне мрачным."
    options:
      - {value: 1, label: "ВЕРНО"}
      - {value: 0, label: "НЕВЕРНО"}
  - id: 8
    text: "Я удачливый и ожидаю от жизни больше хорошего, чем обычный человек."
    options:
      - {value: 0, label: "ВЕРНО"}
      - {value: 1, label: "НЕВЕРНО"}
  - id: 9
    text: "Я не могу быть успешным сейчас и не вижу оснований для успеха в будущем."
    options:
      - {value: 1, label: "ВЕРНО"}
      - {value: 0, label: "НЕВЕРНО"}
  - id: 10
    text: "Мой прошлый жизненный опыт хорошо подготовил меня к будущему."
    options:
      - {value: 0, label: "ВЕРНО"}
      - {value: 1, label: "НЕВЕРНО"}
  - id: 11
    text: "Всё, что я вижу впереди, это скорее неприятности, чем удовольствия."
    options:
      - {value: 1, label: "ВЕРНО"}
      - {value: 0, label: "НЕВЕРНО"}
  - id: 12
    text: "Я не ожидаю получить то, что действительно хочу."
    options:
      - {value: 1, label: "ВЕРНО"}
      - {value: 0, label: "НЕВЕРНО"}
  - id: 13
    text: "Когда я думаю о будущем, я ожидаю, что буду счастливее, чем сейчас."
    options:
      - {value: 0, label: "ВЕРНО"}
      - {value: 1, label: "НЕВЕРНО"}
  - id: 14
    text: "Дела идут совсем не так, как я хочу."
    options:
      - {value: 1, label: "ВЕРНО"}
      - {value: 0, label: "НЕВЕРНО"}
  - id: 15
    text: "Я очень верю в своё будущее."
    options:
      - {value: 0, label: "ВЕРНО"}
      - {value: 1, label: "НЕВЕРНО"}
  - id: 16
    text: "Я никогда не получаю того, чего хочу, поэтому глупо чего-то желать."
    options:
      - {value: 1, label: "ВЕРНО"}
      - {value: 0, label: "НЕВЕРНО"}
  - id: 17
    text: "Очень маловероятно, что в будущем меня ждет хоть какое-то реальное удовлетворение."
    options:
      - {value: 1, label: "ВЕРНО"}
      - {value: 0, label: "НЕВЕРНО"}
  - id: 18
    text: "Будущее кажется мне туманным и неопределенным."
    options:
      - {value: 1, label: "ВЕРНО"}
      - {value: 0, label: "НЕВЕРНО"}
  - id: 19
    text: "В будущем я могу ожидать больше хороших дней, чем плохих."
    options:
      - {value: 0, label: "ВЕРНО"}
      - {value: 1, label: "НЕВЕРНО"}
  - id: 20
    text: "Нет смысла пытаться получить что-либо из того, что я хочу, потому что вряд ли я добьюсь этого."
    options:
      - {value: 1, label: "ВЕРНО"}
      - {value: 0, label: "НЕВЕРНО"}

scoring:
  method: sum
  bands:
    - {lower: 0,  upper: 3,  code: norm,     level: 0, label: "В пределах нормы (или бессимптомно)"}
    - {lower: 4,  upper: 8,  code: mild,     level: 1, label: "Лёгкая безнадёжность"}
    - {lower: 9,  upper: 14, code: moderate, level: 2, label: "Умеренная безнадёжность"}
    - {lower: 15, upper: 20, code: severe,   level: 3, label: "Тяжёлая степень безнадёжности"}

critical:
  - kind: band
    band_codes: [severe]
    note: "Тяжёлая безнадёжность: косвенный индикатор суицидального риска (по КР)"
