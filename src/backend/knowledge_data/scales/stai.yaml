  - {id: 40, text: "Меня охватывает беспокойство, когда я думаю о своих делах и заботах", answers: freq}

scoring:
  method: formula_subscales
  subscales:
    - code: reactive
      name: "Реактивная (ситуативная) тревожность"
      direct: [3, 4, 6, 7, 9, 12, 14, 15, 17, 18]
      reverse: [1, 2, 5, 8, 10, 11, 13, 16, 19, 20]
      constant: 50
      bands:
        - {lower: 20, upper: 30, code: low, level: 0, label: "Низкая"}
        - {lower: 31, upper: 44, code: moderate, level: 2, label: "Умеренная"}
        - {lower: 45, upper: 80, code: high, level: 3, label: "Высокая"}
    - code: personal
      name: "Личностная тревожность"
      direct: [22, 23, 24, 25, 28, 29, 31, 32, 34, 35, 37, 38, 40]
      reverse: [21, 26, 27, 30, 33, 36, 39]
      constant: 35
      bands:
        - {lower: 20, upper: 30, code: low, level: 0, label: "Низкая"}
        - {lower: 31, upper: 44, code: moderate, level: 2, label: "Умеренная"}
        - {lower: 45, upper: 80, code: high, level: 3, label: "Высокая"}
