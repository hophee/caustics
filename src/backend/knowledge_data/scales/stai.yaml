  - id: 20
    text: "Мне приятно"
    hint: "Шкала личной тревожности Инструкция. Прочитайте внимательно каждое из приведенных ниже предложений и зачеркните цифру в соответствующей графе справа в зависимости от того, как Вы себя чувствуете обычно. Над вопросами долго не думайте, поскольку правильных или неправильных ответов нет. Варианты ответа: Никогда (1) · Почти никогда (2) · Часто (3) · Почти всегда (4)"
    answers: freq
  - {id: 21, text: "У меня бывает приподнятое настроение", answers: freq}
  - {id: 22, text: "Я бываю раздражительным", answers: freq}
  - {id: 23, text: "Я легко расстраиваюсь", answers: freq}
  - {id: 24, text: "Я хотел бы быть таким же удачливым, как и другие", answers: freq}
