# STAI (Спилбергер–Ханин) — КР F41.1, приложение Г5; также КР F40 (Г4) и F41.0 (Г7).
# Тексты утверждений — по КР (в прототипе были заглушки). Варианты ответа по КР одинаковы
# для обеих частей: «Никогда / Почти никогда / Часто / Почти всегда» (1–4); в прототипе для
# реактивной части были «Нет, это не так … Совершенно верно» — заменено по КР.
# В КР F41.0 пункты личностной тревожности пронумерованы 1–20, ключ ссылается на 21–40.
code: STAI
version: 1
name: "STAI · шкала тревоги Спилбергера–Ханина"
measures: anxiety
direction: higher_is_worse
diagnoses: [F40, F41.0, F41.1]
filled_by: patient
source: "КР F41.1, приложение Г5, стр. PDF 100–103; также КР F40, приложение Г4; КР F41.0, приложение Г7"
licence_note: "Copyrighted instrument; confirm rights before production use."

answer_sets:
  freq:
    - {value: 1, label: "Никогда"}
    - {value: 2, label: "Почти никогда"}
    - {value: 3, label: "Часто"}
    - {value: 4, label: "Почти всегда"}

items:
  - {id: 1, text: "Я спокоен", answers: freq}
  - {id: 2, text: "Мне ничто не угрожает", answers: freq}
  - {id: 3, text: "Я нахожусь в напряжении", answers: freq}
  - {id: 4, text: "Я внутренне скован", answers: freq}
  - {id: 5, text: "Я чувствую себя свободно", answers: freq}
  - {id: 6, text: "Я расстроен", answers: freq}
  - {id: 7, text: "Меня волнуют возможные неудачи", answers: freq}
  - {id: 8, text: "Я ощущаю душевный покой", answers: freq}
  - {id: 9, text: "Я встревожен", answers: freq}
  - {id: 10, text: "Я испытываю чувство внутреннего удовлетворения", answers: freq}
  - {id: 11, text: "Я уверен в себе", answers: freq}
  - {id: 12, text: "Я нервничаю", answers: freq}
  - {id: 13, text: "Я не нахожу себе места", answers: freq}
  - {id: 14, text: "Я взвинчен", answers: freq}
