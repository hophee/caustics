# ShARS — КР F41.1, приложение Г7; также КР F40 (Г6) и F41.0 (Г9); в F40 в п. 26 «диареи» вместо «поноса».
# Самооценка; период — последняя неделя (7 дней). Сумма 0–140.
# По КР при ПР и агорафобии показатели обычно в диапазоне 37–77 баллов.
code: ShARS
version: 1
name: "ShARS · шкала самооценки тревоги Д. Шихана"
measures: anxiety
direction: higher_is_worse
diagnoses: [F40, F41.0, F41.1]
filled_by: patient
source: "КР F41.1, приложение Г7, стр. PDF 107–110; также КР F40, приложение Г6; КР F41.0, приложение Г9"

answer_sets:
  bother:
    - {value: 0, label: "Нисколько"}
    - {value: 1, label: "Немного"}
    - {value: 2, label: "Умеренно"}
    - {value: 3, label: "Сильно"}
    - {value: 4, label: "Крайне сильно"}

items:
  - {id: 1, text: "Затруднение на вдохе, нехватка воздуха или учащённое дыхание", answers: bother}
  - {id: 2, text: "Ощущение удушья или комка в горле", answers: bother}
  - {id: 3, text: "Сердце скачет, колотиться, готово выскочить из груди", answers: bother}
  - {id: 4, text: "Загрудинная боль, неприятное чувство сдавления в груди", answers: bother}
  - {id: 5, text: "Профузная потливость (пот градом)", answers: bother}
  - {id: 6, text: "Слабость, приступы дурноты, головокружения", answers: bother}
  - {id: 7, text: "«Ватные», «не свои» ноги", answers: bother}
  - {id: 8, text: "Ощущение неустойчивости или потери равновесия", answers: bother}
  - {id: 9, text: "Тошнота или неприятные ощущения в животе", answers: bother}
  - {id: 10, text: "Ощущение того, что всё окружающее становится странным, нереальным, туманным или отстранённым", answers: bother}
  - {id: 11, text: "Ощущение, что всё плывёт, «нахожусь вне тела»", answers: bother}
  - {id: 12, text: "Покалывание или онемение в разных частях тела", answers: bother}
  - {id: 13, text: "Приливы жара или озноба", answers: bother}
  - {id: 14, text: "Дрожь (тремор)", answers: bother}
  - {id: 15, text: "Страх смерти или того, что сейчас может произойти что-то ужасное", answers: bother}
  - {id: 16, text: "Страх сойти с ума или потери самообладания", answers: bother}
  - id: 17
    text: "Внезапные приступы тревоги, сопровождающиеся тремя или более из вышеперечисленных признаков, возникающие непосредственно перед и при попадании в ситуацию, которая, по Вашему опыту, может вызвать приступ"
    answers: bother
  - id: 18
    text: "Внезапные неожиданные приступы тревоги, сопровождающиеся тремя или более из выше перечисленных признаков, возникающие по незначительным поводам или без повода (т.е., когда Вы НЕ находитесь в ситуации, которая, по Вашему опыту, может вызвать приступ)"
    answers: bother
  - id: 19
    text: "Внезапные неожиданные приступы, сопровождающиеся только одним или двумя из вышеперечисленных признаков, возникающие по незначительным поводам или без повода (т.е., когда Вы НЕ находитесь в ситуации, которая, по Вашему опыту, может вызвать приступ)"
    answers: bother
  - id: 20
    text: "Периоды тревоги, нарастающей по мере того, как Вы готовитесь сделать что-то, что, по Вашему опыту, может вызвать тревогу, причём более сильную, чем ту, что в таких случаях испытывает большинство людей"
    answers: bother
  - {id: 21, text: "Избегание пугающих вас ситуаций", answers: bother}
  - {id: 22, text: "Состояние зависимости от других людей", answers: bother}
  - {id: 23, text: "Напряжённость и неспособность расслабиться", answers: bother}
  - {id: 24, text: "Тревога, «нервозность», беспокойство", answers: bother}
  - {id: 25, text: "Приступы повышенной чувствительности к звуку, свету и прикосновению", answers: bother}
  - {id: 26, text: "Приступы поноса", answers: bother}
  - {id: 27, text: "Чрезмерное беспокойство о собственном здоровье", answers: bother}
  - {id: 28, text: "Ощущение усталости, слабости и повышенной истощаемости", answers: bother}
  - {id: 29, text: "Головные боли или боли в шее", answers: bother}
  - {id: 30, text: "Трудности засыпания", answers: bother}
  - {id: 31, text: "Просыпания среди ночи или беспокойный сон", answers: bother}
  - {id: 32, text: "Неожиданные периоды депрессии, возникающие по незначительным поводам или без повода", answers: bother}
  - {id: 33, text: "Перепады настроения и эмоций, которые в основном зависят от того, что происходит вокруг Вас", answers: bother}
  - id: 34
    text: "Повторяющиеся и неотступные представления, мысли, импульсы или образы, которые Вам кажутся тягостными, противными, бессмысленными или отталкивающими"
    answers: bother
  - id: 35
    text: "Повторение одного и того же действия как ритуала, например, повторные перепроверки, перемывание и пересчёт при отсутствии в этом действии необходимости"
    answers: bother

scoring:
  method: sum
  bands:
    - {lower: 0,  upper: 29,  code: none,     level: 0, label: "Отсутствие клинически выраженной тревоги"}
    - {lower: 30, upper: 79,  code: clinical, level: 2, label: "Клинически выраженная тревога"}
    - {lower: 80, upper: 140, code: severe,   level: 3, label: "Тяжёлое тревожное расстройство, паническое расстройство"}
