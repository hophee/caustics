# GELOPH-15 — КР F40, приложение Г18. Пациент. 15 утверждений, 1–4.
# Средние значения по КР даны с одним знаком после запятой: перед сравнением с ключом
# среднее округляется до 0,1 (иначе 1,2–1,3 и 2,2–2,3 не покрыты).
code: GELOPH-15
version: 1
name: "GELOPH-15 · опросник гелотофобии"
measures: gelotophobia
direction: higher_is_worse
diagnoses: [F40]
filled_by: patient
source: "КР F40, приложение Г18, стр. PDF 144–146"

answer_sets:
  agree4:
    - {value: 1, label: "Совершенно не согласен"}
    - {value: 2, label: "Не согласен"}
    - {value: 3, label: "Согласен"}
    - {value: 4, label: "Совершенно согласен"}

items:
  - {id: 1, text: "Когда в моем присутствии начинают смеяться, я настораживаюсь.", answers: agree4}
  - id: 2
    text: "Я стараюсь уклоняться от публичных выступлений, потому что мне кажется, что другие люди почувствуют мою неуверенность и будут насмехаться надо мной."
    answers: agree4
  - {id: 3, text: "Когда посторонние люди в моем присутствии начинают смеяться, мне часто кажется, что они смеются надо мной.", answers: agree4}
  - {id: 4, text: "Мне трудно поддерживать контакт глаз, потому что я боюсь услышать пренебрежительный комментарий в свой адрес.", answers: agree4}
  - {id: 5, text: "Когда мне делают шутливые замечания, я становлюсь словно парализованным.", answers: agree4}
  - {id: 6, text: "Я контролирую себя, чтобы ненароком не попасть в неприятную, досадную ситуацию и не стать из-за этого объектом насмешки.", answers: agree4}
  - {id: 7, text: "Мне кажется, что на других я произвожу странное впечатление.", answers: agree4}
  - id: 8
    text: "Несмотря на то, что я часто чувствую себя одиноким, я стараюсь избегать общественных мероприятий, чтобы уберечь себя от возможных высмеиваний и насмешек."
    answers: agree4
  - {id: 9, text: "Если однажды где-нибудь я вел себя особенно неловко, я стараюсь избегать этого места.", answers: agree4}
  - {id: 10, text: "Если бы у меня не возникало страха быть смешным на публике, я бы выступал публично.", answers: agree4}
  - {id: 11, text: "Если у кого-то я однажды вызвал смех, я никогда больше не смогу непринужденно общаться с этим человеком.", answers: agree4}
  - {id: 12, text: "Мне требуется очень много времени, чтобы прийти в себя после шутки в свой адрес (насмешки).", answers: agree4}
  - {id: 13, text: "Во время танцев я чувствую себя некомфортно, поскольку убежден, что я из тех людей, которые вызывают смех и насмешки.", answers: agree4}
  - {id: 14, text: "Даже когда я чувствую себя вполне спокойно, у меня возрастает страх попасть в неприятную ситуацию и показаться странным.", answers: agree4}
  - {id: 15, text: "Если я оказываюсь в неловкой ситуации, я цепенею и не могу адекватно себя вести.", answers: agree4}

scoring:
  method: mean
  round: 1
  subscales:
    - {code: social_reaction, name: "Гелотофобичное социальное реагирование", items: [1, 3, 4, 5, 9, 11, 12, 13, 15], aggregate: mean}
    - {code: self_perception, name: "Гелотофобичное самовосприятие", items: [2, 6, 7, 8, 10, 14], aggregate: mean}
  bands:
    - {lower: 1.0, upper: 1.2, code: low,      level: 0, label: "Низкое значение"}
    - {lower: 1.3, upper: 2.2, code: moderate, level: 1, label: "Среднее значение"}
    - {lower: 2.3, upper: 4.0, code: high,     level: 3, label: "Высокое значение"}
