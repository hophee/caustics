# SCL-90-R — КР F41.1, приложение Г3; также КР F40 (Г2) и F41.0 (Г5). Самоотчёт, последняя неделя.
# Шкалы — средний балл по пунктам шкалы; индексы GSI, PSI, PDSI. Пороговых значений в КР нет,
# приведены нормы (Россия: среднее ± ошибка) — в поле norm_ru.
# Так в КР (все три КР): пункт 56 входит и в SOM, и в DEP (в оригинале DEP — пункт 5).
