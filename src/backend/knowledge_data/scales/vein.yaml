# Шкала Вейна — КР F41.0, приложение Г1. Опросник самоотчёта (11 вопросов, у 1–3 подпункты а/б).
# Балл начисляется при ответе «Да» (вес пункта по КР).
# Расхождение JSON и КР: у пункта 11 вес в JSON пуст, в КР F41.0 (стр. PDF 84) — 5; взято по КР.
# Уточнения («подчеркните нужное слово») в подсчёте не участвуют.
code: Vein
version: 1
name: "Шкала Вейна · вопросник для выявления признаков вегетативных изменений"
measures: autonomic_dysfunction
direction: higher_is_worse
diagnoses: [F41.0]
filled_by: patient_clinician
source: "КР F41.0, приложение Г1, стр. PDF 83–84"

items:
  - id: "1a"
    text: "Отмечаете ли вы (при любом волнении) склонность к: а) покраснению лица?"
    options:
      - {value: 0, label: "Нет"}
      - {value: 3, label: "Да"}
  - id: "1b"
    text: "Отмечаете ли вы (при любом волнении) склонность к: б) побледнению лица?"
    options:
      - {value: 0, label: "Нет"}
      - {value: 3, label: "Да"}
  - id: "2a"
    text: "Бывает ли у вас онемение или похолодание: а) пальцев кистей, стоп?"
    options:
      - {value: 0, label: "Нет"}
      - {value: 3, label: "Да"}
  - id: "2b"
    text: "Бывает ли у вас онемение или похолодание: б) целиком кистей, стоп?"
    options:
      - {value: 0, label: "Нет"}
      - {value: 4, label: "Да"}
  - id: "3a"
    text: "Бывает ли у вас изменение окраски (побледнение, покраснение, синюшность): а) пальцев кистей, стоп?"
    options:
      - {value: 0, label: "Нет"}
      - {value: 5, label: "Да"}
  - id: "3b"
    text: "Бывает ли у вас изменение окраски (побледнение, покраснение, синюшность): б) целиком кистей, стоп?"
    options:
      - {value: 0, label: "Нет"}
      - {value: 5, label: "Да"}
  - id: 4
    text: "Отмечаете ли вы повышенную потливость? В случае ответа «Да» подчеркните слово «постоянная» или «при волнении»"
    options:
      - {value: 0, label: "Нет"}
      - {value: 4, label: "Да"}
  - id: 5
    text: "Бывают ли у вас часто ощущения сердцебиения, «замирания», «остановки сердца»?"
    options:
      - {value: 0, label: "Нет"}
      - {value: 7, label: "Да"}
  - id: 6
    text: "Бывают ли у вас часто ощущения затруднения при дыхании: чувство нехватки воздуха, учащенное дыхание? В случае ответа «Да» уточните: при волнении, в душном помещении (подчеркните нужное слово)"
    options:
      - {value: 0, label: "Нет"}
      - {value: 7, label: "Да"}
  - id: 7
    text: "Характерно ли для вас нарушение функции желудочно-кишечного тракта: склонность к запорам, поносам, «вздутиям» живота, боли?"
    options:
      - {value: 0, label: "Нет"}
      - {value: 6, label: "Да"}
  - id: 8
    text: "Бывают ли у вас обмороки (потеря внезапно сознания или чувство, что вы можете его потерять?) Если «Да», то уточните условия: душное помещение, волнение, длительность пребывания в вертикальном положении (подчеркнуть нужное слово)"
    options:
      - {value: 0, label: "Нет"}
      - {value: 7, label: "Да"}
  - id: 9
    text: "Бывают ли у вас приступообразные головные боли? Если «Да», уточните: диффузные или только половина головы, «вся голова», сжимающие или пульсирующие (нужное подчеркнуть"
    options:
      - {value: 0, label: "Нет"}
      - {value: 7, label: "Да"}
  - id: 10
    text: "Отмечаете ли вы в настоящее время снижение работоспособности, быструю утомляемость?"
    options:
      - {value: 0, label: "Нет"}
      - {value: 5, label: "Да"}
  - id: "11a"
    text: "Отмечаете ли вы нарушения сна? В случае ответа «Да» уточните: а) трудность засыпания; б) поверхностный, неглубокий сон с частыми пробуждениями; в) чувство невыспанности, усталости при пробуждении утром (подчеркнуть нужное расстройство сна)"
    options:
      - {value: 0, label: "Нет"}
      - {value: 5, label: "Да"}

scoring:
  method: sum
  bands:
    - {lower: 0,  upper: 15, code: norm, level: 0, label: "В пределах значений здоровых лиц (≤ 15)"}
    - {lower: 16, upper: 71, code: avd,  level: 2, label: "Можно говорить о наличии синдрома вегетативной дистонии"}
