# ИТТ (Бизюк, Вассерман, Иовлев) — КР F41.1, приложение Г4; также КР F40 (Г3) и F41.0 (Г6).
# Два бланка: СТ-Л (личностная, «на протяжении последнего года») — пункты Л1–Л15;
# СТ-С (ситуативная, «сейчас») — пункты С1–С15. В бланке СТ-С пункты в PDF не пронумерованы.
# Результат — сырые баллы и станайны (нормы для взрослых и юношей / для девушек).
