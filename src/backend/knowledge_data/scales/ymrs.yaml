# YMRS — КР F31, приложение Г3. Эксперт, прошедший тренинг; состояние за последние 48 часов.
# Пункты 5, 6, 8, 9 оцениваются двойными баллами 0–8; по КР допустимы промежуточные 1, 3, 5, 7.
# В PDF у пункта 3 градация 0 обозначена «4.», у пункта 5 — «1»; баллы по смыслу шкалы 0.
code: YMRS
version: 1
name: "YMRS · шкала Янга для оценки выраженности маниакальной симптоматики"
measures: mania
direction: higher_is_worse
diagnoses: [F31]
filled_by: clinician
source: "КР F31, приложение Г3, стр. PDF 142–145"

items:
  - id: 1
    text: "Приподнятое настроение"
    options:
      - {value: 0, label: "отсутствует"}
      - {value: 1, label: "слабо или возможно повышенное, выявляется при расспросе"}
      - {value: 2, label: "субъективно ощущаемый подъем; больной выглядит оптимистичным, самоуверенным, веселым, адекватным обстановке"}
      - {value: 3, label: "настроение приподнятое, неадекватное обстановке, отпускает шутки"}
      - {value: 4, label: "больной эйфоричен, неадекватно смеется, поет."}
  - id: 2
    text: "Увеличение моторной активности, энергичность"
    options:
      - {value: 0, label: "отсутствует"}
      - {value: 1, label: "субъективно отмечаемое увеличение"}
      - {value: 2, label: "больной оживлен, жестикуляция усилена"}
      - {value: 3, label: "чрезмерная энергичность, периодическая гиперактивность, беспокойство (может быть успокоен)"}
      - {value: 4, label: "двигательное возбуждение, постоянная гиперактивность (невозможно успокоить)"}
  - id: 3
    text: "Сексуальная заинтересованность"
    options:
      - {value: 0, label: "нормальная, не повышена"}
      - {value: 1, label: "слегка или возможно повышена"}
      - {value: 2, label: "субъективно отмечаемое повышение"}
      - {value: 3, label: "в беседе спонтанно возникают сексуальные темы, много об этом говорит, сообщает о своей гиперсексуальности"}
      - {value: 4, label: "ярко выраженное сексуальное поведение (по отношению к пациентам, персоналу, врачу)"}
  - id: 4
    text: "Сон"
    options:
      - {value: 0, label: "не сообщает об уменьшении продолжительности сна"}
      - {value: 1, label: "уменьшение продолжительности сна менее чем на 1 час по отношению к обычному"}
      - {value: 2, label: "уменьшение продолжительности сна более чем на час"}
      - {value: 3, label: "сообщает о снижении потребности во сне"}
      - {value: 4, label: "отрицает потребность во сне"}
  - id: 5
    text: "Раздражительность"
    options:
      - {value: 0, label: "отсутствует"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "субъективное повышение"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "раздражителен во время интервью, недавние эпизоды гнева или раздражительности в отделении"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "часто раздражается во время интервью, стремится прервать беседу"}
      - {value: 7, label: "Промежуточная оценка (7)"}
      - {value: 8, label: "враждебен, отказывается от сотрудничества, интервью невозможно"}
  - id: 6
    text: "Речь (скорость и количество)"
    options:
      - {value: 0, label: "не увеличена"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "субъективно отмечаемая разговорчивость"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "периодически многословен, речь ускорена"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "речь с напором, отчетливое ускорение темпа, многоречив, трудно перебить"}
      - {value: 7, label: "Промежуточная оценка (7)"}
      - {value: 8, label: "«словесный поток», невозможно перебить, непрерывная речь"}
  - id: 7
    text: "Нарушение мышления"
    options:
      - {value: 0, label: "отсутствует"}
      - {value: 1, label: "больной обстоятельный, несколько отвлекаем, мышление ускорено"}
      - {value: 2, label: "отвлекаем, теряет цель высказывания, часто меняет тему, «скачка идей»"}
      - {value: 3, label: "наплыв идей, идеаторная спутанность, непоследовательность; рифмует предложения; эхолалия"}
      - {value: 4, label: "мышление инкогеррентное; не способен к продуктивному контакту"}
  - id: 8
    text: "Содержание идей"
    options:
      - {value: 0, label: "нормальное"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "сомнительные планы, новые интересы"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "особые проекты, гиперрелигиозность"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "грандиозные или параноидные идеи, идеи отношения"}
      - {value: 7, label: "Промежуточная оценка (7)"}
      - {value: 8, label: "бред, галлюцинации"}
  - id: 9
    text: "Агрессивное поведение"
    options:
      - {value: 0, label: "отсутствует, сотрудничает с врачом"}
      - {value: 1, label: "Промежуточная оценка (1)"}
      - {value: 2, label: "саркастичен в общении, периодически повышает голос, напряжен"}
      - {value: 3, label: "Промежуточная оценка (3)"}
      - {value: 4, label: "выдвигает требования, высказывает угрозы в отделении"}
      - {value: 5, label: "Промежуточная оценка (5)"}
      - {value: 6, label: "угрожает врачу, бранится, проведение интервью затруднено"}
      - {value: 7, label: "Промежуточная оценка (7)"}
      - {value: 8, label: "нападает, совершает деструктивные действия, интервью невозможно"}
  - id: 10
    text: "Внешний вид"
    options:
      - {value: 0, label: "соответствующе одет и ухожен"}
      - {value: 1, label: "несколько небрежный вид"}
      - {value: 2, label: "выглядит неухоженным, небрежно одетым, неадекватная «нарядность»"}
      - {value: 3, label: "неопрятен, одет не полностью, кричащий макияж"}
      - {value: 4, label: "одет крайне небрежно, вычурно, много украшений"}
  - id: 11
    text: "Сознание болезни"
    options:
      - {value: 0, label: "признает себя больным, соглашается с необходимостью лечения"}
      - {value: 1, label: "соглашается, что возможно болен"}
      - {value: 2, label: "признает перемены в поведении, но отрицает болезнь"}
      - {value: 3, label: "признает, что возможны перемены в поведении, но отрицает болезнь"}
      - {value: 4, label: "отрицает любые изменения в поведении"}

scoring:
  method: sum
  bands:
    - {lower: 0,  upper: 12, code: norm,      level: 0, label: "Норма"}
    - {lower: 13, upper: 21, code: hypomania, level: 1, label: "Гипоманиакальное состояние"}
    - {lower: 22, upper: 30, code: mania,     level: 2, label: "Маниакальное состояние"}
    - {lower: 31, upper: 60, code: severe,    level: 3, label: "Выраженное маниакальное состояние"}
