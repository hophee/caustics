# C-SSRS — КР F31, приложение Г1; также КР F32–F33 (Г4), F42 (Г2), F20 (Г6).
# Clinician interview, rule-based, doctor-only. Бланк по КР F31 (в F32–F33 не напечатаны
# коды 1–5 раздела «Интенсивность»). Разделы: ideation → intensity → behavior → lethality.
# Ключ КР: тяжесть идей ≥ 3 — серьёзный риск; 5, а также любые суицидальные действия —
# крайне высокий риск. В КР F20 указано, что шкала «не имеет количественной оценки».
code: C-SSRS
version: 2
name: C-SSRS · Колумбийская шкала серьёзности суицидальных намерений
measures: suicide_risk
direction: higher_is_worse
diagnoses:
- F20
- F31
- F32
- F33
- F42
filled_by: clinician
source: КР F31, приложение Г1, стр. PDF 127–137; также КР F32–F33, приложение Г4; КР F42, приложение Г2; КР F20, приложение
  Г6
answer_sets:
  yes_no:
  - value: 0
    label: Нет
  - value: 1
    label: Да
items:
- id: 1
  text: Желание умереть. Возникало ли у Вас желание умереть или заснуть и не просыпаться?
  answers: yes_no
  section: ideation
- id: 2
  text: Активные неспецифические мысли о самоубийстве. Думали ли Вы, в самом деле, о том, чтобы убить себя?
  answers: yes_no
  section: ideation
- id: 3
  text: Актуальные суицидальные идеи, включая размышления о способе самоубийства (не о плане), при отсутствии намерения действовать.
    Думали ли Вы о том, как Вы могли бы это сделать?
  answers: yes_no
  section: ideation
  show_if:
    match: any
    conditions:
    - item: 2
      equals: 1
- id: 4
  text: Актуальные суицидальные идеи, включая некоторое намерение действовать при отсутствии конкретного плана. Посещали ли
    Вас подобные мысли, и было ли у Вас какое-нибудь намерение действовать в соответствии с ними?
  answers: yes_no
  section: ideation
  show_if:
    match: any
    conditions:
    - item: 2
      equals: 1
- id: 5
  text: Актуальные суицидальные идеи с конкретным планом и намерением. Начали ли Вы разрабатывать или уже разработали детальный
    план самоубийства? Намереваетесь ли Вы осуществить этот план?
  answers: yes_no
  section: ideation
  show_if:
    match: any
    conditions:
    - item: 2
      equals: 1
- id: most_severe_type
  text: 'Интенсивность суицидальных идей: тип наиболее опасной идеи (№ 1–5)'
  scored: false
  section: intensity
  show_if:
    match: any
    conditions:
    - item: 1
      equals: 1
    - item: 2
      equals: 1
  options:
  - value: 1
    label: Тип 1
  - value: 2
    label: Тип 2
  - value: 3
    label: Тип 3
  - value: 4
    label: Тип 4
  - value: 5
    label: Тип 5
- id: freq
  text: Частота. Сколько раз Вас посещали подобные мысли?
  scored: false
  section: intensity
  show_if:
    match: any
    conditions:
    - item: 1
      equals: 1
    - item: 2
      equals: 1
  options:
  - value: 1
    label: Реже одного раза в неделю
  - value: 2
    label: Раз в неделю
  - value: 3
    label: 2-5 раз в неделю
  - value: 4
    label: Каждый день или почти каждый день
  - value: 5
    label: Многократно каждый день
- id: duration
  text: Продолжительность. Когда подобные мысли посещают Вас, как долго они длятся?
  scored: false
  section: intensity
  show_if:
    match: any
    conditions:
    - item: 1
      equals: 1
    - item: 2
      equals: 1
  options:
  - value: 1
    label: Они мимолетны - несколько секунд или минут
  - value: 2
    label: Менее часа / недолго
  - value: 3
    label: 1-4 часа / долго
  - value: 4
    label: 4-8 часов / большую часть дня
  - value: 5
    label: Более 8 часов / они устойчивы или постоянны
- id: control
  text: Контролируемость. Могли /можете ли Вы при желании прекратить думать о самоубийстве или желании умереть?
  scored: false
  section: intensity
  show_if:
    match: any
    conditions:
    - item: 1
      equals: 1
    - item: 2
      equals: 1
  options:
  - value: 0
    label: Не пытается контролировать такие мысли
  - value: 1
    label: С легкостью может контролировать такие мысли
  - value: 2
    label: Может контролировать такие мысли с незначительными затруднениями
  - value: 3
    label: Может контролировать такие мысли с некоторыми затруднениями
  - value: 4
    label: Может контролировать такие мысли с большими затруднениями
  - value: 5
    label: Не в состоянии контролировать такие мысли
- id: deterrents
  text: Сдерживающие факторы. Есть ли что-то или кто-то (например, семья, религия, страх перед болью /смертью), что удержало
    Вас от стремления к смерти или от попыток осуществления мыслей о самоубийстве?
  scored: false
  section: intensity
  show_if:
    match: any
    conditions:
    - item: 1
      equals: 1
    - item: 2
      equals: 1
  options:
  - value: 0
    label: Данный пункт не применим
  - value: 1
    label: Сдерживающие факторы определенно удержали Вас от попытки самоубийства
  - value: 2
    label: Вероятно, сдерживающие факторы удержали Вас
  - value: 3
    label: Вы не уверены, что сдерживающие факторы не удержали Вас
  - value: 4
    label: Скорее всего, сдерживающие факторы не удержали Вас
  - value: 5
    label: Сдерживающие факторы определенно не удержали Вас
- id: reasons
  text: Основания суицидальных идей. Какие основания были у Вас для того, чтобы думать о желании умереть или самоубийстве?
  scored: false
  section: intensity
  show_if:
    match: any
    conditions:
    - item: 1
      equals: 1
    - item: 2
      equals: 1
  options:
  - value: 0
    label: Данный пункт не применим
  - value: 1
    label: Исключительно для того, чтобы привлечь внимание, отомстить или добиться отклика других людей
  - value: 2
    label: Большей частью для того, чтобы привлечь внимание, отомстить или добиться отклика других людей
  - value: 3
    label: В равной степени для того, чтобы привлечь внимание, отомстить или добиться отклика других людей и для того, чтобы
      прекратить / остановить боль
  - value: 4
    label: Большей частью для того, чтобы прекратить / остановить боль (Вы не могли продолжать жить, испытывая эту боль или
      то, что Вы испытывали)
  - value: 5
    label: Исключительно для того, чтобы прекратить или остановить боль (Вы не могли продолжать жить, испытывая эту боль или
      то, что Вы чувствовали)
- id: attempt
  text: Истинная попытка самоубийства. Предпринимали ли Вы попытку самоубийства? Предпринимали ли Вы какие-либо действия с
    целью нанести себе вред?
  answers: yes_no
  section: behavior
- id: attempt_count
  text: Общее количество истинных попыток
  scored: false
  input: number
  section: behavior
  show_if:
    match: any
    conditions:
    - item: attempt
      equals: 1
- id: nssi
  text: Отмечалось ли у пациента несуицидальное самоповреждающее поведение?
  answers: yes_no
  section: behavior
  scored: false
- id: interrupted
  text: Прерванная попытка самоубийства. Случалось ли, что когда Вы начинали совершать какие-либо действия с целью покончить
    с собой, кто-то или что-то останавливал(о) Вас прежде, чем Вы фактически совершали что-либо?
  answers: yes_no
  section: behavior
- id: aborted
  text: Остановленная попытка самоубийства. Случалось ли, что когда Вы начинали совершать какие-либо действия с целью покончить
    с собой, Вы останавливали себя прежде, чем Вы фактически совершали что-либо?
  answers: yes_no
  section: behavior
- id: preparatory
  text: Подготовительные действия или поведение. Предпринимали ли Вы какие-либо шаги с целью осуществить попытку самоубийства
    или приготовиться к самоубийству (например, приобретали таблетки, оружие, раздавали ценные вещи или писали предсмертную
    записку)?
  answers: yes_no
  section: behavior
- id: behavior
  text: Суицидальное поведение было выявлено во время периода наблюдения
  answers: yes_no
  section: behavior
- id: actual_lethality
  text: Реальная опасность /ущерб здоровью (только для истинных попыток)
  scored: false
  section: lethality
  show_if:
    match: any
    conditions:
    - item: attempt
      equals: 1
  options:
  - value: 0
    label: Физических повреждений нет, или они весьма незначительны (например, неглубокие царапины)
  - value: 1
    label: Незначительные физические повреждения (например, вялая речь, ожоги первой степени, легкое кровотечение, растяжения)
  - value: 2
    label: Физические повреждения умеренной тяжести; требуется медицинская помощь
  - value: 3
    label: Физические повреждения средней тяжести; требуется госпитализация и, вероятно, интенсивная терапия
  - value: 4
    label: Тяжелые физические повреждения; требуется госпитализация и интенсивная терапия
  - value: 5
    label: Смерть
- id: potential_lethality
  text: Потенциальная опасность (отвечать, только если реальная опасность = 0)
  scored: false
  section: lethality
  show_if:
    match: any
    conditions:
    - item: actual_lethality
      equals: 0
  options:
  - value: 0
    label: Поведение, которое вряд ли приведет к травмам
  - value: 1
    label: Поведение, которое, вероятно, приведет к травмам, но вряд ли повлечет за собой смерть
  - value: 2
    label: Поведение, которое, вероятно, приведет к смерти, несмотря на возможность оказания медицинской помощи
scoring:
  method: rule
  cases:
  - match: any
    conditions:
    - item: 5
      min_value: 1
    - item: attempt
      min_value: 1
    - item: interrupted
      min_value: 1
    - item: aborted
      min_value: 1
    - item: preparatory
      min_value: 1
    - item: behavior
      min_value: 1
    band:
      code: extreme
      level: 4
      label: 'Крайне высокий риск: ургентные мероприятия и госпитализация'
  - match: any
    conditions:
    - item: 3
      min_value: 1
    - item: 4
      min_value: 1
    band:
      code: serious
      level: 3
      label: Серьёзный риск суицида
  default:
    code: below
    level: 0
    label: Ниже порогов ключа (идеи типа 3 и 5)
critical:
- item: 4
  min_value: 1
  note: Суицидальные идеи с намерением действовать
- item: 5
  min_value: 1
  note: Суицидальные идеи с конкретным планом и намерением
- item: interrupted
  min_value: 1
  note: Прерванная суицидальная попытка
- item: aborted
  min_value: 1
  note: Самостоятельно остановленная суицидальная попытка
- item: behavior
  min_value: 1
  note: Суицидальное поведение
- item: 3
  min_value: 1
  note: Суицидальные идеи с мыслями о способе или выше
- item: attempt
  min_value: 1
  note: 'Суицидальное поведение: истинная попытка'
- item: preparatory
  min_value: 1
  note: 'Суицидальное поведение: подготовительные действия'
- kind: band
  band_codes:
  - serious
  - extreme
  note: Серьёзный или крайне высокий суицидальный риск (C-SSRS ≥ 3 или суицидальное поведение)
