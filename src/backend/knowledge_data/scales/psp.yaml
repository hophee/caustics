# PSP — КР F20, приложение Г4. Врач; затруднения за последние 7 дней в 4 областях.
# Области a–d оцениваются по 6 степеням (для a–c и для d — разные критерии), затем врач
# выбирает 10-балльный интервал по таблице КР (100–91 … 10–1) и итоговый балл внутри него.
# Таблица интервалов в КР приведена дважды; суицидальное поведение шкалой не учитывается.
code: PSP
version: 1
name: "PSP · шкала личностного и социального функционирования"
measures: social_functioning
direction: higher_is_better
diagnoses: [F20]
filled_by: clinician
source: "КР F20, приложение Г4, стр. PDF 181–190"

items:
  - id: "a"
    text: "Социально полезная деятельность, включая работу и учебу"
    scored: false
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Слабо выражено: об этом известно только очень близким людям"}
      - {value: 2, label: "Заметно выражено: затруднения очевидны любому человеку из окружения больного, но не оказывают существенного негативного влияния на способность больного выполнять свои функции в этой области"}
      - {value: 3, label: "Значительно выражено: затруднения сильно препятствуют выполнению функций в данной области; тем не менее, больной все еще способен функционировать без профессиональной или социальной помощи"}
      - {value: 4, label: "Сильно выражено: имеющиеся затруднения делают невозможным функционирование в этой области без профессиональной помощи, или ведут к деструктивному поведению, но тем не менее, опасность для жизни отсутствует"}
      - {value: 5, label: "Очень сильно выражено: нарушения и затруднения настолько выражены, что жизнь больного находится в опасности"}
  - id: "b"
    text: "Отношения с близкими и прочие социальные отношения"
    scored: false
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Слабо выражено: об этом известно только очень близким людям"}
      - {value: 2, label: "Заметно выражено: затруднения очевидны любому человеку из окружения больного, но не оказывают существенного негативного влияния на способность больного выполнять свои функции в этой области"}
      - {value: 3, label: "Значительно выражено: затруднения сильно препятствуют выполнению функций в данной области; тем не менее, больной все еще способен функционировать без профессиональной или социальной помощи"}
      - {value: 4, label: "Сильно выражено: имеющиеся затруднения делают невозможным функционирование в этой области без профессиональной помощи, или ведут к деструктивному поведению, но тем не менее, опасность для жизни отсутствует"}
      - {value: 5, label: "Очень сильно выражено: нарушения и затруднения настолько выражены, что жизнь больного находится в опасности"}
  - id: "c"
    text: "Самообслуживание"
    scored: false
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Слабо выражено: об этом известно только очень близким людям"}
      - {value: 2, label: "Заметно выражено: затруднения очевидны любому человеку из окружения больного, но не оказывают существенного негативного влияния на способность больного выполнять свои функции в этой области"}
      - {value: 3, label: "Значительно выражено: затруднения сильно препятствуют выполнению функций в данной области; тем не менее, больной все еще способен функционировать без профессиональной или социальной помощи"}
      - {value: 4, label: "Сильно выражено: имеющиеся затруднения делают невозможным функционирование в этой области без профессиональной помощи, или ведут к деструктивному поведению, но тем не менее, опасность для жизни отсутствует"}
      - {value: 5, label: "Очень сильно выражено: нарушения и затруднения настолько выражены, что жизнь больного находится в опасности"}
  - id: "d"
    text: "Беспокоящее и агрессивное поведение"
    scored: false
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Слабо выражено: держится грубовато, замкнуто или постоянно жалуется"}
      - {value: 2, label: "Заметно выражено: например, говорит слишком громко или разговаривает с другими слишком фамильярно или принимает пищу социально неприемлемым образом"}
      - {value: 3, label: "Значительно выражено: публично оскорбляет других, ломает или портит вещи, поведение часто социально неприемлемо, но не опасно"}
      - {value: 4, label: "Сильно выражено: частые вербальные угрозы или частое физическое насилие, без намерения или возможности нанести серьезный физический ущерб"}
      - {value: 5, label: "Очень сильно выражено: частые агрессивные поступки с целью нанести серьезный физический ущерб, или поступки, которые с большой вероятностью могут привести к серьезному физическому ущербу"}
  - {id: "score", text: "Заключительный балл PSP (1–100): выберите 10-балльный интервал по областям a–d, затем балл внутри интервала", input: number, min: 1, max: 100}

scoring:
  method: single_item
  item: score
  bands:
    - {lower: 1,  upper: 30,  code: severe,   level: 3, label: "Крайне выраженное ухудшение функционирования: нужна активная поддержка или надзор"}
    - {lower: 31, upper: 70,  code: marked,   level: 2, label: "Значительные нарушения социального функционирования (разные степени)"}
    - {lower: 71, upper: 100, code: mild,     level: 0, label: "Небольшие нарушения социального функционирования"}
