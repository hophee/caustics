# BNSS — КР F20, приложение Г2. Клиницист, полуструктурированное интервью.
# Ключ КР: 13 пунктов по 0–6, сумма 0–78. В PDF градации части пунктов пронумерованы 1–7
# (у п. 5 — 1, 2, 3, 3, 4, 5, 6); баллы приведены к 0–6 по порядку градаций, как требует ключ КР.
# Пороговых значений в КР нет.
code: BNSS
version: 1
name: BNSS · краткая шкала оценки негативных симптомов
measures: negative_symptoms
direction: higher_is_worse
diagnoses:
- F20
filled_by: clinician
source: КР F20, приложение Г2, стр. PDF 163–176
licence_note: ©2014 G. Strauss, B. Kirkpatrick (BNSS Workbook ru V2.1); confirm rights before production use.
items:
- id: 1
  text: ИНТЕНСИВНОСТЬ ПОЛУЧАЕМОГО УДОВОЛЬСТВИЯ В ПРОЦЕССЕ ДЕЯТЕЛЬНОСТИ
  options:
  - value: 0
    label: 'Норма: пациент способен получать удовольствие в полной мере, осуществляя различные виды деятельности; полностью
      в пределах нормы.'
  - value: 1
    label: 'Сомнительная степень: получает удовольствие в процессе деятельности, но в меньшей степени по сравнению со многими
      другими людьми, однако в пределах нормы.'
  - value: 2
    label: 'Легкая степень: небольшая потеря интенсивности получаемого удовольствия в процессе деятельности.'
  - value: 3
    label: 'Умеренная степень: небольшая потеря интенсивности получаемого удовольствия при осуществлении большинства видов
      деятельности или умеренная степень потери интенсивности получаемого удовольствия при осуществлении некоторых видов деятельности.'
  - value: 4
    label: 'Выраженная степень: по крайней мере, умеренная степень потери интенсивности получаемого удовольствия при осуществлении
      большинства видов деятельности; возможна глубокая потеря интенсивности в одном виде деятельности.'
  - value: 5
    label: 'Тяжелая степень: глубокая потеря интенсивности получаемого удовольствия при осуществлении большинства видов деятельности;
      сохраняется некоторая способность испытывать удовольствие; возможно получение только умеренного удовольствия даже в
      том случае, когда степень испытываемого удовольствия должна быть высокой.'
  - value: 6
    label: 'Крайне тяжелая степень: отсутствие получаемого удовольствия при любых обстоятельствах.'
- id: 2
  text: ЧАСТОТА ДЕЯТЕЛЬНОСТИ, ПРИНОСЯЩЕЙ ПАЦИЕНТУ УДОВОЛЬСТВИЕ
  options:
  - value: 0
    label: 'Норма: пациент часто участвует в деятельности, приносящей удовольствие; отсутствие нарушений в частоте получаемого
      удовольствия.'
  - value: 1
    label: 'Сомнительная степень: пациент участвует в деятельности, приносящей удовольствие, реже, чем многие люди, однако
      показатель может быть в пределах нормы.'
  - value: 2
    label: 'Легкая степень: небольшое снижение частоты деятельности, приносящей удовольствие, выходящая за пределы нормы.'
  - value: 3
    label: 'Умеренная степень: небольшая потеря частоты получаемого удовольствия при осуществлении большинства видов деятельности
      или умеренная степень потери частоты получаемого удовольствия при осуществлении некоторых видов деятельности.'
  - value: 4
    label: 'Выраженная степень: по крайней мере, умеренная степень потери частоты получаемого удовольствия при осуществлении
      большинства видов деятельности; возможна глубокая потеря интенсивности в одном виде деятельности.'
  - value: 5
    label: 'Тяжелая степень: глубокая потеря частоты получаемого удовольствия при осуществлении большинства видов деятельности;
      сохраняется некоторая способность испытывать удовольствие, но это происходит редко даже в тех случаях, когда степень
      испытываемого удовольствия должна быть высокой.'
  - value: 6
    label: 'Крайняя тяжелая степень: отсутствие получаемого удовольствия на протяжении всей предыдущей недели.'
- id: 3
  text: ИНТЕНСИВНОСТЬ ОЖИДАЕМОГО УДОВОЛЬСТВИЯ В ПРОЦЕССЕ ДЕЯТЕЛЬНОСТИ В БУДУЩЕМ Вопросы для пациента.
  hint: 'Если пациент испытывал удовольствие от некоторых видов деятельности на прошлой неделе: Вы сказали, что получили удовольствие
    (от) (выше перечислите виды деятельности). Вы собираетесь снова этим заняться в ближайшее время? Если да: Как Вы думаете,
    что Вы будете чувствовать, когда будете этим заниматься? Вы ждете этого с радостью? Если нет: Вы хотите это еще раз сделать?
    Есть ли что-нибудь еще, что бы Вы делали с удовольствием? (Если да: Как Вы думаете, что Вы будете чувствовать, когда будете
    этим заниматься?) Если пациент не испытал удовольствия от каких-либо видов деятельности на прошлой неделе: Есть ли какие-то
    виды деятельности, которых Вы ждете с радостью? Есть ли что-нибудь еще, чего Вы ждете с радостью? НЕДОСТАТОЧНОСТЬ НОРМАЛЬНОГО
    ПЕРЕЖИВАНИЯ ДИСТРЕССА'
  options:
  - value: 0
    label: 'Норма: пациент способен получать удовольствие, думая об осуществлении различных видов деятельности в будущем;
      полностью в пределах нормы.'
  - value: 1
    label: 'Сомнительная степень: получает удовольствие, думая об осуществлении различных видов деятельности в будущем, но
      в меньшей степени по сравнению со многими другими людьми, однако в пределах нормы.'
  - value: 2
    label: 'Легкая степень: получает удовольствие, думая об осуществлении различных видов деятельности в будущем, но в несколько
      меньшей степени, чем предусмотрено нормой.'
  - value: 3
    label: 'Умеренная степень: получает удовольствие, думая об осуществлении различных видов деятельности в будущем, но в
      гораздо меньшей степени, чем предусмотрено нормой, однако в какой-то степени испытывает удовольствие.'
  - value: 4
    label: 'Выраженная степень: может испытывать значительное удовольствие, думая об осуществлении некоторых видов деятельности
      в будущем, но, как правило, этого не происходит.'
  - value: 5
    label: 'Тяжелая степень: редко получает удовольствие, думая об осуществлении различных видов деятельности в будущем, даже
      в том случае, когда речь идет о виде деятельности, обычно доставляющем большое удовольствие.'
  - value: 6
    label: 'Крайне тяжелая степень: не получает удовольствия, думая об осуществлении различных видов деятельности в будущем,
      независимо от того, о каком виде деятельности идет речь.'
- id: 4
  text: 'НЕДОСТАТОЧНОСТЬ НОРМАЛЬНОГО ПЕРЕЖИВАНИЯ ДИСТРЕССА Вопросы для пациента Что-то заставляло Вас переживать неприятные
    эмоции на прошлой неделе? Произошло ли что-нибудь, что Вам не понравилось? Случилось ли что-нибудь, что Вас заставило
    грустить, привело в подавленное/депрессивное состояние? Обеспокоило или встревожило? Рассердило или вызвало раздражение?
    Если ничего неприятного не случилось: Что из произошедших в прошлом событий вызвало у Вас неприятные ощущения? И как Вы
    их сейчас воспринимаете?'
  hint: ПОДШКАЛА ОЦЕНКИ СОЦИАЛЬНОЙ ОТГОРОЖЕННОСТИ
  options:
  - value: 0
    label: 'Норма: предусмотренная нормой способность испытывать дистресс или неприятные эмоции.'
  - value: 1
    label: 'Сомнительная степень: пациент испытывает дистресс по причине неприятных событий, но в меньшей степени по сравнению
      со многими другими людьми, однако в пределах нормы.'
  - value: 2
    label: 'Легкая степень: испытывает дистресс по причине неприятных событий, но в немного меньшей степени, чем предусмотрено
      нормой.'
  - value: 3
    label: 'Умеренная степень: определенно гораздо меньше расстроен по причине неприятных событий, чем предусмотрено нормой,
      однако в какой-то степени испытывает дистресс.'
  - value: 4
    label: 'Выраженная степень: может испытывать значительный дистресс, но, как правило, причиной тому должна послужить серьезная
      проблема.'
  - value: 5
    label: 'Тяжелая степень: испытывает только умеренный дистресс, даже если существует серьезная проблема.'
  - value: 6
    label: 'Крайне тяжелая степень: не испытывает дистресс независимо от того, с какой проблемой сталкивается.'
- id: 5
  text: 'СОЦИАЛЬНАЯ ОТГОРОЖЕННОСТЬ: ФОРМЫ/МОДЕЛИ/СТЕРЕОТИПЫ ПОВЕДЕНИЯ Вопросы для пациента (Задаются о тех людях, о которых
    шла речь в пунктах 1-3.) Когда вы вместе проводили время, Вы с ними связывались или они с Вами/кто был инициатором контакта
    - Вы или они? Насколько часто Вы говорили с ними о личных, сокровенных вещах? Вы пытались контактировать с кем-нибудь
    еще?'
  options:
  - value: 0
    label: 'Отсутствие нарушении: пациент часто взаимодействует с другими людьми, открыто обсуждает вопросы личного характера
      с одним человеком или с несколькими людьми; вполне в пределах нормы.'
  - value: 1
    label: 'Минимальная степень дефицита: складываются близкие отношения с одним человеком, в рамках которых может обсуждаться
      большинство вопросов личного характера; активно взаимодействует с другими людьми; обсуждает некоторые вопросы личного
      характера с другими людьми.'
  - value: 2
    label: 'Легкая степень дефицита: социальные контакты - нередкие, но пациент/ка не так активен/а, как большинство людей;
      обсуждаются лишь некоторые вопросы личного характера; складывающиеся отношения - неблизкие и неглубокие.'
  - value: 3
    label: 'Умеренная степень дефицита: не имеет близких, глубоких отношений с другими людьми, отношения и общение на мероприятиях
      - поверхностные, неглубокие, но, как правило, не избегает других людей.'
  - value: 4
    label: 'Выраженная степень дефицита: контакты и общение с другими людьми чаще редкие и поверхностные; склонен/на избегать
      других людей. Как правило, не обсуждает вопросы личного характера с другими людьми.'
  - value: 5
    label: 'Значительно выраженная степень дефицита: взаимодействие с другими людьми - практически всегда поверхностное, по
      собственному желанию проводит мало времени с другими людьми.'
  - value: 6
    label: 'Тяжелая степень дефицита: редко контактирует с другими людьми, может активно избегать других людей большую часть
      времени.'
- id: 6
  text: 'СОЦИАЛЬНАЯ ОТГОРОЖЕННОСТЬ: ВНУТРЕННИЕ ПЕРЕЖИВАНИЯ Вопросы для пациента'
  hint: 'Если пациент социально активен: Кому-то нравится быть наедине с собой, а кому-то - в окружении других людей. Что
    Вы предпочитаете? Чувствуете ли Вы, что люди, о которых речь шла выше, Вам близки? Вы много думаете о людях, о которых
    речь шла выше? Вы бы хотели, чтобы у Вас были более близкие отношения? Вы иногда чувствуете себя одиноким? Если пациент
    социально не активен: Вы хотели бы больше общаться с людьми? Вы много об этом думаете? Как Вы относитесь к тому, что Вы
    находитесь в одиночестве большую часть времени? Эти отношения важны для вас? ПОДШКАЛА ОЦЕНКИ ВОЛЕВЫХ НАРУШЕНИЙ'
  options:
  - value: 0
    label: 'Отсутствие нарушений: пациент очень заинтересован в отношениях, рассматривает отношения с другими людьми как одну
      из самых важных частей своей жизни; если оказывается в условиях изоляции, часто испытывает чувство одиночества, думает,
      что было бы хорошо, если бы он/а был/а не один (не одна).'
  - value: 1
    label: 'Минимальная степень дефицита: пациент считает, что отношения важны; интересуется другими людьми; если оказывается
      в условиях изоляции, иногда испытывает чувство одиночества и думает, что было бы хорошо, если бы он/а был/а не один
      (не одна).'
  - value: 2
    label: 'Умеренная степень нарушении: пациент считает, что близкие отношения с членом/ами семьи в какой-то мере важны,
      в средней степени интересуется другими людьми; нет близких и глубоких отношений с другими людьми; иногда думает об отношениях.'
  - value: 3
    label: 'Умеренная степень дефицита: пациент считает, что близкие отношения маловажны; нечасто возникает желание быть ближе
      с другими людьми.'
  - value: 4
    label: 'Выраженная степень дефицита: когда дело доходит до установления близких отношений с другими людьми, ему/ей может
      быть все равно, вступать или не вступать в отношения. Как правило, не желает обсуждать вопросы личного характера с другими
      людьми, редко испытывает недостаток в близких отношениях или желал бы быть в более близких отношениях.'
  - value: 5
    label: 'Значительно выраженная степень дефицита: пациент считает, что отношения едва ли имеют какое-то значение; проявляет
      крайне низкий интерес к близким отношениям с другими людьми, не чувствует себя одиноким.'
  - value: 6
    label: 'Тяжелая степень дефицита: пациента не интересуют отношения с другими людьми, не нуждается в каких-либо близких
      отношениях, категорически предпочитает оставаться в одиночестве.'
- id: 7
  text: 'ВОЛЕВЫЕ НАРУШЕНИЯ: ФОРМЫ/МОДЕЛИ/СТЕРЕОТИПЫ ПОВЕДЕНИЯ Вопросы для пациента Общие вопросы: Расскажите мне, как Вы проводите
    свое время. Много ли Вы времени проводите просто сидя, ничего не делая?'
  hint: 'Работа и учеба: Если в настоящее время работает или учится: Сколько времени Вы провели на работе (или в учебном заведении,
    или посвятили учебе) на этой неделе? Вы самостоятельно туда добираетесь? Вы ждете, пока Вам другие скажут, что делать,
    или Вы приступаете к работе (или учебе) самостоятельно? (Если проходит курс лечения, и такой вопрос уместен). Вы участвовали
    в видах групповой деятельности в процессе курса лечения? Если да: Кто-то предложил Вам это сделать, или Вы это делали
    сами? Если в настоящее время не работает или не учится: Вы пытались найти работу или выбрать место обучения на прошедшей
    неделе? Вам кто-нибудь это предложил, или Вы делали это самостоятельно? Какие у Вас цели? Если да: Что именно Вы сделали?
    Если нет: Почему нет? (Попросите, чтобы пациент уточнил в своем ответе, идет ли речь о возможности или о мотивации). Отдых
    и развлечения/хобби/времяпрепровождение: (Необходимо учесть информацию об активном отдыхе и времяпрепровождении в пунктах
    1-3). Вы проводите много времени у телевизора? (Если на последний вопрос ответ «да»). Вас интересует то, что Вы смотрите,
    или Вы просто проводите время? Уход за собой: Как часто Вы принимали душ/ ванну на прошлой неделе? Как часто Вы убирали
    свою квартиру/комнату/дом? Приходилось ли кому-нибудь напоминать Вам это сделать? Напоминал ли Вам кто-то еще это делать?
    (Если это уместно в данном случае). Была ли у Вас необходимость искать жилье? Что Вы для этого делали?'
  options:
  - value: 0
    label: 'Отсутствие дефицита: пациент начинает и продолжает вести работу или учебу, отдых и развлечения/хобби/времяпрепровождение
      и уход за собой; вполне в пределах нормы.'
  - value: 1
    label: 'Минимальная степень дефицита: пациент несколько менее последователен в начинании и продолжении видов деятельности
      по сравнению со многими другими людьми, но клиническая значимость сомнительная.'
  - value: 2
    label: 'Легкая степень дефицита: умеренные нарушения при начинании и продолжении видов деятельности; например, пациент
      мог надлежащим образом приступить к деятельности на прошлой неделе, но продолжает со средней степенью настойчивости;
      или инициатива исходила от других людей так же часто, как и от пациента.'
  - value: 3
    label: 'Умеренная степень дефицита: ощутимые нарушения в процессе начинания или продолжения видов деятельности; может
      не приступать к различным видам деятельности достаточно часто или не продолжать начатые действия в течение очень длительного
      времени; часто другие люди могут создать побудительный мотив для любых видов деятельности.'
  - value: 4
    label: 'Выраженная степень дефицита: значительные нарушения в отношении начинания; может приступить к нескольким видам
      деятельности, но не продолжать ее в течение очень длительного времени. Как правило, другие люди создают побудительный
      мотив для любых видов деятельности.'
  - value: 5
    label: 'Значительно выраженная степень дефицита: очевидное серьезное снижение начинания и продолжения деятельности; в
      некоторых случаях может приступать к деятельности, но почти не продолжает. Практически всегда другие люди создают побудительный
      мотив для различных видов деятельности пациента.'
  - value: 6
    label: 'Тяжелая степень дефицита: практически полное отсутствие начинания видов деятельности.'
- id: 8
  text: 'ВОЛЕВЫЕ НАРУШЕНИЯ: ВНУТРЕННИЕ ПЕРЕЖИВАНИЯ Вопросы для пациента Работа и учеба:'
  hint: 'Если в настоящее время работает или учится: Ваша работа (или учеба) важна для Вас? Вы много о ней думаете? Чувствуете
    ли вы себя заинтересованным в работе (учебе)/мотивированным для нее? Если не работает или не учится: Вы думаете о том,
    чтобы найти работу или поступить учиться? Вам не хватает работы (или учебы)? Если да: Что Вы сделали? Если нет: Почему
    нет? (Попросите, чтобы пациент уточнил в своем ответе, идет ли речь о возможности или о мотивации). Отдых и развлечения/хобби/времяпрепровождение:
    Что Вы делаете в свободное время? Какие у Вас хобби? Вы думали о них на этой неделе? Уход за собой: Вы чувствовали мотивацию
    к тому, чтобы ухаживать за собой на этой неделе? (Поясните, если необходимо: мотивацию для того, чтобы помыться, убрать
    у себя дома, позаботиться о своем здоровье и т. д.) Если да: Почему Вам хотелось это делать? V. ПОДШКАЛА ОЦЕНКИ ПРИТУПЛЕННОГО
    АФФЕКТА Выражение лица При оценке выражения лица необходимо учитывать мимические движения всех частей лица, включая область
    глаз (например, поднятые брови), рта (улыбки и гримасы) и средней части лица (например, наморщенный нос, когда пациент
    испытывает отвращение).'
  options:
  - value: 0
    label: 'Отсутствие нарушений: пациент обладает высокой мотивацией, его интересуют учеба и работа, отдых и развлечения,
      уход за собой; часто об этом думает и говорит, что эти вещи ему/ей не безразличны. Полностью соответствует норме в этой
      сфере.'
  - value: 1
    label: 'Минимальная степень дефицита: в несколько меньшей мере обладает мотивацией и интересуется такими вещами по сравнению
      со многими другими людьми, но клиническая значимость - сомнительная.'
  - value: 2
    label: 'Умеренная степень нарушений: как правило, пациент мотивирован в этих видах деятельности, но в некоторых случаях
      не проявляет достаточный интерес или не обладает достаточной мотивацией; думает об этом и говорит, что вещи ему/ей не
      безразличны, но в несколько меньшей степени, чем предусмотрено нормой.'
  - value: 3
    label: 'Умеренная степень дефицита: пациент в какой-то мере мотивирован в этих видах деятельности, но в то же время очевидны
      некоторые нарушения в мотивации и проявлении интереса; может иметь работу, но быть не заинтересованным в достижении
      более высоких результатов, или мало думает об отношениях или времяпрепровождении.'
  - value: 4
    label: 'Выраженная степень дефицита: пациент обладает лишь слабой мотивацией в этих видах деятельности; только в некоторых
      случаях думает об этом.'
  - value: 5
    label: 'Значительно выраженная степень дефицита: очевидный недостаток интереса или мотивации в этих видах деятельности;
      очень редко думает об этих вещах и почти безразличен к ним.'
  - value: 6
    label: 'Тяжелая степень дефицита: по сути, отсутствие интереса к этим видам деятельности; не думает и совершенно безразличен
      к этому.'
- id: 9
  text: ВЫРАЖЕНИЕ ЛИЦА
  options:
  - value: 0
    label: 'Отсутствие нарушений: вполне в пределах нормы; пациент оживленно рассказывает о своих эмоциональных переживаниях,
      при этом соответствующим образом многократно меняется выражение лица.'
  - value: 1
    label: 'Минимальная степень дефицита: очень незначительное снижение частоты изменений выражения лица и выразительности
      мимики в процессе рассказа о своих эмоциональных переживаниях, клиническая значимость - сомнительная.'
  - value: 2
    label: 'Умеренная степень нарушении: умеренное снижение частоты изменений выражения лица и выразительности мимики; выражение
      лица меняется, по крайней мере, два раза в процессе рассказа о каждом эмоциональном переживании.'
  - value: 3
    label: 'Умеренная степень дефицита: заметное снижение частоты изменений выражения лица и выразительности мимики, например,
      выражение лица меняется только один раз при ответе на каждый вопрос.'
  - value: 4
    label: 'Выраженная степень дефицита: значительное снижение частоты изменений выражений лица и выразительности мимики в
      процессе рассказа об эмоциональных переживаниях, когда выражение лица меняется при ответе только на какой-то один или
      два вопроса; за все время беседы выражение лица может измениться лишь три-четыре раза.'
  - value: 5
    label: 'Значительно выраженная степень дефицита: явное глубокое снижение мимики, отражающей как положительные, так и отрицательные
      эмоции, при ответе на все вопросы; за все время беседы выражение лица может слегка измениться лишь один-два раза.'
  - value: 6
    label: 'Тяжелая степень дефицита: полное или почти полное отсутствие смены выражений лица за все время беседы.'
- id: 10
  text: ЭМОЦИОНАЛЬНАЯ ВЫРАЗИТЕЛЬНОСТЬ РЕЧИ (выразительность звучания)
  options:
  - value: 0
    label: 'Отсутствие нарушений: предусмотренное нормой варьирование по всем трем параметрам: скорость, громкость и высота
      голоса в процессе речи.'
  - value: 1
    label: 'Минимальная степень дефицита: легкое снижение по одному из трех параметров.'
  - value: 2
    label: 'Умеренная степень нарушений: умеренное снижение по двум параметрам или снижение в средней степени по одному параметру.'
  - value: 3
    label: 'Умеренная степень дефицита: снижение в средней степени по одному параметру.'
  - value: 4
    label: 'Выраженная степень дефицита: снижение в средней степени по двум или более параметрам, или глубокое снижение по
      одному параметру.'
  - value: 5
    label: 'Значительно выраженная степень дефицита: глубокое снижение, по крайней мере, по одному параметру и снижение в
      средней степени, по крайней мере, по еще одному параметру.'
  - value: 6
    label: 'Тяжелая степень дефицита: глубокое снижение по двум или более параметрам (скорость, громкость и высота голоса
      в процессе речи).'
- id: 11
  text: ЭКСПРЕССИВНАЯ ЖЕСТИКУЛЯЦИЯ
  hint: ПОДШКАЛА ОЦЕНКИ АЛОГИИ
  options:
  - value: 0
    label: 'Отсутствие нарушений: жестикуляция вполне в пределах нормы; пациент используеть большое количество жестов с помощью
      рук, кистей, плеч, головы и/или тела в процессе рассказа об эмоциональных переживаниях.'
  - value: 1
    label: 'Минимальная степень дефицита: очень легкое снижение частоты использования экспрессивной жестикуляции; сомнительная
      клиническая значимость; наблюдается легкое снижение использования рук, кистей, головы или тела.'
  - value: 2
    label: 'Умеренная степень нарушений: умеренное снижение частоты использования экспрессивной жестикуляции; использует,
      по крайней мере, два экспрессивных жеста в процессе рассказа о каждом эмоциональном переживании.'
  - value: 3
    label: 'Умеренная степень дефицита: ощутимое снижение частоты использования экспрессивной жестикуляции; может использовать
      один едва заметный жест при ответе на каждый вопрос.'
  - value: 4
    label: 'Выраженная степень дефицита: значительные нарушения при использовании экспрессивной жестикуляции, когда используется
      один жест при ответе только на какой- то один или два вопроса; может использовать лишь три или четыре жеста за все время
      беседы.'
  - value: 5
    label: 'Значительно выраженная степень дефицита: явные нарушения при использовании экспрессивной жестикуляции. Сокращение
      количества используемых жестов наблюдается при ответе на все вопросы; может использовать только один или два едва заметных
      жеста за все время беседы.'
  - value: 6
    label: 'Тяжелая степень дефицита: почти полное отсутствие использования экспрессивной жестикуляции; практически отсутствуют
      движения руками, кистями, головой или телом в процессе рассказа обо всех эмоциональных переживаниях.'
- id: 12
  text: КОЛИЧЕСТВО РЕЧИ
  options:
  - value: 0
    label: 'Отсутствие нарушении: предусмотренное нормой количество речи или пациент говорит очень много.'
  - value: 1
    label: 'Минимальная степень дефицита: сомнительное снижение количества речи; ответы, чаще всего, лаконичны.'
  - value: 2
    label: 'Умеренная степень нарушений: ответы, как правило, краткие.'
  - value: 3
    label: 'Умеренная степень дефицита: многие ответы состоят из одного или двух слов.'
  - value: 4
    label: 'Выраженная степень дефицита: по крайней мере, половина ответов состоит из одного или двух слов.'
  - value: 5
    label: 'Значительно выраженная степень дефицита: большинство ответов состоит из одного или двух слов.'
  - value: 6
    label: 'Тяжелая степень дефицита: все или почти все ответы состоят из одного или двух слов.'
- id: 13
  text: СПОНТАННОСТЬ ИЗЛОЖЕНИЯ ДОПОЛНИТЕЛЬНОЙ ИНФОРМАЦИИ
  options:
  - value: 0
    label: 'Отсутствие нарушений: пациент, как правило, предоставляет больше информации, чем необходимо, для ответа на вопрос;
      эта информация может быть или не быть уместной; пациент может быть даже излишне разговорчивым или может иметь место
      речевой напор.'
  - value: 1
    label: 'Минимальная степень дефицита: пациент часто предоставляет больше информации, чем необходимо, для ответа на вопрос,
      хотя иногда большее количество информации могло бы быть уместным.'
  - value: 2
    label: 'Умеренная степень нарушений: пациент несколько раз предоставляет дополнительную информацию, но ответы, как правило,
      ограничиваются требуемой информацией.'
  - value: 3
    label: 'Умеренная степень дефицита: пациент в некоторых случаях предоставляет дополнительную информацию; интервьюер в
      некоторых случаях может попросить добавить детали/рассказать более подробно.'
  - value: 4
    label: 'Выраженная степень дефицита: пациент редко предоставляет больше информации, чем необходимо, для ответа на вопрос.
      Интервьюер несколько раз может попросить рассказать более подробно.'
  - value: 5
    label: 'Значительно выраженная степень дефицита: практически все ответы содержат лишь необходимую информации или меньше
      информации, чем необходимо; интервьюер может неоднократно попросить добавить информацию.'
  - value: 6
    label: 'Тяжелая степень дефицита: отсутствие спонтанной речи на любом этапе интервью.'
