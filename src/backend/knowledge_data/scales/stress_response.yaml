scoring:
  method: sum
  bands:
    - {lower: 38,  upper: 75,  code: minimal, level: 0, label: "Вероятность заболеть из-за стресса минимальна", provisional: true}
    - {lower: 76,  upper: 100, code: low,     level: 1, label: "Небольшая вероятность заболеть из-за стресса"}
    - {lower: 101, upper: 150, code: high,    level: 2, label: "Высокая вероятность заболевания из-за стресса"}
    - {lower: 151, upper: 190, code: affected, level: 3, label: "Высока вероятность того, что стресс уже сказался на здоровье"}
