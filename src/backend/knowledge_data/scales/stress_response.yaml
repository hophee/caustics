# КР F43.1, приложение Г7. Категория 0 (вне классификации): по КР — пациент. 38 пунктов, 1–5.
# Ключ КР начинается с 40 баллов, минимум суммы — 38: 38–39 отнесены к первой категории (provisional).
code: Stress-response
version: 1
name: "Шкала оценки выраженности психофизиологической реакции на стресс"
measures: stress_response
direction: higher_is_worse
diagnoses: [F43.1]
filled_by: patient
source: "КР F43.1, приложение Г7, стр. PDF 180–183"

answer_sets:
  freq5:
    - {value: 1, label: "Никогда"}
    - {value: 2, label: "Редко (чаще, чем один раз в полгода)"}
    - {value: 3, label: "Иногда (чаще, чем один раз в месяц)"}
    - {value: 4, label: "Часто (чаще, чем один раз в неделю)"}
    - {value: 5, label: "Постоянно"}

items:
  - {id: 1, text: "Затяжные головные боли", answers: freq5}
  - {id: 2, text: "Мигрени (сосудистые головные боли)", answers: freq5}
  - {id: 3, text: "Боли в желудке", answers: freq5}
  - {id: 4, text: "Повышение давления", answers: freq5}
  - {id: 5, text: "Холодные кисти рук", answers: freq5}
  - {id: 6, text: "Изжоги", answers: freq5}
  - {id: 7, text: "Поверхностное, частое дыхание", answers: freq5}
  - {id: 8, text: "Диарея", answers: freq5}
  - {id: 9, text: "Сильное сердцебиение", answers: freq5}
  - {id: 10, text: "Потение рук", answers: freq5}
  - {id: 11, text: "Тошнота", answers: freq5}
  - {id: 12, text: "Метеоризм (вздутие живота)", answers: freq5}
  - {id: 13, text: "Учащенное мочеиспускание", answers: freq5}
  - {id: 14, text: "Поетние ступней", answers: freq5}
  - {id: 15, text: "Маслянистая кода", answers: freq5}
  - {id: 16, text: "Усталость/истощение", answers: freq5}
  - {id: 17, text: "Энурез (ночное недержание мочи)", answers: freq5}
  - {id: 18, text: "Сухость во рту", answers: freq5}
  - {id: 19, text: "Тремор рук", answers: freq5}
