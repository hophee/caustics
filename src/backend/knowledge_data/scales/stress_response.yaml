  - {id: 21, text: "Боли в шее", answers: freq5}
  - {id: 22, text: "Жевательные движения челюстей", answers: freq5}
  - {id: 23, text: "Скрежетание зубами", answers: freq5}
  - {id: 24, text: "Запоры", answers: freq5}
  - {id: 25, text: "Ощущение тяжести в груди или в области сердца", answers: freq5}
  - {id: 26, text: "Головокружение", answers: freq5}
  - {id: 27, text: "Рвота", answers: freq5}
