  - {id: 6, text: "… иногда к ним обращаются незнакомые люди, называя их при этом другим именем и утверждая, что встречали их раньше.", answers: percent}
  - {id: 7, text: "… испытывают такое чувство, как будто бы они стоят рядом с собой или наблюдают себя со стороны как другого человека.", answers: percent}
