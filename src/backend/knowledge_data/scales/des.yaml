  - {id: 15, text: "… они испытывают чувство сомнения в том, действительно ли происходили какие-то события в их жизни или эти события только пригрезились им.", answers: percent}
  - {id: 16, text: "… находясь в знакомом и привычном для них месте, вдруг ощущают, что они здесь впервые и это место им незнакомо.", answers: percent}
  - {id: 17, text: "… их настолько поглощает содержание кинофильма или телепередачи, что они уже не замечают ничего, что происходит вокруг них.", answers: percent}
