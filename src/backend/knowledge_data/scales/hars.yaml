# HARS — КР F41.1, приложение Г1; также КР F40 (Г1) и F41.0 (Г4), текст совпадает.
# Клиническая рейтинговая шкала для специалистов, обследование 20–30 минут.
# По КР: первые 6 пунктов — психическая тревога, остальные 8 — соматическая.
code: HARS
version: 1
name: "HARS · шкала М. Гамильтона для оценки тревоги"
measures: anxiety
direction: higher_is_worse
diagnoses: [F40, F41.0, F41.1]
filled_by: clinician
source: "КР F41.1, приложение Г1, стр. PDF 80–85; также КР F40, приложение Г1; КР F41.0, приложение Г4"

items:
  - id: 1
    text: "Тревожное настроение (озабоченность, ожидание наихудшего, тревожные опасения, раздражительность)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 2
    text: "Напряжение (ощущение напряжения, вздрагивание, легко возникающая плаксивость, дрожь, чувство беспокойства, неспособность расслабиться)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 3
    text: "Страхи (боязнь темноты, незнакомых людей, животных, транспорта, толпы, страх оставаться одному)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 4
    text: "Инсомния (затрудненное засыпание, прерывистый сон, не приносящий отдыха сон с чувством разбитости и слабости при пробуждении, кошмарные сновидения)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 5
    text: "Интеллектуальные нарушения (затрудненная концентрация внимания, ухудшение памяти)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 6
    text: "Депрессивное настроение (утрата привычных интересов, утрата чувства удовольствия от хобби, подавленность, ранние пробуждения, суточные колебания состояния)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 7
    text: "Соматические симптомы (боли, мышечные подергивания, напряжение, миоклонические судороги, «скрипение» зубами, срывающийся голос, повышенный мышечный тонус)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 8
    text: "Соматические симптомы (сенсорные — звон в ушах, нечеткость зрения, приливы жара или холода, ощущение слабости, ощущение покалывания)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 9
    text: "Сердечно-сосудистые симптомы (тахикардия, сердцебиение, боль в груди, пульсация в сосудах, чувство слабости, частые вздохи, диспноэ)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 10
    text: "Респираторные симптомы (чувство давления или сжатия грудной клетки, ощущение удушья, частые вздохи, диспноэ)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 11
    text: "Гастроинтестиальные симптомы (затрудненное глотание, метеоризм, боль в животе, изжога, чувство переполнения желудка, тошнота, рвота, урчание в животе, диарея, снижение веса тела, запоры)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 12
    text: "Мочеполовые симптомы (учащенное мочеиспускание, сильные позывы на мочеиспускание, аменорея, меноррагия, фригидность, преждевременная эякуляция, утрата либидо, импотенция)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 13
    text: "Вегетативные симптомы (сухость во рту, покраснение кожных покровов, бледность кожных покровов, повышенное потоотделение, головные боли с чувством напряжения)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}
  - id: 14
    text: "Поведение при осмотре (ерзанье на месте, беспокойная жестикуляция или походка, тремор рук, нахмуривание бровей, напряженное выражение лица, вздохи или учащенное дыхание, бледность лица, частое сглатывание слюны и т.д.)."
    options:
      - {value: 0, label: "Отсутствует."}
      - {value: 1, label: "В слабой степени."}
      - {value: 2, label: "В умеренной степени."}
      - {value: 3, label: "В тяжелой степени."}
      - {value: 4, label: "В очень тяжелой степени."}

scoring:
  method: sum
  subscales:
    - {code: psychic, name: "Тревога в сфере психики", items: [1, 2, 3, 4, 5, 6]}
    - {code: somatic, name: "Соматическая тревога", items: [7, 8, 9, 10, 11, 12, 13, 14]}
  bands:
    - {lower: 0,  upper: 7,  code: none,     level: 0, label: "Отсутствие тревоги"}
    - {lower: 8,  upper: 17, code: mild,     level: 1, label: "Наличие симптомов тревожного расстройства"}
    - {lower: 18, upper: 24, code: moderate, level: 2, label: "Средняя выраженность тревожного расстройства"}
    - {lower: 25, upper: 56, code: severe,   level: 3, label: "Тяжёлая степень выраженности тревожного расстройства"}
