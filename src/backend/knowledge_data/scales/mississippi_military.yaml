# Миссисипская шкала ПТСР — КР F43.1, приложение Г5. Категория 0 (вне классификации): по КР — пациент, бланк.
# Ответы 1–5. Второй вариант ответа в инструкции КР назван «Иногда верно», в шапке бланка —
# «Иногда неверно»; взят вариант бланка. Ключ: обратные пункты пересчитываются (6 − ответ),
# итог — сумма. Пороговых значений в КР нет.
# Военный вариант: 35 пунктов.
code: Mississippi-military
version: 1
name: "Миссисипская шкала ПТСР · военный вариант"
measures: ptsd_severity
direction: higher_is_worse
diagnoses: [F43.1]
filled_by: patient
source: "КР F43.1, приложение Г5, стр. PDF 170–177"

answer_sets:
  truth5:
    - {value: 1, label: "Совершенно неверно"}
    - {value: 2, label: "Иногда неверно"}
    - {value: 3, label: "До некоторой степени верно"}
    - {value: 4, label: "Верно"}
    - {value: 5, label: "Совершенно верно"}

