# CDSS — КР F20, приложение Г3. Врач, интервью; период — последние 2 недели.
# Первый вопрос раздела задаётся как написан; пункт 9 — по наблюдению за всё интервью.
code: CDSS
version: 1
name: "CDSS · шкала депрессии Калгари у пациентов с шизофренией"
measures: depression
direction: higher_is_worse
diagnoses: [F20]
filled_by: clinician
source: "КР F20, приложение Г3, стр. PDF 176–181"

items:
  - id: 1
    text: "Депрессия Как бы Вы описали свое настроение за последние 2 недели: Были ли Вы достаточно бодры или находились в тяжелой депрессии или в плохом расположении духа в последнее время? За последние 2 недели, как часто Вы были (словами пациента) каждый день? Весь день?"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Легкая степень- Выражает некоторую грусть и упадок духа."}
      - {value: 2, label: "Средняя степень - Отчетливо депрессивное настроение до половины времени за последние 2 недели; присутствует ежедневно."}
      - {value: 3, label: "Тяжелая степень - Выраженное депрессивное настроение, присутствует ежедневно в течение более, чем половины времени, мешает нормальной физической и социальной активности."}
  - id: 2
    text: "Безнадежность Каким Вы видите свое будущее? Вы можете представить себе какое-либо будущее, или жизнь представляется Вам весьма безнадежной?"
    hint: "Вы сдались или все же Вам кажется, что есть основание пытаться что-то сделать?"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Легкая степень - За последнюю неделю безнадежность ощущалась время от времени, но все же есть некоторая надежда на будущее."}
      - {value: 2, label: "Средняя степень - Постоянное ощущение безнадежности средней степени выраженности в течение последней недели. Пациента можно убедить в том, что возможно дела пойдут лучше."}
      - {value: 3, label: "Тяжелая степень - Постоянное и причиняющее страдание ощущение безнадежности."}
  - id: 3
    text: "Самоуничижение Как вы оцениваете себя по сравнению с другими людьми? Вы считаете себя лучше или хуже, или таким(ой) же, как большинство других? Вы чувствуете себя неполноценным или даже никчемным человеком?"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Легкая степень - Пациент чувствует себя несколько неполноценным(ой), но не до такой степени, чтобы чувствовать себя никчемным(ой)."}
      - {value: 2, label: "Средняя степень - Пациент чувствует себя никчемным, но менее 50% времени."}
      - {value: 3, label: "Тяжелая степень - Пациент чувствует себя никчемным более 50% времени. Его/ее можно переубедить."}
  - id: 4
    text: "Идеи обвинения Есть ли у Вас чувство, что Вас упрекают за что-либо или даже, что Вы жертва ложного обвинения? В чем? (Не имеются в виду обоснованные упреки или обвинения, равно как и бредовые идеи виновности)"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Легкая степень - Пациент чувствует, что его/ее упрекают, но не обвиняют, менее, чем 50% времени."}
      - {value: 2, label: "Средняя степень - Постоянно чувствует, что его/ее упрекают и/или изредка чувствует, что его/ее обвиняют."}
      - {value: 3, label: "Тяжелая степень - Постоянно чувствует, что его/ее обвиняют. Если пациента убеждать, он/она признает, что это не так."}
  - id: 5
    text: "Патологическое чувство вины Имеется ли у вас склонность упрекать себя за мелкие проступки, возможно совершенные в прошлом?"
    hint: "Считаете ли Вы, что это достойный повод для беспокойства?"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Легкая степень - Пациент испытывает избыточное чувство вины по поводу некого мелкого проступка, но менее 50% времени."}
      - {value: 2, label: "Средняя степень - Пациент обычно (более 50% времени) испытывает чувство вины по поводу своих прошлых действий, значимость которых он/она преувеличивает."}
      - {value: 3, label: "Тяжелая степень - Пациент обычно упрекает себя за все, что было не так, даже если это не его/ее вина."}
  - id: 6
    text: "Утренняя депрессия Когда Вы чувствовали депрессию за последние 2 недели, заметили ли Вы, что депрессия была хуже в какое-то определенное время дня?"
    options:
      - {value: 0, label: "Отсутствует - Нет депрессии"}
      - {value: 1, label: "Легкая степень - Депрессия присутствует, но не изменяется в течение дня."}
      - {value: 2, label: "Средняя степень - Без наводящих вопросов интервьюера пациент отмечает, что депрессия хуже с утра."}
      - {value: 3, label: "Тяжелая степень - Депрессия существенно хуже с утра, сопровождается нарушением функционирования, состояние улучшается во второй половине дня."}
  - id: 7
    text: "Раннее пробуждение Просыпаетесь ли Вы утром раньше, чем это нормально для Вас? Сколько раз в неделю это происходит?"
    options:
      - {value: 0, label: "Отсутствует - Нет раннего пробуждения."}
      - {value: 1, label: "Легкая степень - Иногда (до двух раз в неделю) просыпается за 1 час или более до нормального времени пробуждения или звонка будильника."}
      - {value: 2, label: "Средняя степень - Часто (до пяти раз в неделю) просыпается за 1 час или более до нормального времени пробуждения или звонка будильника."}
      - {value: 3, label: "Тяжелая степень - Ежедневно просыпается за 1 час или более до нормального времени пробуждения."}
  - id: 8
    text: "Суицид Бывало ли у Вас чувство, что не стоит жить?"
    hint: "Хотелось ли Вам когда-нибудь покончить с собой? Каким образом Вы хотели это сделать? Пытались ли Вы когда-нибудь это сделать?"
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Легкая степень - Часто думал(а), что было бы лучше умереть, или изредка помышлял(а) о суициде."}
      - {value: 2, label: "Средняя степень - Серьезно думал(а) о суициде и имел(а) план, но попыток не было."}
      - {value: 3, label: "Тяжелая степень - Суицидная попытка была организована так, что должна была привести к смерти, но была случайно раскрыта, или использовались неэффективные средства."}
  - id: 9
    text: "Наблюдаемая депрессия Основана на наблюдениях интервьюера в ходе всего опроса. Вопрос “Хочется ли Вам плакать?”, заданный в соответствующих пунктах опроса, может дать информацию, полезную для этого наблюдения."
    options:
      - {value: 0, label: "Отсутствует"}
      - {value: 1, label: "Легкая степень - Пациент кажется грустным и мрачным даже при эмоционально нейтральном обсуждении вопросов интервьюера."}
      - {value: 2, label: "Средняя степень - Пациент кажется грустным и мрачным в ходе всего опроса, говорит унылым монотонным голосом и временами плачет или готов расплакаться."}
      - {value: 3, label: "Тяжелая степень - пациент замолкает при обсуждении огорчающих его вопросов, часто тяжело вздыхает и плачет в открытую или находится в состоянии скорбного оцепенения."}

scoring:
  method: sum
  bands:
    - {lower: 0,  upper: 5,  code: none,   level: 0, label: "Депрессия не выявлена"}
    - {lower: 6,  upper: 10, code: depression, level: 2, label: "Наличие депрессии"}
    - {lower: 11, upper: 27, code: severe, level: 3, label: "Тяжёлая депрессия"}

critical:
  - {item: 8, min_value: 1, proposal: true, note: "Пункт «Суицид» ≥ 1: нужна оценка суицидального риска (предложение, в КР не задано)"}
