# CGI — КР F40, приложение Г19. Врач. Три субшкалы оцениваются отдельно, суммарного балла нет.
# Пункт 1: в бланке КР нет градации 1; по ключу КР «от 1 (Здоров)» — добавлена «1 — Здоров».
# Пункт 3 (индекс эффективности): заголовки столбцов в PDF обрезаны («Нет / Не оказывают /
# Оказывают / —»); формулировки восстановлены по «Пояснениям» КР (4-й столбец — «побочные
# эффекты превалируют над терапевтическим эффектом»); 0 — отсутствие оценки.
code: CGI
version: 1
name: "CGI · шкала общего клинического впечатления"
measures: global_impression
direction: higher_is_worse
diagnoses: [F40]
filled_by: clinician
source: "КР F40, приложение Г19, стр. PDF 146–148"

items:
  - id: 1
    text: "Учитывая ваш общий клинический опыт работы с этой конкретной категорией пациентов, насколько выраженной вы оцените тяжесть психического расстройства данного пациента в настоящее время?"
    hint: "Баллы — Степень тяжести расстройства:"
    options:
      - {value: 0, label: "Не поддается оценке"}
      - {value: 1, label: "Здоров"}
      - {value: 2, label: "Погранично между нормой и расстройством"}
      - {value: 3, label: "Легкое расстройство"}
      - {value: 4, label: "Умеренно выраженное расстройство"}
      - {value: 5, label: "Выраженное расстройство"}
      - {value: 6, label: "Тяжелое расстройство"}
      - {value: 7, label: "Очень тяжелое расстройство"}
  - id: 2
    text: "Оцените общее улучшение состояния, независимо от того, связано ли оно, по вашему мнению, исключительно с лекарственным лечением. Оцените насколько оно изменилось по сравнению с его исходным состоянием."
    hint: "Баллы — Оценка общего улучшения:"
    options:
      - {value: 0, label: "Не поддается оценке"}
      - {value: 1, label: "Очень сильно улучшилось"}
      - {value: 2, label: "Сильно улучшилось"}
      - {value: 3, label: "Минимальное улучшение"}
      - {value: 4, label: "Без изменений"}
      - {value: 5, label: "Минимальное ухудшение"}
      - {value: 6, label: "Сильно ухудшилось"}
      - {value: 7, label: "Очень сильно ухудшилось"}
  - id: 3
    text: "Индекс эффективности: оцените этот пункт основываясь только на эффекте лекарственного средства. Выберите условия, которые лучше всего описывают степень терапевтического эффекта и побочных эффектов, и запишите число в поле, где эти два показателя пересекаются."
    hint: "Пример: терапевтический эффект оценивается как “умеренный”, а побочные эффекты оцениваются как “не оказывают существенного влияния на функциональный статус пациента”. Примечание: 0 - отсутствие оценки"
    options:
      - {value: 0, label: "Отсутствие оценки"}
      - {value: 1, label: "Терапевтический эффект: значимый; побочных эффектов нет"}
      - {value: 2, label: "Терапевтический эффект: значимый; побочные эффекты не оказывают существенного влияния на функциональный статус"}
      - {value: 3, label: "Терапевтический эффект: значимый; побочные эффекты оказывают существенное влияние на функциональный статус"}
      - {value: 4, label: "Терапевтический эффект: значимый; побочные эффекты превалируют над терапевтическим эффектом"}
      - {value: 5, label: "Терапевтический эффект: умеренный; побочных эффектов нет"}
      - {value: 6, label: "Терапевтический эффект: умеренный; побочные эффекты не оказывают существенного влияния на функциональный статус"}
      - {value: 7, label: "Терапевтический эффект: умеренный; побочные эффекты оказывают существенное влияние на функциональный статус"}
      - {value: 8, label: "Терапевтический эффект: умеренный; побочные эффекты превалируют над терапевтическим эффектом"}
      - {value: 9, label: "Терапевтический эффект: минимальный; побочных эффектов нет"}
      - {value: 10, label: "Терапевтический эффект: минимальный; побочные эффекты не оказывают существенного влияния на функциональный статус"}
      - {value: 11, label: "Терапевтический эффект: минимальный; побочные эффекты оказывают существенное влияние на функциональный статус"}
      - {value: 12, label: "Терапевтический эффект: минимальный; побочные эффекты превалируют над терапевтическим эффектом"}
      - {value: 13, label: "Терапевтический эффект: без изменений или ухудшение; побочных эффектов нет"}
      - {value: 14, label: "Терапевтический эффект: без изменений или ухудшение; побочные эффекты не оказывают существенного влияния на функциональный статус"}
      - {value: 15, label: "Терапевтический эффект: без изменений или ухудшение; побочные эффекты оказывают существенное влияние на функциональный статус"}
      - {value: 16, label: "Терапевтический эффект: без изменений или ухудшение; побочные эффекты превалируют над терапевтическим эффектом"}

scoring:
  method: none   # по КР каждый пункт CGI оценивается отдельно; суммарный балл не подсчитывается
