# SAS — КР F20, приложение Г7. Исследователь, осмотр. 10 параметров по 0–4, сумма 0–40.
# У пункта 5 в КР нет названия (описание процедуры — запястный сустав); градации пункта 2
# в PDF напечатаны после заголовка пункта 4.
# Ключ КР записан знаком «>»: «> 3 — норма; > 6 — слабая; > 12 — выраженные; > 18 — тяжёлые».
# Provisional: границы прочитаны буквально как нижние (>6 → 7–12 и т.д.); нужна клиническая проверка.
code: SAS
version: 1
name: "SAS · шкала Симпсона–Ангуса для оценки экстрапирамидных побочных эффектов"
measures: extrapyramidal_side_effects
direction: higher_is_worse
diagnoses: [F20]
filled_by: clinician
source: "КР F20, приложение Г7, стр. PDF 208–214"

items:
  - id: 1
    text: "Походка"
    hint: "Оценивается то, как пациент входит в комнату для осмотра; его походка, движения руками, общая поза; всё вместе формирует основу для общего счёта по данному пункту."
    options:
      - {value: 0, label: "Нормально"}
      - {value: 1, label: "Слегка заметное снижение объёма движений во время ходьбы"}
      - {value: 2, label: "Явное снижение объёма движений, указывающее на ригидность в плечевом поясе"}
      - {value: 3, label: "Скованная походка с едва заметными движениями рук или их отсутствием"}
      - {value: 4, label: "Ригидная походка со слегка пронированными руками; или пациент сильно сутулится, шаркает, движение вперед затруднено"}
  - id: 2
    text: "Свободное падение рук"
    hint: "Пациент и исследователь, оба поднимают руки на уровень плеч и позволяют им свободно упасть. В случае нормы, отчётливо слышен сильный шлепок по телу. В случае выраженного паркинсонизма руки будут опускаться очень медленно."
    options:
      - {value: 0, label: "Нормальное, свободное падение рук, слышен ясный шлепок, присутствует отдача"}
      - {value: 1, label: "Падение слегка замедленное, звук шлепка ослаблен, малая отдача"}
      - {value: 2, label: "Падение замедлено, нет отдачи"}
      - {value: 3, label: "Значительное замедление падения, отсутствие шлепка"}
      - {value: 4, label: "Руки опускаются как будто преодолевая сопротивление; «как сквозь клей»"}
  - id: 3
    text: "Качание плеч"
    hint: "Руки пациента согнуты в локтях под прямым углом, исследователь берёт одну руку за кисть и одновременно сдавливает другую в области локтя. Верхняя часть руки толкается вперёд-назад, плечевая кость при этом вращается наружу. Оценивается сопротивление, согласно указанным степеням. Процедура повторяется с ощупыванием плеча во время ротации."
    options:
      - {value: 0, label: "Норма"}
      - {value: 1, label: "Незначительные скованность и сопротивление"}
      - {value: 2, label: "Скованность и сопротивление средней степени"}
      - {value: 3, label: "Значительная ригидность, затруднения в пассивных движениях"}
      - {value: 4, label: "Выраженная скованность и ригидность, сустав почти «заморожен»"}
  - id: 4
    text: "Скованность локтей"
    hint: "Согнутые в локтях под прямым углом руки по очереди, пассивно сгибаются и разгибаются, при этом осматривается и пальпируется бицепс пациента. Оценивается сопротивление процедуре."
    options:
      - {value: 0, label: "Норма"}
      - {value: 1, label: "Незначительные скованность и сопротивление"}
      - {value: 2, label: "Скованность и сопротивление средней степени"}
      - {value: 3, label: "Значительная ригидность, затруднения в пассивных движениях"}
      - {value: 4, label: "Выраженная скованность и ригидность, сустав почти «заморожен»"}
  - id: 5
    text: "Пункт 5 [название в КР не напечатано; по описанию — оценка запястного сустава]"
    hint: "Исследователь держит одной рукой запястье пациента, другой - его пальцы, при этом сгибая и разгибая руку пациента в запястном суставе, отклоняя её в ульнарную и радиальную стороны, или разогнутую руку отпускают, позволяя ей упасть под собственным весом, или захват может делаться выше запястья, чтобы можно было трясти кистью пациента. Оценке «1» соответствует рука, которая легко разгибается, свободно падает или с лёгкостью болтается вверх-вниз."
    options:
      - {value: 0, label: "Норма"}
      - {value: 1, label: "Незначительные скованность и сопротивление"}
      - {value: 2, label: "Скованность и сопротивление средней степени"}
      - {value: 3, label: "Значительная ригидность, затруднения в пассивных движениях"}
      - {value: 4, label: "Выраженная скованность и ригидность, сустав почти «заморожен»"}
  - id: 6
    text: "Вращение головой"
    hint: "Пациенту сидя или стоя сообщают о намерении повернуть его голову из стороны в сторону, что это не больно и что ему следует расслабиться. (Необходимо заранее задать вопросы относительно возможных болей в области шеи и затруднений в движениях, чтобы не причинить ему боль). Голову пациента зажмите между ладонями, положив пальцы на затылок. Аккуратно вращайте голову три раза и оцените сопротивление этому движению."
    options:
      - {value: 0, label: "Вращается легко, без сопротивления"}
      - {value: 1, label: "Незначительное сопротивление движению, хотя время вращения не изменяется"}
      - {value: 2, label: "Заметное сопротивление, время вращения увеличено"}
      - {value: 3, label: "Явное сопротивление, вращение замедлено"}
      - {value: 4, label: "Голова кажется закостеневшей, ротация затруднена"}
  - id: 7
    text: "Поколачивание по надпереносью"
    hint: "Пациенту предлагают широко открыть глаза и не моргать. Облать надпереносья (глабелла) поколачивают с постоянной, быстрой скоростью. Отмечается количество раз, сколько пациенту удалось моргнуть. Следует стоять за спиной у пациента, чтобы он не замечал ударов пальцем. Необязательно видеть всё моргание целиком; это может быть мышечное сокращение, если окологлазные мышцы дергаются каждый раз в ответ на стимул от пальца. Варьируйте скорость поколачивания, чтобы убедиться, что мышцы реагируют соответственно ударам."
    options:
      - {value: 0, label: "0-5 морганий"}
      - {value: 1, label: "6-10 морганий"}
      - {value: 2, label: "11-15 морганий"}
      - {value: 3, label: "16-20 морганий"}
      - {value: 4, label: "21 и более морганий"}
  - id: 8
    text: "Тремор"
    hint: "Наблюдают за пациентом в момент, когда он входит в комнату для осмотра и затем продолжают наблюдать во время, когда он сгибает руки в локтях под прямым углом, а пальцы рук разведены как можно шире."
    options:
      - {value: 0, label: "В пределах нормы"}
      - {value: 1, label: "Лёгкий тремор пальцев рук, заметный глазом и на ощупь"}
      - {value: 2, label: "Тремор кистей или рук нерегулярный"}
      - {value: 3, label: "Стойкий тремор одной или более конечностей"}
      - {value: 4, label: "Дрожание всего тела"}
  - id: 9
    text: "Слюноотделение"
    hint: "Пациент наблюдается во время разговора, затем его просят открыть рот и поднять язык."
    options:
      - {value: 0, label: "В пределах нормы"}
      - {value: 1, label: "Слюноотделение увеличено так, что при открытом рте и поднятом языке видно скопление слюны по рту"}
      - {value: 2, label: "Слюноотделение увеличено настолько, что иногда приводит к затруднениям в речи"}
      - {value: 3, label: "Речь затруднена из-за усиленного слюноотделения"}
      - {value: 4, label: "Обильное слюнотечение"}
  - id: 10
    text: "Акатизия"
    hint: "Пациент обследуется на предмет двигательного беспокойства. Если оно отмечается, то задаётся вопрос: «Вы ощущаете двигательное беспокойство или дрожь внутри себя; трудно Вам оставаться в покое?» Субъективное мнение пациента не является необходимым, однако может помочь правильной оценке."
    options:
      - {value: 0, label: "Двигательное беспокойство не сообщается пациентом и не наблюдается"}
      - {value: 1, label: "Легкое двигательное беспокойство наблюдалось"}
      - {value: 2, label: "Двигательное беспокойство средней степени наблюдалось"}
      - {value: 3, label: "Двигательное беспокойство наблюдалось часто"}
      - {value: 4, label: "Двигательное беспокойство наблюдалось постоянно"}

scoring:
  method: sum
  bands:
    - {lower: 0,  upper: 6,  code: norm,     level: 0, label: "Соответствует норме", provisional: true}
    - {lower: 7,  upper: 12, code: mild,     level: 1, label: "Слабая степень выраженности симптомов", provisional: true}
    - {lower: 13, upper: 18, code: marked,   level: 2, label: "Выраженные проявления ЭПС", provisional: true}
    - {lower: 19, upper: 40, code: severe,   level: 3, label: "Тяжёлые ЭПС", provisional: true}
