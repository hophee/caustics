# ОПД — КР F43.1, приложение Г8. Категория 0 (вне классификации); кто заполняет, в КР не указано —
# по формулировкам бланка («Обведите кружком») это самоотчёт пациента.
# Противоречие внутри КР: в паспорте «общий балл — среднее арифметическое по 9 пунктам»,
# но диагностические диапазоны (9–15 и 19–45) и «Ключ» КР — сумма. Взята сумма.
# Диапазон 16–18 ключом КР не охвачен.
code: PDEQ
version: 1
name: "Опросник перитравматической диссоциации"
measures: peritraumatic_dissociation
direction: higher_is_worse
diagnoses: [F43.1]
filled_by: patient
source: "КР F43.1, приложение Г8, стр. PDF 184–187"

answer_sets:
  truth5:
    - {value: 1, label: "Совершенно неверно"}
    - {value: 2, label: "Иногда верно"}
    - {value: 3, label: "До некоторой степени верно"}
    - {value: 4, label: "Верно"}
    - {value: 5, label: "Совершенно верно"}

items:
  - id: 1
    text: "Были ли такие моменты во время события, когда вы переставали понимать, что происходит? Было ли у вас ощущение потери чувства реальности, «выпадения из реальности»? Были ли другие состояния, когда вы переставали ощущать себя частью происходящего?"
    answers: truth5
  - id: 2
    text: "Было ли так, что вы действовали автоматически («на автопилоте»)? Так, сделав что-то, вы позже осознавали, что это сделано вами, но никаких активных намерений совершить это действие тогда у вас не было?"
    answers: truth5
  - {id: 3, text: "Изменялось ли у вас чувство времени? Казалось ли вам, что события необычайно ускорялись или замедлялись?", answers: truth5}
  - {id: 4, text: "Казалось ли вам все происходящее нереальным, как будто вы были во сне или смотрели кино или какое-то представление?", answers: truth5}
  - id: 5
    text: "Ощущали ли вы себя посторонним наблюдателем происходящего с вами лично? Было ли у вас ощущение, что вы как бы летите над местом события или наблюдаете все со стороны?"
    answers: truth5
  - id: 6
    text: "Было ли так, что ваше ощущение собственного тела как бы искажалось или изменялось – вы чувствовали себя необычно маленьким или большим? Ощущали ли вы, что не связаны со своим телом?"
    answers: truth5
  - id: 7
    text: "Казалось ли вам, что нечто происходящее на ваших глазах с кем-то другим происходит непосредственно с вами? Например, если вы видели, как кого-то травмировало, чувствовали ли вы, что травмировало именно вас, даже если на самом деле этого не произошло?"
    answers: truth5
  - id: 8
    text: "Было ли так, что после того, как все кончилось, вы были удивлены, обнаружив, что в вашем присутствии произошло много событий, о которых вы ничего не знаете (особенно таких, которые вы обычно обязательно замечаете)?"
    answers: truth5
  - id: 9
    text: "Если вы были травмированы во время события, заметили ли вы, что в момент травмы ощутили удивительно слабую боль или не ощутили боли совсем? (Если вы не были травмированы, поставьте отметку здесь )"
    answers: truth5

scoring:
  method: sum
  bands:
    - {lower: 9,  upper: 15, code: typical_healthy, level: 0, label: "Показатели, характерные для здоровых"}
    - {lower: 16, upper: 18, code: uncovered,       level: 1, label: "Не охвачено ключом КР", provisional: true}
    - {lower: 19, upper: 45, code: typical_ptsd,    level: 2, label: "Показатели, характерные для пациентов с ПТСР"}
