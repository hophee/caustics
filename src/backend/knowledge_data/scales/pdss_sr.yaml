# PDSS — КР F41.0, приложение Г2. Версия самоотчёта (5–7 мин), последние 7 дней.
# Клиническая версия PDSS в КР не приведена.
# Ключ КР зависит от наличия агорафобии; для «с агорафобией» диапазоны «11–16» и «16–28»
# пересекаются на 16. Provisional: 16 отнесено к «тяжёлой степени», «очень тяжёлая» — 17–28.
code: PDSS-SR
version: 1
name: PDSS · шкала оценки тяжести панического расстройства (версия самоотчёта)
measures: panic_severity
direction: higher_is_worse
diagnoses:
- F41.0
filled_by: patient
source: КР F41.0, приложение Г2, стр. PDF 85–89
items:
- id: 1
  text: Как много развернутых или неразвернутых панических атак у вас было за прошедшие 7 дней?
  options:
  - value: 0
    label: Не было.
  - value: 1
    label: Ни одной развернутой панической атаки и не более 1 неразвернутой атаки в сутки.
  - value: 2
    label: 1-2 развернутые панические атаки в сутки и/или много неразвернутых атак в сутки.
  - value: 3
    label: Более чем 2 развернутые атаки за неделю, но не более чем 1 атака в день в среднем.
  - value: 4
    label: Развернутые панические атаки случаются более 1 раза в день большую часть дней недели.
- id: 2
  text: 'Если у вас были панические атаки за прошедшие 7 дней, насколько сильный дискомфорт (волнение, дистресс) они вам причинили
    в момент их появления? (Если их было несколько, то представьте усредненную оценку. Если у вас были только неразвернутые
    атаки, то отвечайте по поводу них):'
  options:
  - value: 0
    label: Они мне совсем не мешали или их не было на прошлой неделе.
  - value: 1
    label: Слабый дискомфорт (не очень сильный).
  - value: 2
    label: Средний дискомфорт (сильный, но с ними можно было справиться).
  - value: 3
    label: Серьезный дискомфорт (очень интенсивный).
  - value: 4
    label: Экстремальный дискомфорт (экстремально сильный дистресс во время всех панических атак).
- id: 3
  text: 'Как часто и насколько сильно за прошедшие 7 дней вы волновались по поводу того, когда случится следующая паническая
    атака, и по поводу страхов, возникающих в момент панической атаки? (Например, что панические атаки свидетельствуют о наличии
    у вас психического или физического заболевания, или о том, что они могут вызвать общественное порицание в ваш адрес):'
  options:
  - value: 0
    label: Этого не было совсем.
  - value: 1
    label: Эпизодическое или только слабое волнение.
  - value: 2
    label: Частое или средней тяжести.
  - value: 3
    label: Очень часто или в сильной степени.
  - value: 4
    label: Почти постоянно или «парализующей» силы.
- id: 4
  text: 'В течение прошедших 7 дней были ли ситуации или места (например, общественный транспорт, кинотеатры, мосты, туннели,
    гипермаркеты, одиночество и т.п.), которые вы избегали или чувствовали в этот момент страх (внутренний дискомфорт, желание
    не попадать в эти ситуации или сразу их покинуть), т.к. был страх, что может начаться паническая атака? Были ли какие-то
    другие ситуации, которых вы бы избегали или были испуганы в течение прошлой недели? Если да, то оцените, пожалуйста, уровень
    страха и ожидания на прошлой неделе:'
  options:
  - value: 0
    label: Страха и избегания не было.
  - value: 1
    label: 'Слабо: эпизодически возникали страх и избегание, с которыми я смог справиться. Это мало изменило привычный мне
      образ жизни на прошлой неделе.'
  - value: 2
    label: 'Средне: ощутимые, но контролируемые страх и/или избегание. Я избегал некоторые ситуации, но в компании со знакомым
      человеком мог чувствовать себя в них комфортно. Мой привычный образ жизни был из-за этого изменен, но мое общее функционирование
      не было нарушено.'
  - value: 3
    label: 'Тяжело: обширное избегание. Потребовалось значительно изменить мой привычный образ жизни, чтобы избегать пугающих
      ситуаций.'
  - value: 4
    label: 'Экстремально: повсеместные дезадаптирующие страх и/или избегание. Потребовалось сильно изменить привычный образ
      жизни, важные дела не были сделаны.'
- id: 5
  text: На протяжении прошедших 7 дней были ли какие-то виды деятельности (например, физические упражнения, сексуальные отношения,
    принятие горячего душа или ванны, употребление кофе, просмотр фильмов ужасов и т.п.), которые вы бы избегали или чувствовали
    страх, т.к. они вызывали физические ощущения, такие же, как и при панической атаке, или вы боялись, что они могут спровоцировать
    начало панической атаки?
  options:
  - value: 0
    label: Страха и избегания не было.
  - value: 1
    label: 'Слабо: эпизодически возникали страх и избегание, но обычно я мог справляться с этим. Это потребовало немного изменить
      привычный образ жизни.'
  - value: 2
    label: 'Средне: ощутимые, но контролируемые страх и/или избегание. Изменение привычного образа жизни было определимо,
      но ограничено и не вызывало нарушение общего функционирования.'
  - value: 3
    label: 'Тяжело: обширное избегание. Потребовалось значительно изменить мой привычный образ жизни и мое функционирование.'
  - value: 4
    label: 'Экстремально: повсеместное дезадаптирующее избегание. Потребовалось сильно изменить привычный образ жизни, важные
      дела не были сделаны.'
- id: 6
  text: 'На протяжении прошедших 7 дней как часто симптомы панического расстройства мешали вашей работоспособности и возможности
    заниматься домашними делами? (Если на прошлой неделе уровень занятости на работе или дома был меньше, чем обычно, отвечайте,
    как, по вашему мнению, это сочеталось бы, если бы уровень занятости был обычным):'
  options:
  - value: 0
    label: Нет влияния на работоспособность и способность заниматься домашними делами.
  - value: 1
    label: Было слабое влияние на работу и домашние дела, но я смог сделать почти все дела, которые сделал бы, если бы симптомов
      не было.
  - value: 2
    label: Было значительное влияние на работу и домашние дела, но я смог с этим справиться и сделать все необходимые дела.
  - value: 3
    label: Были существенные нарушения в сфере работы или быта, из-за этих проблем я не смог сделать много важных вещей.
  - value: 4
    label: Были экстремальные, выводящие из строя нарушения, из-за которых я не смог выполнить обязанности по работе и домашние
      дела.
- id: 7
  text: 'На протяжении прошедших 7 дней как часто развернутые или неразвернутые панические атаки, а также беспокойство по
    поводу возможности их возникновения мешали вашей социальной жизни? (Если у вас не было возможности много времени проводить
    в обществе на прошлой неделе, отвечайте так, как будто вы имели эти возможности как обычно):'
  options:
  - value: 0
    label: Не было влияния.
  - value: 1
    label: Было слабое влияние на социальную активность, но я смог сделать почти все так же, как если бы этих проблем не было.
  - value: 2
    label: Было значимое влияние на социальную активность, но я смог сделать наиболее важные дела.
  - value: 3
    label: Было существенное влияние на социальную активность, многие планы я не смог реализовать из-за этих проблем.
  - value: 4
    label: Были экстремальные, выводящие из строя нарушения, из-за которых было сложно сделать что-либо социальное.
scoring:
  method: sum
  variants:
    Без агорафобии:
    - lower: 0
      upper: 1
      code: norm
      level: 0
      label: Норма
    - lower: 2
      upper: 5
      code: mild
      level: 1
      label: Лёгкая степень
    - lower: 6
      upper: 9
      code: moderate
      level: 2
      label: Умеренная степень
    - lower: 10
      upper: 13
      code: severe
      level: 3
      label: Тяжёлая степень
    - lower: 14
      upper: 28
      code: extreme
      level: 4
      label: Очень тяжёлая степень
    С агорафобией:
    - lower: 0
      upper: 2
      code: norm
      level: 0
      label: Норма
    - lower: 3
      upper: 7
      code: mild
      level: 1
      label: Лёгкая степень
    - lower: 8
      upper: 10
      code: moderate
      level: 2
      label: Умеренная степень
    - lower: 11
      upper: 16
      code: severe
      level: 3
      label: Тяжёлая степень
    - lower: 17
      upper: 28
      code: extreme
      level: 4
      label: Очень тяжёлая степень
      provisional: true
critical:
- kind: total
  min_value: 9
  note: 'Сумма ≥ 9: по КР нужна формальная диагностическая оценка панического расстройства'
notes:
- 'PDSS-SR: приведены обе интерпретации. Врач выбирает по наличию агорафобии; суммарный балл одинаков. Пересечение на 16 в
  ключе КР разрешено предварительно в пользу тяжёлой степени.'
references:
  variant_source: 'диагноз: паническое расстройство без / с агорафобией'
