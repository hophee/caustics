# СКИД (SCID), модуль ПТСР — КР F43.1, приложение Г3. Специалист, диагностическое интервью.
# Ответ «НЕТ» со стрелкой завершает интервью (ПТСР нет). Коды пунктов приведены к I1–I5:
# в PDF нумерация неоднородна («И», «I2», «I3», затем «14», «15»; ссылки «В13», «из 14»).
code: SCID-PTSD
version: 1
name: "СКИД, модуль I «Посттравматическое стрессовое расстройство»"
measures: ptsd_diagnosis
direction: higher_is_worse
diagnoses: [F43.1]
filled_by: clinician
source: "КР F43.1, приложение Г3, стр. PDF 162–164"

answer_sets:
  yes_no:
    - {value: 0, label: "Нет"}
    - {value: 1, label: "Да"}

items:
  - id: "I1"
    text: "Участвовали ли Вы, имели отношение или были очевидцем экстремальных травматических событий, которые были бы связаны с серьезными травмами, реальной смертью или угрозой смерти по отношению к Вам или кому-то другому? Примеры травматических событий: серьезная авария, сексуальное или физическое насилие, террористический акт, пребывание в заложниках, похищение, ограбление, пожар, обнаружение трупа, неожиданная смерть, война, природные катаклизмы"
    answers: yes_no
  - {id: "I2", text: "В течение последнего месяца, переживали ли Вы заново это событие (например, в мыслях, интенсивных воспоминаниях или физических реакциях)?", answers: yes_no}
  - {id: "I3a", text: "В течение последнего месяца: Избегали ли Вы думать об этом событии, избегали ли Вы вещей, напоминающих Вам о нем?", answers: yes_no}
  - {id: "I3b", text: "В течение последнего месяца: Трудно ли Вам вспоминать о каком-либо важном аспекте произошедшего события?", answers: yes_no}
  - {id: "I3c", text: "В течение последнего месяца: Снизился ли Ваш интерес к хобби или выполнению социальных обязательств?", answers: yes_no}
  - {id: "I3d", text: "В течение последнего месяца: Чувствовали ли Вы себя одиноким или оторванным от других?", answers: yes_no}
  - {id: "I3e", text: "В течение последнего месяца: Заметили ли Вы, что Ваши переживания стали чаще?", answers: yes_no}
  - {id: "I3f", text: "В течение последнего месяца: Нет ли у Вас ощущения, что эта травма сократила Вам жизнь?", answers: yes_no}
  - {id: "I4a", text: "В последний месяц: Есть ли у Вас трудности со сном?", answers: yes_no}
  - {id: "I4b", text: "В последний месяц: Были ли Вы особенно раздражительны, злы или вспыльчивы?", answers: yes_no}
  - {id: "I4c", text: "В последний месяц: Трудно ли Вам было сконцентрироваться?", answers: yes_no}
  - {id: "I4d", text: "В последний месяц: Вы были нервным или постоянно напряженным?", answers: yes_no}
  - {id: "I4e", text: "В последний месяц: Легко ли Вас было испугать?", answers: yes_no}
  - id: "I5"
    text: "На протяжении последнего месяца влияли ли эти проблемы существенно на Ваши рабочие обязанности, социальные обязательства, вызывали ли существенное недомогание?"
    answers: yes_no

scoring:
  method: rule
  cases:
    - match: all
      conditions:
        - {item: I1, min_value: 1}
        - {item: I2, min_value: 1}
        - {items: [I3a, I3b, I3c, I3d, I3e, I3f], min_value: 1, count_min: 3}
        - {items: [I4a, I4b, I4c, I4d, I4e], min_value: 1, count_min: 2}
        - {item: I5, min_value: 1}
      band: {code: ptsd_current, level: 3, label: "ПТСР в настоящее время — ДА"}
  default: {code: no_ptsd, level: 0, label: "ПТСР в настоящее время — НЕТ"}
