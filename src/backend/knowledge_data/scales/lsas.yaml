# LSAS — КР F40, приложение Г16. Пациент оценивает 24 ситуации: страх и избегание.
# Противоречие внутри КР: в паспорте шкала 0–3 («0 — отсутствие … 3 — сильный страх»),
# в бланке градации пронумерованы 1–4. Взяты баллы 0–3 (те же формулировки), т.к. ключ КР
# (55–65, 65–80, 80–95, > 95) рассчитан на сумму 0–144; при 1–4 минимум был бы 48.
# Provisional: границы ключа пересекаются (65, 80, 95) — граничный балл отнесён к нижней категории.
# Деление ситуаций на «взаимодействие» и «наблюдение» в КР упомянуто, но не расписано по пунктам.
code: LSAS
version: 1
name: "LSAS · шкала социальной тревожности Либовица"
measures: social_anxiety
direction: higher_is_worse
diagnoses: [F40]
filled_by: patient
source: "КР F40, приложение Г16, стр. PDF 139–142"

answer_sets:
  fear:
    - {value: 0, label: "Отсутствует"}
    - {value: 1, label: "Выражены слабо"}
    - {value: 2, label: "Выражены умеренно"}
    - {value: 3, label: "Выражены сильно"}
  avoidance:
    - {value: 0, label: "Никогда"}
    - {value: 1, label: "Иногда"}
    - {value: 2, label: "Часто"}
    - {value: 3, label: "Как правило"}

items:
  - {id: "1f", text: "Говорить по телефону в общественных местах. — страх или тревога", answers: fear, situation: 1}
  - {id: "1a", text: "Говорить по телефону в общественных местах. — избегание", answers: avoidance, situation: 1}
  - {id: "2f", text: "Участвовать в деятельности небольшой группы — страх или тревога", answers: fear, situation: 2}
  - {id: "2a", text: "Участвовать в деятельности небольшой группы — избегание", answers: avoidance, situation: 2}
  - {id: "3f", text: "Есть в общественных местах — страх или тревога", answers: fear, situation: 3}
  - {id: "3a", text: "Есть в общественных местах — избегание", answers: avoidance, situation: 3}
  - {id: "4f", text: "Пить в общественных местах — страх или тревога", answers: fear, situation: 4}
  - {id: "4a", text: "Пить в общественных местах — избегание", answers: avoidance, situation: 4}
  - {id: "5f", text: "Говорить с начальством (вышестоящим лицом) — страх или тревога", answers: fear, situation: 5}
  - {id: "5a", text: "Говорить с начальством (вышестоящим лицом) — избегание", answers: avoidance, situation: 5}
  - {id: "6f", text: "Выполнять какие-либо действия или говорить перед аудиторией — страх или тревога", answers: fear, situation: 6}
  - {id: "6a", text: "Выполнять какие-либо действия или говорить перед аудиторией — избегание", answers: avoidance, situation: 6}
  - {id: "7f", text: "Участвовать в вечеринке, идти в гости — страх или тревога", answers: fear, situation: 7}
  - {id: "7a", text: "Участвовать в вечеринке, идти в гости — избегание", answers: avoidance, situation: 7}
  - {id: "8f", text: "Работать под наблюдением (в присутствии) кого-либо. — страх или тревога", answers: fear, situation: 8}
  - {id: "8a", text: "Работать под наблюдением (в присутствии) кого-либо. — избегание", answers: avoidance, situation: 8}
  - {id: "9f", text: "Писать под наблюдением в присутствии) кого-либо — страх или тревога", answers: fear, situation: 9}
  - {id: "9a", text: "Писать под наблюдением в присутствии) кого-либо — избегание", answers: avoidance, situation: 9}
  - {id: "10f", text: "Говорить по телефону с малознакомым человеком — страх или тревога", answers: fear, situation: 10}
  - {id: "10a", text: "Говорить по телефону с малознакомым человеком — избегание", answers: avoidance, situation: 10}
  - {id: "11f", text: "Говорить с глазу на глаз с малознакомым человеком — страх или тревога", answers: fear, situation: 11}
  - {id: "11a", text: "Говорить с глазу на глаз с малознакомым человеком — избегание", answers: avoidance, situation: 11}
  - {id: "12f", text: "Встречаться с незнакомыми людьми — страх или тревога", answers: fear, situation: 12}
  - {id: "12a", text: "Встречаться с незнакомыми людьми — избегание", answers: avoidance, situation: 12}
  - {id: "13f", text: "Мочиться в общественном туалете. — страх или тревога", answers: fear, situation: 13}
  - {id: "13a", text: "Мочиться в общественном туалете. — избегание", answers: avoidance, situation: 13}
  - {id: "14f", text: "Входить в комнату, где уже сидят другие люди. — страх или тревога", answers: fear, situation: 14}
  - {id: "14a", text: "Входить в комнату, где уже сидят другие люди. — избегание", answers: avoidance, situation: 14}
  - {id: "15f", text: "Быть в центре внимания — страх или тревога", answers: fear, situation: 15}
  - {id: "15a", text: "Быть в центре внимания — избегание", answers: avoidance, situation: 15}
  - {id: "16f", text: "Выступать на собрании без подготовки — страх или тревога", answers: fear, situation: 16}
  - {id: "16a", text: "Выступать на собрании без подготовки — избегание", answers: avoidance, situation: 16}
  - {id: "17f", text: "Тестироваться на умения, способности знания. — страх или тревога", answers: fear, situation: 17}
  - {id: "17a", text: "Тестироваться на умения, способности знания. — избегание", answers: avoidance, situation: 17}
  - {id: "18f", text: "Выражать неодобрение или несогласие с малознакомым человеком — страх или тревога", answers: fear, situation: 18}
  - {id: "18a", text: "Выражать неодобрение или несогласие с малознакомым человеком — избегание", answers: avoidance, situation: 18}
  - {id: "19f", text: "Смотреть прямо в глаза малознакомому человеку. — страх или тревога", answers: fear, situation: 19}
  - {id: "19a", text: "Смотреть прямо в глаза малознакомому человеку. — избегание", answers: avoidance, situation: 19}
  - {id: "20f", text: "Выступать с подготовленной речью перед группой людей — страх или тревога", answers: fear, situation: 20}
  - {id: "20a", text: "Выступать с подготовленной речью перед группой людей — избегание", answers: avoidance, situation: 20}
  - {id: "21f", text: "Пытаться познакомиться с кем-то с целью сексуальных или романтических отношений. — страх или тревога", answers: fear, situation: 21}
  - {id: "21a", text: "Пытаться познакомиться с кем-то с целью сексуальных или романтических отношений. — избегание", answers: avoidance, situation: 21}
  - {id: "22f", text: "Возвратить товар в магазин или договориться о выплате компенсации. — страх или тревога", answers: fear, situation: 22}
  - {id: "22a", text: "Возвратить товар в магазин или договориться о выплате компенсации. — избегание", answers: avoidance, situation: 22}
  - {id: "23f", text: "Организовать вечеринку /пригласить гостей — страх или тревога", answers: fear, situation: 23}
  - {id: "23a", text: "Организовать вечеринку /пригласить гостей — избегание", answers: avoidance, situation: 23}
  - {id: "24f", text: "Устоять перед настойчивыми предложениями продавца. — страх или тревога", answers: fear, situation: 24}
  - {id: "24a", text: "Устоять перед настойчивыми предложениями продавца. — избегание", answers: avoidance, situation: 24}

scoring:
  method: sum
  subscales:
    - {code: fear, name: "Страх или тревога (сумма)", items: ["1f", "2f", "3f", "4f", "5f", "6f", "7f", "8f", "9f", "10f", "11f", "12f", "13f", "14f", "15f", "16f", "17f", "18f", "19f", "20f", "21f", "22f", "23f", "24f"]}
    - {code: avoidance, name: "Избегание (сумма)", items: ["1a", "2a", "3a", "4a", "5a", "6a", "7a", "8a", "9a", "10a", "11a", "12a", "13a", "14a", "15a", "16a", "17a", "18a", "19a", "20a", "21a", "22a", "23a", "24a"]}
  bands:
    - {lower: 0,  upper: 54,  code: below,     level: 0, label: "Ниже порога ключа КР (55)"}
    - {lower: 55, upper: 65,  code: mild,      level: 1, label: "Слабовыраженная социофобия"}
    - {lower: 66, upper: 80,  code: marked,    level: 2, label: "Достаточно выраженная социофобия", provisional: true}
    - {lower: 81, upper: 95,  code: severe,    level: 3, label: "Сильная социофобия", provisional: true}
    - {lower: 96, upper: 144, code: very_severe, level: 4, label: "Очень сильная социофобия"}
