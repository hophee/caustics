# PANSS — КР F20, приложение Г1. Врач, клиническое интервью. Градации 1–7.
# В КР отсутствуют пункты П4 «Возбуждение» и О4 «Напряжённость» (28 из 30 пунктов);
# фиктивные пункты не добавлены. Пороговых значений в КР нет — только критерий
# эффективности терапии по редукции суммарного балла относительно исходного.
code: PANSS
version: 1
name: PANSS · шкала оценки позитивных и негативных синдромов (28 пунктов из КР)
measures: psychotic_symptoms
direction: higher_is_worse
diagnoses:
- F20
filled_by: clinician
source: КР F20, приложение Г1, стр. PDF 139–163
licence_note: Copyrighted instrument (Kay, Opler, Fiszbein); confirm rights before production use.
items:
- id: П1
  text: БРЕД Ложное умозаключение, убеждение в необоснованных, нереалистичных и идиосинкратичных (необычных) идеях. оценивается
    по содержанию мыслей, высказанных в беседе, и их влиянию на социальные отношения и поведение больного (по данным медицинского
    персонала и родственников).
  options:
  - value: 1
    label: 'Отсутствует: состояние больного не соответствует определению расстройства.'
  - value: 2
    label: 'Очень слабая выраженность: сомнительная патология, оцениваемые признаки могут быть верхним пределом нормы.'
  - value: 3
    label: 'Слабая выраженность: наличие одной или двух нечетких, мало оформленных и неустойчивых бредовых идей, не нарушающих
      мышление, поведение и отношения больного с другими людьми.'
  - value: 4
    label: 'Умеренная выраженность: калейдоскопическое чередование многих мало оформленных и неустойчивых бредовых идей или
      наличие нескольких четко оформленных идей, которые изредка мешают нормальному мышлению больного и отражаются на его
      отношениях с другими людьми и поведении.'
  - value: 5
    label: 'Сильная выраженность: наличие многочисленных, четко оформленных и устойчивых бредовых идей, которые периодически
      отражаются на мышлении, социальных отношениях и поведении больного.'
  - value: 6
    label: 'Очень сильная выраженность: наличие комплекса оформленных, нередко систематизированных, устойчивых бредовых идей,
      которые заметно нарушают процесс мышления, отношения больного с другими людьми и его поведение.'
  - value: 7
    label: 'Крайняя степень выраженности: наличие устойчивого комплекса многочисленных или детально систематизированных бредовых
      идей, оказывающих существенное влияние на основные аспекты жизни больного, что приводит к неадекватным и безответственным
      поступкам, представляющим в некоторых случаях опасность для больного и окружающих.'
- id: П2
  text: КОНЦЕПТУАЛЬНАЯ ДЕЗОРГАНИЗАЦИЯ Дезорганизация процесса мышления, характеризующаяся разорванностью целенаправленного
    потока мыслей, т. е. излишней детализацией (обстоятельностью), поверхностностью, резонерством, соскальзываниями, аморфностью
    ассоциаций, непоследовательностью, паралогичностью или «закупоркой мыслей» (шперрунгами). оценивается по состоянию мыслительно-речевого
    процесса в беседе.
  options:
  - value: 1
    label: 'Отсутствует: состояние больного не соответствует определению расстройства.'
  - value: 2
    label: 'Очень слабая выраженность: сомнительная патология, оцениваемые признаки могут быть верхним пределом нормы.'
  - value: 3
    label: 'Слабая выраженность: мышление обстоятельное, поверхностное, паралогичное или с соскальзываниями («ответы по касательной»).
      Больной испытывает некоторые затруднения в целенаправленном мышлении (при попытке сосредоточиться на одной мысли), при
      проявлении врачом настойчивости могут появляться случайные ассоциации.'
  - value: 4
    label: 'Умеренная выраженность: при конкретном и кратковременном общении сохраняется способность сосредоточиваться на
      определенных мыслях, однако при малейшем давлении или в более сложных ситуациях мышление становится аморфным (расплывчатым),
      лишенным целенаправленности.'
  - value: 5
    label: 'Сильная выраженность: больной почти всегда испытывает трудности в организации целенаправленного потока мыслей,
      что проявляется в соскальзываниях, непоследовательности, расплывчатости, некоторой потери связности мышления даже при
      отсутствии давления со стороны.'
  - value: 6
    label: 'Очень сильная выраженность: мыслительная деятельность серьезно расстроена и бессистемна; практически постоянно
      отмечаются отчетливые непоследовательность и разорванность мышления.'
  - value: 7
    label: 'Крайняя степень выраженности: разорванность мышления достигает степени бессвязности (инкогеренции). Имеет место
      выраженное разрыхление ассоциативных связей, приводящее к полной утрате способности к общению, вплоть до «словесной
      окрошки» или мутизма.'
- id: П3
  text: ГАЛЛЮЦИНАЦИИ Высказывания или поведение, указывающие на восприятие без соответствующего внешнего раздражителя. Патологическое
    восприятие может иметь место в слуховой, зрительной, обонятельной или соматической сферах. оценивается по устным сообщениям
    или внешним проявлениям во время беседы, а также по сведениям, полученным от медицинского персонала или родственников
    больного.
  hint: ''
  options:
  - value: 1
    label: 'Отсутствует: состояние больного не соответствует определению расстройства.'
  - value: 2
    label: 'Очень слабая выраженность: сомнительная патология, оцениваемые признаки могут быть верхним пределом нормы.'
  - value: 3
    label: 'Слабая степень выраженности: одна-две редкие, но отчетливые галлюцинации или несколько смутных патологических
      восприятий, не сказывающихся на мышлении и поведении больного.'
  - value: 4
    label: 'Умеренная выраженность: частые, но не постоянные галлюцинации, мышление и поведение больного нарушено незначительно.'
  - value: 5
    label: 'Сильная выраженность: частые галлюцинации, затрагивающие иногда более одной чувственной сферы и заметно нарушающие
      мышление и/или поведение. возможна бредовая интерпретация галлюцинаторных переживаний с соответствующим эмоциональным
      и иногда вербальным сопровождением.'
  - value: 6
    label: 'Очень сильная выраженность: практически непрерывные галлюцинации, существенно нарушающие мышление и поведение
      больного. Расстройства восприятия переживаются как реально происходящие события с частыми эмоциональными и вербальными
      реакциями на них, резко затрудняющими адаптационные возможности больного.'
  - value: 7
    label: 'Крайняя степень выраженности: личность больного практически полностью охвачена галлюцинациями, которые, по сути,
      определяют направление его мышления и поведение. Галлюцинации сопровождаются устойчивой бредовой интерпретацией, вербальными
      и поведенческими реакциями, в том числе и полным подчинением императивным галлюцинациям.'
- id: П5
  text: ИДЕИ ВЕЛИЧИЯ Повышенная самооценка и необоснованная убежденность в своем превосходстве, включая бредовые идеи обладания
    особыми способностями, богатством, знаниями, славой, властью и моральной правотой. оценивается по содержанию мыслей, выявляемых
    в беседе, и их отражению в поведении больного (по данным медицинского персонала и родственников).
  options:
  - value: 1
    label: 'Отсутствует: состояние больного не соответствует определению расстройства.'
  - value: 2
    label: 'Очень слабая выраженность: сомнительная патология, оцениваемые признаки могут быть верхним пределом нормы.'
  - value: 3
    label: 'Слабая степень выраженности: отмечаются некоторая экспансивность и хвастливость. Четко оформленные идеи величия
      не обнаруживаются.'
  - value: 4
    label: 'Умеренная выраженность: явное и нереалистичное чувство превосходства над другими; возможны мало оформленные бредовые
      идеи особого положения или способностей, которые, однако, не определяют поведения больного.'
  - value: 5
    label: 'Сильная выраженность: четко оформленные идеи выдающихся способностей, власти или исключительного положения, которые
      оказывают влияние на формирование установок, но не проявляются в поведении.'
  - value: 6
    label: 'Очень сильная выраженность: четко оформленные бредовые идеи превосходства сразу по нескольким параметрам (богатство,
      знания, слава и т. д.) проявляются не только в высказываниях, но и в отношениях с другими людьми, а также в некоторых
      действиях.'
  - value: 7
    label: 'Крайняя степень выраженности: мышление, взаимоотношения с другими людьми и поведение практически полностью определяются
      множественными бредовыми идеями необычайных способностей, богатства, знаний, славы и/или моральных достоинств, которые
      могут приобретать нелепый характер.'
- id: П6
  text: ПОДОЗРИТЕЛЬНОСТЬ, ИДЕИ ПРЕСЛЕДОВАНИЯ Необоснованные или преувеличенные идеи преследования, проявляющиеся в чувстве
    настороженности, недоверии, подозрительной бдительности и более явном бредовом убеждении во враждебном отношении окружающих.
    оценивается по содержанию высказанных во время беседы мыслей и их влиянию на поведение больного, в том числе по данным
    медицинского персонала и родственников.
  options:
  - value: 1
    label: 'Отсутствует: состояние больного не соответствует определению расстройства.'
  - value: 2
    label: 'Очень слабая выраженность: сомнительная патология, оцениваемые признаки могут быть верхним пределом нормы.'
  - value: 3
    label: 'Слабая выраженность: больной проявляет настороженность или даже открытое недоверие, но мышление, поведение и взаимоотношения
      с другими людьми практически не нарушены.'
  - value: 4
    label: 'Умеренная выраженность: недоверие настолько заметно, что затрудняет беседу с врачом и отражается на поведении
      больного. тем не менее бред преследования отсутствует. С другой стороны, у части больных могут наблюдаться мало оформленные
      бредовые идеи преследования, видимо, не влияющие на поведение и межличностные взаимоотношения.'
  - value: 5
    label: 'Сильная выраженность: недоверие настолько сильно, что приводит к разрыву отношений с другими людьми. Могут наблюдаться
      оформленные бредовые идеи преследования, несколько изменяющие характер отношений с людьми и поведение больного.'
  - value: 6
    label: 'Очень сильная выраженность: оформленный бред преследования, имеющий тенденцию к расширению, систематизации и значительно
      нарушающий отношения больного с другими людьми.'
  - value: 7
    label: 'Крайняя степень выраженности: разветвленный комплекс систематизированных бредовых идей преследования, практически
      полностью определяющий образ мыслей, социальные отношения и поведение больного.'
- id: П7
  text: ВРАЖДЕБНОСТЬ
  hint: Вербальные или иные проявления гнева и неприязненного отношения, в том числе и сарказм, пассивно-агрессивное поведение,
    угрозы и открытое нападение. оценивается по поведению во время беседы и по сведениям, полученным от медперсонала и родственников.
    Шкала негативных синдромов (Н)
  options:
  - value: 1
    label: 'Отсутствует: состояние больного не соответствует определению расстройства.'
  - value: 2
    label: 'Очень слабая выраженность: сомнительная патология, оцениваемые признаки могут быть верхним пределом нормы.'
  - value: 3
    label: 'Слабая выраженность: непрямые или скрытые проявления гневливости, например, сарказм, неуважение, враждебные высказывания,
      эпизоды раздражительности.'
  - value: 4
    label: 'Умеренная выраженность: открытая враждебная настроенность, быстрая раздражительность и прямые проявления гнева
      или негодования.'
  - value: 5
    label: 'Сильная выраженность: больной крайне раздражителен, иногда прибегает к словесным оскорблениям и угрозам.'
  - value: 6
    label: 'Очень сильная выраженность: контакт с больным затруднен вследствие словесных оскорблений и угроз, что также существенно
      нарушает отношения с другими людьми. Больной может быть настроен воинственно и иметь склонность к разрушительному поведению,
      однако физического нападения на людей не совершает.'
  - value: 7
    label: 'Крайняя степень выраженности: сильный гнев с практически полным отсутствием контакта с врачом и другими людьми
      или эпизоды нападения на людей.'
- id: Н1
  text: ПРИТУПЛЕННЫЙ АФФЕКТ Сниженная эмоциональность, выражающаяся в уменьшении экспрессивности мимики, неспособности к проявлению
    чувств и коммуникативной жестикуляции. оценивается по наблюдению за физическими проявлениями аффективной выразительности
    и эмоциональности больного во время беседы.
  options:
  - value: 1
    label: 'Отсутствует: состояние больного не соответствует определению расстройства.'
  - value: 2
    label: 'Очень слабая выраженность: сомнительная патология, оцениваемые признаки могут быть верхним пределом нормы.'
  - value: 3
    label: 'Слабая выраженность: мимика и коммуникативная жестикуляция кажутся напыщенными, вымученными, искусственными или
      обедненными.'
  - value: 4
    label: 'Умеренная выраженность: уменьшение диапазона экспрессивности лица и жестикуляции определяет характерный «скучающий»
      (невыразительный) внешний вид.'
  - value: 5
    label: 'Сильная выраженность: аффект обычно притуплен (уплощен), мимика скудная, жестикуляция обеднена.'
  - value: 6
    label: 'Очень сильная выраженность: значительная притупленность аффекта и недостаточность эмоциональных реакций наблюдаются
      большую часть времени. Иногда возможны чрезвычайно сильные, неконтролируемые аффективные разряды в виде возбуждения,
      вспышек ярости или беспричинного смеха.'
  - value: 7
    label: 'Крайняя степень выраженности: мимические модуляции и коммуникативная жестикуляция практически отсутствуют. выражение
      лица постоянно безразличное или застывшее («деревянное»).'
- id: Н2
  text: ЭМОЦИОНАЛЬНАЯ ОТГОРОЖЕННОСТЬ
  options:
  - value: 1
    label: 'Отсутствует: состояние больного не соответствует определению расстройства.'
  - value: 2
    label: 'Очень слабая выраженность: сомнительная патология, оцениваемые признаки могут быть верхним пределом нормы.'
  - value: 3
    label: 'Слабая выраженность: больной недостаточно инициативен в общении.'
  - value: 4
    label: 'Умеренная выраженность: при поощрении вовлекается в общение и деятельность.'
  - value: 5
    label: 'Сильная выраженность: больной не поддается вовлечению в общение, трудовую деятельность.'
  - value: 6
    label: 'Очень сильная выраженность: явное безразличие к окружающим, пренебрежение собственными нуждами (нуждается в уходе).'
  - value: 7
    label: 'Крайняя степень выраженности: отгорожен, недоступен.'
- id: Н3
  text: ТРУДНОСТИ В ОБЩЕНИИ (НЕДОСТАТОЧНЫЙ РАППОРТ, НЕКОММУНИКАБЕЛЬНОСТЬ) Отсутствие сопереживания, открытости, откровенности
    в разговорах с людьми, интереса или участия к собеседнику, что проявляется в затруднении налаживания межперсональных контактов,
    уменьшении объема вербального и невербального общения. оценивается по характеру поведения и отношению больного к врачу
    в процессе беседы.
  options:
  - value: 1
    label: 'Отсутствует: состояние больного не соответствует определению расстройства.'
  - value: 2
    label: 'Очень слабая выраженность: сомнительная патология, оцениваемые признаки могут быть верхним пределом нормы.'
  - value: 3
    label: 'Слабая выраженность: в общении с больным ощущается некоторая искусственность, натянутость, высокопарность. Речи
      больного не хватает эмоциональной глубины, она часто носит обезличенный, характер.'
  - value: 4
    label: 'Умеренная выраженность: больной, как правило, выглядит отчужденным, держит дистанцию с собеседником, на вопросы
      отвечает механически, его поведение выражает скуку или отсутствие интереса к беседе.'
  - value: 5
    label: 'Сильная выраженность: явная отчужденность и незаинтересованность больного в беседе затрудняют продуктивный контакт
      с ним. Больной старается избегать смотреть в глаза собеседника.'
  - value: 6
    label: 'Очень сильная выраженность: больной в высшей степени безразличен к окружающему, держит себя на расстоянии от собеседника,
      избегает смотреть ему в глаза и не выдерживает ответного взгляда. Ответы односложные, поверхностные. Попытки невербального
      контакта с больным практически остаются без ответа.'
  - value: 7
    label: 'Крайняя степень выраженности: больного не удается вовлечь в беседу, он выглядит абсолютно безразличным, упорно
      избегает вербального и невербального контактов с собеседником.'
- id: Н4
