      угрожает или требует, разрушает имущество, явно не представляя себе последствий этих действий. Больной проявляет отчетливую
      тенденцию к участию в драках и другим насильственным действиям, в том числе нападению на почве сексуального влечения.
      Поведение может быть обусловлено подчинением императивным галлюцинациям.'
  - value: 7
    label: 'Крайняя степень выраженности: больной предпринимает повторные нападения на людей с целью убийства или изнасилования,
      или совершает акты самоповреждения. При этом проявляет особую жестокость. в связи с неспособностью контролировать опасные
      импульсы больной требует постоянного надзора, изоляции или фиксации.'
- id: О15
  text: ЗАГРУЖЕННОСТЬ ПСИХИЧЕСКИМИ ПЕРЕЖИВАНИЯМИ (ОТРЕШЕННОСТЬ ОТ РЕАЛЬНОСТИ) Поглощенность внутренними переживаниями (мыслями,
    чувствами или аутистическими фантазиями), приводящая к нарушению адаптации и ориентировки в окружающей ситуации. выраженность
    оценивается на основании ответов и поведения больного во время беседы.
  options:
  - value: 1
    label: 'Отсутствует: состояние больного не соответствует определению расстройства.'
  - value: 2
    label: 'Очень слабая выраженность: сомнительная патология, оцениваемые признаки могут быть верхним пределом нормы.'
  - value: 3
    label: 'Слабая выраженность: чрезмерная озабоченность своими нуждами и проблемами, проявляющаяся впостоянных попытках
      перевести разговор на волнующие больного темы при отсутствии интереса к потребностям других людей.'
  - value: 4
    label: 'Умеренная выраженность: временами больной выглядит погруженным в себя, поглощенным своими мечтами или переживаниями,
      что в некоторой степени затрудняет беседу с ним.'
  - value: 5
    label: 'Сильная выраженность: больной погружен в аутистические фантазии или внутренние переживания, что отражается на
      его поведении и значительно нарушает его социальную и коммуникативную активность. Иногда больной сидит с отсутствующим
      взглядом, что-то шепчет и/или говорит сам с собой, совершает стереотипные движения.'
  - value: 6
    label: 'Очень сильная выраженность: больной почти полностью поглощен своими внутренними переживаниями, что значительно
      затрудняет способность к концентрации внимания, участие в беседе и ориентацию в окружающей ситуации. Больной часто чему-
      то улыбается, смеется, что-то шепчет, говорит сам с собой.'
  - value: 7
    label: 'Крайняя степень выраженности: полная загруженность внутренними переживаниями, сопровождающаяся резким снижением
      уровня адаптации. Поведение больного полностью подчинено галлюцинациям, он мало обращает внимание на окружающих людей
      и обстановку.'
- id: О16
  text: АКТИВНАЯ СОЦИАЛЬНАЯ УСТРАНЕННОСТЬ Снижение социальной активности на почве необоснованного страха, враждебности или
    подозрительности. оценивается на основании сведений о социальной активности больного, полученных от медперсонала и родственников
    больного.
  options:
  - value: 1
    label: 'Отсутствует: состояние больного не соответствует определению расстройства.'
  - value: 2
    label: 'Очень слабая выраженность: сомнительная патология, оцениваемые признаки могут быть верхним пределом нормы.'
  - value: 3
    label: 'Слабая выраженность: больной чувствует себя неловко в присутствии других людей и предпочитает проводить время
      в одиночку, хотя при необходимости проявляет социальную активность.'
  - value: 4
    label: 'Умеренная выраженность: больной неохотно участвует во всех (или в большинстве) социальных мероприятиях, нуждается
      в постоянном поощрении, уговаривании и может неожиданно уклониться от участия в них при появлении тревоги, подозрительного
      или враждебного отношения.'
  - value: 5
    label: 'Сильная выраженность: больной со страхом или гневом отказывается от большинства социальных контактов, несмотря
      на попытки окружающих вовлечь его в них. Большую часть времени бесцельно проводит в одиночестве.'
  - value: 6
    label: 'Очень сильная выраженность: из-за сильного страха, враждебности или подозрительности больной проявляет лишь самую
      необходимую социальную активность. При инициативе со стороны окружающих больной проявляет явное стремление избежать
      контактов и обычно старается держаться в стороне от людей.'
  - value: 7
    label: 'Крайняя степень выраженности: больного не удается вовлечь в социальные отношения из-за наличия сильного страха,
      враждебности или бреда преследования. он всеми силами стремится избежать контактов.'
