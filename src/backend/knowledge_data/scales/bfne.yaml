# BFNE — КР F40, приложение Г17. Пациент. 12 утверждений, 1–5.
# По КР — простая сумма; обратные пункты в КР не указаны (в оригинале Leary 1983 они есть).
code: BFNE
version: 1
name: "BFNE · краткая шкала страха негативной оценки"
measures: fear_of_negative_evaluation
direction: higher_is_worse
diagnoses: [F40]
filled_by: patient
source: "КР F40, приложение Г17, стр. PDF 142–144"

answer_sets:
  agree5:
    - {value: 1, label: "Совсем не характеризует меня"}
    - {value: 2, label: "Слегка характеризует меня"}
    - {value: 3, label: "Умеренно характеризует меня"}
    - {value: 4, label: "В большой степени характеризует меня"}
    - {value: 5, label: "Полностью характеризует меня"}

items:
  - {id: 1, text: "Меня волнует мнение других людей обо мне, даже если я знаю, что оно не имеет особого значения.", answers: agree5}
  - {id: 2, text: "Я переживаю, если знаю, что обо мне составили неблагоприятное впечатление.", answers: agree5}
  - {id: 3, text: "Я очень переживаю из-за того, что окружающие могут заметить мои недостатки.", answers: agree5}
  - {id: 4, text: "Я беспокоюсь о том, какое произвожу впечатление на окружающих.", answers: agree5}
  - {id: 5, text: "Я боюсь того, что окружающие могут относиться ко мне с неодобрением.", answers: agree5}
  - {id: 6, text: "Я боюсь, что ко мне могут придраться.", answers: agree5}
  - {id: 7, text: "Я озабочен тем, какое мнение обо мне составили окружающие.", answers: agree5}
  - {id: 8, text: "Когда я с кем-нибудь разговариваю, я не перестаю думать о том, какое впечатление я произвожу на своего собеседника.", answers: agree5}
  - {id: 9, text: "Я всегда думаю о том, какое впечатление я произвожу на других людей.", answers: agree5}
  - {id: 10, text: "Если я знаю, что кто-то меня оценивает, я начинаю волноваться.", answers: agree5}
  - {id: 11, text: "Иногда мне кажется, что я слишком сильно озабочен тем, что обо мне думают окружающие.", answers: agree5}
  - {id: 12, text: "Я часто беспокоюсь о том, что могу сказать или сделать что-то неправильно.", answers: agree5}

scoring:
  method: sum
  bands:
    - {lower: 12, upper: 23, code: low,      level: 0, label: "Низкий уровень страха негативной оценки"}
    - {lower: 24, upper: 46, code: moderate, level: 1, label: "Средний уровень страха негативной оценки"}
    - {lower: 47, upper: 60, code: high,     level: 3, label: "Высокий уровень страха негативной оценки"}
