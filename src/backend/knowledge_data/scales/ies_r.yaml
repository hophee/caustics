# IES-R (ШОВТС) — КР F43.1, приложение Г4. Кто заполняет, в КР не указано; бланк — самоотчёт.
# Баллы ответов по описанию КР: никогда 0, редко 1, иногда 3, часто 5. Все пункты прямые.
# Пороговых значений в КР нет.
code: IES-R
version: 1
name: "IES-R · шкала оценки влияния травматического события"
measures: trauma_impact
direction: higher_is_worse
diagnoses: [F43.1]
filled_by: patient
source: "КР F43.1, приложение Г4, стр. PDF 166–169"

answer_sets:
  freq:
    - {value: 0, label: "Никогда"}
    - {value: 1, label: "Редко"}
    - {value: 3, label: "Иногда"}
    - {value: 5, label: "Часто"}

items:
  - {id: 1, text: "Любое напоминание об этом событии заставляло меня заново переживать всё случившееся", answers: freq}
  - {id: 2, text: "Я не мог спокойно спать по ночам", answers: freq}
  - {id: 3, text: "Некоторые вещи заставляли меня всё время думать о том, что со мной случилось", answers: freq}
  - {id: 4, text: "Я чувствовал постоянное раздражение и гнев", answers: freq}
  - {id: 5, text: "Я не позволял себе расстраиваться, когда думал об этом событии или что то напоминало мне о нём", answers: freq}
  - {id: 6, text: "Я думал о случившемся против своей воли", answers: freq}
  - {id: 7, text: "Мне казалось, что всего случившегося как будто бы не было на самом деле или всё, что тогда происходило, было нереальным", answers: freq}
  - {id: 8, text: "Я старался избегать всего, что напоминало мне о случившемся", answers: freq}
  - {id: 9, text: "Отдельные картины случившегося внезапно возникали в сознании", answers: freq}
  - {id: 10, text: "Я был всё время напряжен и сильно вздрагивал, если что то внезапно пугало меня", answers: freq}
  - {id: 11, text: "Я старался не думать о случившемся", answers: freq}
  - {id: 12, text: "Я понимал, что меня до сих пор буквально переполняют тяжёлые переживания по поводу того, что случилось, но ничего не делал, чтобы их избежать", answers: freq}
  - {id: 13, text: "Я чувствовал что то вроде оцепенения, и все мои переживания по поводу случившегося были как будто парализованы", answers: freq}
  - {id: 14, text: "Я вдруг замечал, что действую или чувствую себя так, как будто бы всё ещё нахожусь в этой ситуации", answers: freq}
  - {id: 15, text: "Мне было трудно заснуть", answers: freq}
  - {id: 16, text: "Меня буквально захлёстывали непереносимо тяжёлые переживания, связанные с той ситуацией", answers: freq}
  - {id: 17, text: "Я старался вытеснить случившееся из памяти", answers: freq}
  - {id: 18, text: "Мне было трудно сосредоточить своё внимание на чём либо", answers: freq}
  - id: 19
    text: "Когда что то напоминало мне о случившемся, я испытывал неприятные физические ощущения – потел, дыхание сбивалось, начинало тошнить, учащался пульс и т. д."
    answers: freq
  - {id: 20, text: "Мне снились тяжёлые сны о том, что со мной случилось", answers: freq}
  - {id: 21, text: "Я был постояно насторожен и всё время ожидал, что случится что то плохое", answers: freq}
  - {id: 22, text: "Я старался ни с кем не говорить о случившемся", answers: freq}

scoring:
  method: sum
  subscales:
    - {code: IN, name: "Вторжение", items: [1, 2, 3, 6, 9, 16, 20]}
    - {code: AV, name: "Избегание", items: [5, 7, 8, 11, 12, 13, 17, 22]}
    - {code: AR, name: "Физиологическая возбудимость", items: [4, 10, 14, 15, 18, 19, 21]}
  bands: []
